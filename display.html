<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אג"ח ומורשים — הון כשר</title>
<style>
  /* Alef — אותו גופן של האתר (SIL OFL), מאורח בריפו */
  @font-face{font-family:'Alef';font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/alef/alef-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Alef';font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/alef/alef-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Alef';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/alef/alef-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Alef';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/alef/alef-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#274d5b; --navy2:#1c3a47;
    --accent:#2aada1; --accent-dark:#1e8f85; --accent-bg:#e9f6f5; --accent-border:#b9e3de;
    --bg:#ffffff; --bg2:#ffffff; --border:#dfe7e8; --row-alt:#f6fafa;
    --text:#3b3d3d; --muted:#6a7c82; --light:#a6b4b8;
    --red:#c0392b;
  }
  body{font-family:'Alef','Heebo','Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;padding:0 0 3rem}
  .wrap{max-width:1100px;margin:0 auto;padding:1.5rem}

  /* ── ניווט: שורה אחת, באותו סגנון של תפריט האתר ── */
  .nav-tabs{display:flex;gap:0;margin-bottom:1.5rem;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .nav-tabs button{
    flex:1;min-width:150px;padding:.9rem 1rem;font-size:18px;font-weight:700;font-family:inherit;
    background:transparent;color:var(--navy);border:none;border-top:3px solid transparent;cursor:pointer;transition:.15s
  }
  .nav-tabs button:hover{color:var(--accent-dark)}
  .nav-tabs button.active{color:var(--accent-dark);border-top-color:var(--accent);background:var(--accent-bg)}

  /* ── בקרות ── */
  .list-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.75rem;flex-wrap:wrap}
  .list-title{font-size:26px;font-weight:400;line-height:1.4;color:var(--navy)}
  .list-title .cnt{font-size:15px;font-weight:500;color:var(--muted);margin-inline-start:.4rem}
  .search{padding:.5rem .9rem;font-size:14px;font-family:inherit;border:1px solid var(--border);border-radius:3px;min-width:220px;background:var(--bg2)}
  .search:focus{outline:none;border-color:var(--accent)}
  .btn-csv{padding:.5rem 1rem;font-size:13px;font-weight:600;font-family:inherit;background:var(--navy);color:#fff;border:none;border-radius:3px;cursor:pointer;white-space:nowrap;transition:.15s}
  .btn-csv:hover{background:var(--accent-dark)}
  .head-tools{display:flex;gap:.5rem;align-items:center}

  /* ── טבלה ── */
  .table-wrap{overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:3px}
  table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:16px;min-width:760px}
  thead th{background:var(--accent-bg);color:var(--navy);font-weight:700;text-align:right;padding:10px 12px;border-bottom:1px solid var(--border)}
  tbody td{padding:9px 12px;border-bottom:1px solid #edf2f2;overflow-wrap:anywhere}
  /* פס מפריד בין עמודות (RTL: הגבול בצד שמאל של כל תא, חוץ מהאחרון) */
  thead th:not(:last-child), tbody td:not(:last-child){border-left:1px solid var(--border)}
  tbody tr:nth-child(even){background:var(--row-alt)}
  tbody tr:hover{background:var(--accent-bg)}
  tbody tr:last-child td{border-bottom:none}
  th.ctr{text-align:center}
  td.ctr{text-align:center;white-space:nowrap}
  thead th{white-space:normal;line-height:1.25;vertical-align:middle}
  td.nw{white-space:nowrap;overflow-wrap:normal}
  .name-cell{font-weight:500}
  .num{font-variant-numeric:tabular-nums;text-align:center;direction:ltr;white-space:nowrap}
  .up{color:var(--accent-dark)} .down{color:var(--red)}
  .badge-yes{display:inline-block;background:var(--accent-bg);color:var(--accent-dark);border:1px solid var(--accent-border);border-radius:3px;padding:1px 9px;font-size:12px;font-weight:600}
  .badge-bad{display:inline-block;background:#fdecea;color:var(--red);border:1px solid #f3b8b0;border-radius:3px;padding:1px 9px;font-size:13px;font-weight:700}
  .bond-note{font-size:12px;color:var(--muted);margin-top:3px;white-space:normal;line-height:1.3}
  .bonds-none{color:var(--muted);font-size:15px}
  .badge-no{color:var(--light);font-size:13px}
  .state{padding:2.5rem 1rem;text-align:center;color:var(--muted)}
  .state.err{color:var(--red)}
  /* בתוך iframe: רקע שקוף, בלי פס גלילה פנימי (הגובה מדווח לעמוד האב) */
  html.embed{overflow:hidden}
  /* גלילה לרוחב: סרגל גלילה נוסף מעל הטבלה (הסרגל התחתון נמצא בסוף הטבלה הארוכה ולכן לא נראה) */
  .hscroll-top{overflow-x:auto;overflow-y:hidden;height:16px;margin-bottom:3px;display:none}
  .hscroll-top div{height:1px}
  body.embed{background:transparent;padding:0}
  body.embed .wrap{max-width:none;padding:0}
  body.no-nav .nav-tabs{display:none}
  .sample-note{background:#fff8e6;border:1px solid #eadfb0;color:#8a6d1a;font-size:13px;padding:.6rem .9rem;border-radius:8px;margin-bottom:.75rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav-tabs" id="navTabs">
    <button data-type="companies-private" class="active">חברות עם היתר עסקה פרטי</button>
    <button data-type="companies-general">חברות עם היתר עסקה כללי</button>
    <button data-type="bonds-private">אג"ח עם היתר עסקה פרטי</button>
    <button data-type="bonds-general">אג"ח עם היתר עסקה כללי</button>
  </div>

  <!-- כאן מוזרקת הרשימה. אותו container משמש לכל 4 התצוגות. -->
  <div id="listContainer"></div>
</div>

<script src="xlsx-lite.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG — לשנות לכתובת האתר בעת הטמעה באתר אחר
// ═══════════════════════════════════════════════════════════════
const API_BASE = "https://harav-levin.pages.dev"; // "" when hosted on the same site

// הגדרת העמודות לכל סוג רשימה
const COLUMNS = {
  companies: [
    { key:"permit_name", px:240,        label:"שם החברה",            cell:"name",  w:28 },
    { key:"chp_number", px:110,         label:'ח"פ',                 cell:"num",   w:12 },
    { key:"category", px:125,           label:"קטגוריה",                         w:14 },
    { key:"region", px:85,             label:"אזור",                            w:8  },
    { key:"has_private_permit", px:125, label:"קיים היתר עסקה פרטי", cell:"yesno", w:14, generalOnly:true },
    { key:"bonds_status", px:215,       label:'אג"ח',                cell:"bonds", w:20 },
    { key:"notes", px:230,              label:"הערות",                           w:22 },
  ],
  bonds: [   // מפתחות לפי הקבצים הסטטיים data/bonds_list/*.json (נבנים מדף החברה במאיה)
    { key:"security_name", px:165,  label:'אג"ח',                 cell:"name",  w:15 },
    { key:"symbol", px:115,         label:"סימול",                                w:8  },
    { key:"security_id", px:110,    label:"מספר נייר",            cell:"num",   w:8  },
    { key:"security_type", px:120,  label:"סוג נייר",                             w:10 },
    { key:"company", px:200,        label:"חברה",                 cell:"name",  w:19 },
    { key:"is_private", px:125,     label:"קיים היתר עסקה פרטי", cell:"yesno", w:12, generalOnly:true },
    { key:"annual_interest", px:85,label:"ריבית %",              cell:"pct",   w:7  },
    { key:"redemption_date", px:120,label:"מועד פדיון",                           w:10 },
    { key:"linkage", px:160,        label:"הצמדה",                                w:12 },
    { key:"last_price", px:95,     label:"שער אחרון",            cell:"num",   w:8  },
    // השדה AnnualYield של הבורסה: כנראה תשואה ל-12 החודשים האחרונים / מתחילת שנה (טרם אומת)
    { key:"ytm_gross", px:120,      label:"תשואה לפדיון ברוטו",   cell:"pct",   w:9  },   // לא צמוד בלבד (scripts/bonds_list/enrich.py)
    { key:"midroog_rating", px:115, label:"דירוג מידרוג",                         w:8  },
    { key:"maalot_rating", px:115,  label:"דירוג מעלות",                          w:8  },
    { key:"annual_yield", px:105,   label:"תשואה שנתית",          cell:"pct",   w:9  },
    { key:"notes",          label:"הערות",                                w:14 },
  ],
};

// נתוני דוגמה — מוצגים רק אם ה-API לא זמין (כדי לראות את העיצוב)
const SAMPLE = {
  "bonds-private": [
    {security_name:"אאורה אגח יז",symbol:"אארה.ק17",company:"אאורה השקעות בע\"מ",annual_interest:"3.85",redemption_date:"31/01/2029",linkage:"מדד המחירים לצרכן",last_price:113.87},
  ],
  "bonds-general": [
    {security_name:"אמות אגח ד",symbol:"אמת.ק4",company:"אמות השקעות בע\"מ",annual_interest:"3.20",redemption_date:"02/07/2028",linkage:"מדד המחירים לצרכן",last_price:121.19},
  ],
  "companies-private": [
    {permit_name:"אאורה השקעות בע\"מ",chp_number:"520038274",category:"נדל\"ן",region:"מרכז",has_private_permit:"כן",bonds_status:'יש אג"ח - מאושר'},
    {permit_name:"א. לוי השקעות ובנין בע\"מ",chp_number:"520041096",category:"נדל\"ן",region:"מרכז",has_private_permit:"כן",bonds_status:'יש אג"ח - לא מאושר'},
  ],
  "companies-general": [
    {permit_name:"אמות השקעות בע\"מ",chp_number:"520037649",category:"נדל\"ן",region:"מרכז",has_private_permit:"כן",bonds_status:'יש אג"ח - מאושר'},
    {permit_name:"חברה כללית לדוגמה",chp_number:"510000000",category:"מסחר",region:"צפון",bonds_status:'אין אג"ח'},
  ],
};

const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
// עד 2 ספרות אחרי הנקודה, בלי אפסים מיותרים (8.13420 -> 8.13, 3.50000 -> 3.5)
const fmtPct = v => { if (v === null || v === undefined || v === "") return ""; const n = Number(v); return Number.isFinite(n) ? String(parseFloat(n.toFixed(2))) : String(v); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

// ── רכיב יחיד: טוען ומצייר רשימה אחת לתוך container ──
async function mountList(container, type) {
  const topic = type.startsWith("bonds") ? "bonds" : "companies";
  const level = type.split("-")[1];                       // private | general
  const cols  = COLUMNS[topic].filter(c => !c.generalOnly || level === "general");
  container.innerHTML = '<div class="state">טוען…</div>';

  let rows = null, usedSample = false;
  try {
    if (topic === "bonds") {
      // רשימת האג"ח היחידה: הקבצים שנבנים כל יום מדף החברה במאיה (רק חברות מאושרות)
      const res = await fetch(`${API_BASE}/data/bonds_list/bonds_${type.split("-")[1]}.json`);
      if (!res.ok) throw new Error("bonds file " + res.status);
      const data = await res.json();
      rows = (data.rows || []).map(r => ({ ...r, security_name: String(r.security_name || "").replace(/\s+/g, " ").trim() }));
    } else {
      const res = await fetch(`${API_BASE}/api/lists?type=${type}`);
      const data = await res.json();
      if (data && data.ok) rows = data.rows;
      else throw new Error(data?.error || "bad response");
    }
  } catch (e) {
    rows = SAMPLE[type] || [];
    usedSample = true;
  }

  const state = { rows, filtered: rows, cols, topic };
  render(container, state, type, usedSample);
}

function render(container, state, type, usedSample) {
  container.innerHTML = "";

  if (usedSample) {
    container.appendChild(el("div","sample-note",
      'מוצגים נתוני דוגמה בלבד — ה-API לא נענה. אחרי פריסת <code>lists.js</code> יוצגו הנתונים האמיתיים.'));
  }

  const head = el("div","list-head");
  const title = el("div","list-title");
  const label = state.topic === "bonds" ? "איגרות חוב" : "חברות";
  title.innerHTML = `${label} <span class="cnt">(${state.filtered.length})</span>`;
  const tools = el("div","head-tools");
  const search = el("input","search"); search.type="search"; search.placeholder="חיפוש…";
  const csvBtn = el("button","btn-csv","⬇ ייצוא לאקסל");
  csvBtn.onclick = () => {   // קובץ Excel כטבלה: כל השורות של הרשימה, עם העמודות המוצגות
    const cellVal = (c, r) => c.cell === "bonds" ? (r[c.key] || (Number(r.approved) === 1 ? 'יש אג"ח - מאושר' : 'אין אג"ח')) : (c.cell === "pct" ? (r[c.key] === "" || r[c.key] == null ? "" : parseFloat(Number(r[c.key]).toFixed(2))) : (r[c.key] ?? ""));
    downloadXlsx(type, type.startsWith("bonds") ? "איגרות חוב" : "חברות", state.cols.map(c => c.label),
      state.rows.map(r => state.cols.map(c => cellVal(c, r))), state.cols.map(c => c.cell === "pct" || (c.cell === "num" && c.key !== "chp_number")));
  };
  tools.append(search, csvBtn);
  head.append(title, tools);
  container.appendChild(head);

  const wrap = el("div","table-wrap");
  const table = el("table");
  const colgroup = el("colgroup");
  // רוחב עמודה מינימלי בפיקסלים (c.w * 11, לפחות 70). הטבלה לא מתכווצת מתחת לסכום, ובמקום זה יש גלילה לרוחב;
  // כשיש מקום, הרוחב העודף מתחלק לפי היחס.
  const colPx = state.cols.map(c => c.px || Math.max(70, Math.round(c.w * 11)));
  state.cols.forEach((c, i) => { const col = el("col"); col.style.width = colPx[i] + "px"; colgroup.appendChild(col); });
  table.style.minWidth = colPx.reduce((a, b) => a + b, 0) + "px";
  table.appendChild(colgroup);
  const thead = el("thead");
  const trh = el("tr");
  state.cols.forEach(c => trh.appendChild(el("th", ["num","pct","chg","badge","bonds","yesno"].includes(c.cell) ? "ctr" : null, esc(c.label))));
  thead.appendChild(trh);
  const tbody = el("tbody");
  table.append(thead, tbody);
  wrap.appendChild(table);
  // סרגל גלילה לרוחב עליון, מסונכרן עם הטבלה (מוצג רק כשיש גלילה לרוחב)
  const topBar = el("div","hscroll-top"), topInner = el("div");
  topBar.appendChild(topInner);
  let syncing = false;
  const syncFrom = (src, dst) => () => { if (syncing) return; syncing = true; dst.scrollLeft = src.scrollLeft; syncing = false; postHeaderSpec(); postHscroll(); };
  topBar.addEventListener("scroll", syncFrom(topBar, wrap));
  wrap.addEventListener("scroll", syncFrom(wrap, topBar));
  const updateTop = () => { topInner.style.width = table.scrollWidth + "px"; topBar.style.display = table.scrollWidth > wrap.clientWidth + 1 ? "block" : "none"; postHscroll(); };
  hscrollWrap = wrap;
  new ResizeObserver(updateTop).observe(wrap);
  container.appendChild(topBar);
  container.appendChild(wrap);
  updateTop();

  const draw = () => {
    tbody.innerHTML = "";
    if (!state.filtered.length) {
      const tr = el("tr");
      const td = el("td"); td.colSpan = state.cols.length;
      td.className = "state"; td.textContent = "אין רשומות להצגה";
      tr.appendChild(td); tbody.appendChild(tr);
      return;
    }
    for (const row of state.filtered) {
      const tr = el("tr");
      for (const c of state.cols) tr.appendChild(cellFor(c, row[c.key], row));
      tbody.appendChild(tr);
    }
    title.innerHTML = `${label} <span class="cnt">(${state.filtered.length})</span>`;
  };

  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    state.filtered = !q ? state.rows : state.rows.filter(r =>
      state.cols.some(c => String(r[c.key] ?? "").toLowerCase().includes(q)));
    draw();
  });

  draw();
  postHeaderSpec();
}

const NOWRAP_KEYS = new Set(["symbol","redemption_date","security_type","linkage","midroog_rating","maalot_rating","chp_number","category","last_price"]);
function cellFor(col, val, row) {
  const td = el("td");
  if (NOWRAP_KEYS.has(col.key)) td.className = "nw";
  if (col.cell === "name") { td.className = "name-cell"; td.textContent = val ?? ""; return td; }
  if (col.cell === "num")  { td.className = "num"; td.textContent = val ?? ""; return td; }
  if (col.cell === "pct")  { td.className = "num"; td.textContent = fmtPct(val); return td; }
  if (col.cell === "chg")  {
    td.className = "num";
    if (val == null || val === "") { td.textContent = ""; return td; }
    const n = Number(val);
    if (n > 0) td.classList.add("up");
    else if (n < 0) td.classList.add("down");
    td.textContent = (n > 0 ? "+" : "") + n.toFixed(2) + "%";
    return td;
  }
  if (col.cell === "yesno") {   // קיים היתר עסקה פרטי: כן / לא
    td.className = "ctr";
    td.innerHTML = val === "כן" ? '<span class="badge-yes">כן</span>' : '<span class="bonds-none">לא</span>';
    return td;
  }
  if (col.cell === "bonds") {
    // אין אג"ח (טקסט פשוט) | יש אג"ח - מאושר (ירוק ✓) | יש אג"ח - לא מאושר (אדום ✕)
    // תאימות לאחור: אם ה-API הישן שלח רק approved (0/1)
    const st = val || (row && Number(row.approved) === 1 ? 'יש אג"ח - מאושר' : 'אין אג"ח');
    td.className = "ctr";
    if (st.startsWith("אין"))            td.innerHTML = '<span class="bonds-none">אין אג"ח</span>';
    else if (st.includes("לא מאושר"))    td.innerHTML = '<span class="badge-bad">יש אג"ח - לא מאושר ✕</span>';
    else if (st.includes("מסוימים"))      td.innerHTML = '<span class="badge-yes">יש אג"ח - מאושר ✓</span><div class="bond-note">אג"ח מסוימים</div>';
    else                                  td.innerHTML = '<span class="badge-yes">יש אג"ח - מאושר ✓</span>';
    if (row && row.bonds_note) td.innerHTML += `<div class="bond-note">${esc(row.bonds_note)}</div>`;   // הערה על אישור האג"ח
    return td;
  }
  if (col.cell === "badge") {
    td.className = "ctr";
    td.innerHTML = Number(val) === 1
      ? '<span class="badge-yes">מאושר ✓</span>'
      : '<span class="badge-no">—</span>';
    return td;
  }
  td.textContent = val ?? "";
  return td;
}

// ── ניווט ──
// ?type=companies-private|companies-general|bonds-private|bonds-general  בוחר לשונית פעילה
// ?nav=0  מסתיר את הלשוניות ומציג רשימה אחת בלבד
const VALID = ["companies-private","companies-general","bonds-private","bonds-general"];
const params = new URLSearchParams(location.search);
let current = VALID.includes(params.get("type")) ? params.get("type") : "companies-private";
if (window.parent !== window) document.documentElement.classList.add("embed"), document.body.classList.add("embed");
if (params.get("nav") === "0") document.body.classList.add("no-nav");

const container = document.getElementById("listContainer");
const tabs = document.getElementById("navTabs");

function refresh() {
  [...tabs.children].forEach(b => b.classList.toggle("active", b.dataset.type === current));
  mountList(container, current);
}
tabs.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  current = b.dataset.type;
  refresh();
});

// מדווח לעמוד האב את גובה התוכן, כדי שה-iframe יתאים את עצמו (ללא פס גלילה פנימי)
function reportHeight() {
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  window.parent.postMessage({ source: "harav-levin", type: "resize", height: h }, "*");
}
new ResizeObserver(() => { reportHeight(); applySticky(); postHeaderSpec(); postHscroll(); }).observe(document.body);

// ── כותרת קבועה יציבה (גרסה 3): ה-iframe שולח לעמוד האב את מבנה שורת הכותרת, ועמוד האב בונה ממנה סרגל position:fixed
// "אמיתי" (בלי תנועה אסינכרונית מתוך ה-iframe, לכן בלי רעידות). הסרגל מופיע בדיוק כשהכותרת המקורית עוברת את ה-OFFSET.
// עמוד אב בלי גרסה 3 מתעלם מההודעה הזאת (ואז עובד המנגנון הישן, translateY).
// ── גלילה לרוחב: סרגל קבוע בתחתית החלון (גרסה 4 של קוד ההטמעה) - ה-iframe מדווח מידות ומיקום גלילה, ועמוד האב שולח חזרה את המיקום
let hscrollWrap = null, lastHs = "";
function postHscroll() {
  if (window.parent === window || !hscrollWrap) return;
  const t = hscrollWrap.querySelector("table"); if (!t) return;
  const r = hscrollWrap.getBoundingClientRect();
  const m = { source: "harav-levin", type: "hscroll", sw: t.scrollWidth, cw: hscrollWrap.clientWidth, left: Math.round(hscrollWrap.scrollLeft),
              x: Math.round(r.left), top: Math.round(r.top + window.scrollY), h: Math.round(r.height) };
  const k = JSON.stringify(m); if (k === lastHs) return; lastHs = k;
  window.parent.postMessage(m, "*");
}
window.addEventListener("message", e => {
  const d = e.data;
  if (e.source !== window.parent || !d || d.source !== "harav-parent" || d.type !== "setScroll" || !hscrollWrap) return;
  if (Math.abs(hscrollWrap.scrollLeft - d.left) > 1) hscrollWrap.scrollLeft = d.left;
});
let lastSpec = "";
function postHeaderSpec() {
  if (window.parent === window) return;
  const table = container.querySelector("table");
  if (!table || !table.tHead) return;
  const ths = [...table.tHead.querySelectorAll("th")];
  if (!ths.length) return;
  const tr = table.getBoundingClientRect(), hr = table.tHead.getBoundingClientRect();
  const cs = getComputedStyle(ths[0]);
  const spec = {
    source: "harav-levin", type: "header",
    tableTop: Math.round(tr.top + window.scrollY), tableH: Math.round(tr.height), h: Math.round(hr.height),
    bg: cs.backgroundColor, color: cs.color, fw: cs.fontWeight, fs: cs.fontSize,
    border: cs.borderBottomWidth + " solid " + cs.borderBottomColor,
    cells: ths.map(th => { const r = th.getBoundingClientRect(), c = getComputedStyle(th);
      return { t: th.textContent.trim(), x: Math.round(r.left), w: Math.round(r.width), a: c.textAlign,
               bl: c.borderLeftWidth + " solid " + c.borderLeftColor, pad: c.paddingRight }; }),
  };
  const key = JSON.stringify(spec);
  if (key === lastSpec) return;
  lastSpec = key;
  window.parent.postMessage(spec, "*");
}

// ── כותרת קבועה (freeze panes) במחשב ──
// ה-iframe מתארך לפי התוכן והגלילה היא של עמוד האב, ולכן עמוד האב שולח לכאן את מיקום ה-iframe ביחס לחלון
// (top), וכאן מזיזים את שורת הכותרת כך שתישאר צמודה לחלק העליון של החלון (offset = גובה כותרת קבועה של האתר, אם יש).
let stick = { top: 0, offset: 0, on: false };
let stickMsgs = 0;
window.addEventListener("message", e => {
  const d = e.data;
  if (e.source !== window.parent || !d || d.source !== "harav-parent" || d.type !== "scroll") return;
  stickMsgs++;
  stick = { top: Number(d.top) || 0, offset: Number(d.offset) || 0, on: !!d.desktop };
  applySticky();
  showDebug();
});
// ?debug=1 ב-src של ה-iframe: תג אבחון קטן בפינה - האם עמוד האב שולח את מיקום הגלילה (כותרת קבועה דורשת את קוד ה-iframe העדכני בעמוד)
function showDebug() {
  if (new URLSearchParams(location.search).get("debug") !== "1") return;
  let el = document.getElementById("stick-debug");
  if (!el) { el = document.createElement("div"); el.id = "stick-debug"; el.style.cssText = "position:fixed;top:4px;left:4px;z-index:99;font:12px sans-serif;background:#fff8e6;border:1px solid #eadfb0;padding:3px 8px;direction:ltr"; document.body.appendChild(el); }
  el.textContent = stickMsgs ? `sticky: parent connected (${stickMsgs} msgs, top=${Math.round(stick.top)}, desktop=${stick.on})` : "sticky: NO messages from the parent page (update the embed code)";
}
if (window.parent !== window) setTimeout(showDebug, 1500);
function applySticky() {
  const table = container.querySelector("table"); if (!table) return;
  const ths = table.querySelectorAll("thead th");
  let delta = 0;
  if (stick.on) {
    const headBottom = table.tHead.offsetHeight;
    const natural = stick.top + table.getBoundingClientRect().top;      // מיקום הכותרת (הטבעי) ביחס לחלון
    delta = Math.max(0, Math.min(stick.offset - natural, table.offsetHeight - headBottom - 2));
  }
  ths.forEach(th => {
    th.style.transform = delta ? `translateY(${delta}px)` : "";
    th.style.position = delta ? "relative" : "";
    th.style.zIndex = delta ? "2" : "";
    th.style.boxShadow = delta ? "0 2px 3px -1px rgba(0,0,0,.18)" : "";
  });
}

refresh(); // טעינה ראשונית
</script>
</body>
</html>
