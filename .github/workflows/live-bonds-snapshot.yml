name: Live bonds snapshot (one-off)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/serene-pasteur-02932s]
    paths: [scripts/bonds_list/fetch_live_snapshot.py, .github/workflows/live-bonds-snapshot.yml]
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/bonds_list/fetch_live_snapshot.py
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add reports/live_bonds
          git diff --staged --quiet && exit 0
          git commit -m "live-bonds snapshot: $(date -u +%FT%TZ)"
          git pull --rebase --autostash; git push
