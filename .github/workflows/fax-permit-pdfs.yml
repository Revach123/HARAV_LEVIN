name: Fax versions of permit PDFs

# גרסה לפקס של כל שטר (docs-fax/ ב-R2): שחור-לבן חד, 200x300 (הרזולוציה שהספק משדר), דחיסת פקס. המקור לא משתנה.
# אוטומטי: כל חצי שעה, לשטרות שהועלו ב-3 הימים האחרונים. ידני (Run workflow): all=true מעבד את כל השטרות שעוד אין להם; apply=false זה dry-run.
# סודות: CF_D1_AND_R2_TOKEN + CF_ACCOUNT_ID (כמו compress-new-permits).
on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:
    inputs:
      all: { description: "כל השטרות שאין להם גרסת פקס (לא רק החדשים)", type: boolean, default: false }
      apply: { description: "להעלות ל-R2 (בלי זה dry-run)", type: boolean, default: true }
      redo: { description: "להפיק מחדש גם שטרות שכבר יש להם גרסת פקס", type: boolean, default: false }
      limit: { description: "מקסימום מסמכים (0 = הכל)", default: "0" }

permissions:
  contents: read

concurrency:
  group: fax-permit-pdfs
  cancel-in-progress: false

jobs:
  fax:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_AND_R2_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install wrangler
        run: npm install -g wrangler@4 >/dev/null 2>&1
      - name: Count pending (auto)
        id: pend
        if: github.event_name == 'schedule'
        run: python3 -u scripts/fax_permit_pdfs.py --new-days 3 --count
      - name: Install tools
        if: github.event_name != 'schedule' || steps.pend.outputs.pending != '0'
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils >/dev/null && pip install -q pillow numpy img2pdf
      - name: Build fax versions
        if: github.event_name != 'schedule' || steps.pend.outputs.pending != '0'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 -u scripts/fax_permit_pdfs.py --new-days 3 --apply --limit 40
          else
            ARGS=""; [ "${{ inputs.apply }}" = "true" ] && ARGS="$ARGS --apply"
            [ "${{ inputs.redo }}" = "true" ] && ARGS="$ARGS --redo"
            [ "${{ inputs.all }}" != "true" ] && ARGS="$ARGS --new-days 3"
            timeout 6600 python3 -u scripts/fax_permit_pdfs.py $ARGS --limit ${{ inputs.limit }}
          fi
