name: Fax quality trial (manual)

# ניסוי איכות: מפיק גרסת ניסוי של שטר אחד (1-bit Flate, A4 1728x2292) ושולח אותה בפקס למספר שצוין (דרך האתר). ידני בלבד.
# קלטים: doc_id (מזהה שטר מ-permit_docs), fax (מספר הפקס לבדיקה). סודות: CF_D1_AND_R2_TOKEN, CF_ACCOUNT_ID, CRON_SECRET.
on:
  workflow_dispatch:
    inputs:
      doc_id: { description: "מזהה השטר", required: true }
      fax: { description: "מספר פקס לבדיקה", required: true }

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_AND_R2_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install tools
        run: |
          npm install -g wrangler@4 >/dev/null 2>&1
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils >/dev/null
          pip install -q pillow numpy img2pdf
      - name: Build and send trial
        run: python3 -u scripts/fax_trial.py "${{ inputs.doc_id }}" "${{ inputs.fax }}"
