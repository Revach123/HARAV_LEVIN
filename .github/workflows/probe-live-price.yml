name: Probe live price (one-off)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/serene-pasteur-02932s]
    paths: [scripts/bonds_list/probe_live_price.py, .github/workflows/probe-live-price.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/bonds_list/probe_live_price.py
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add reports/live_price_probe.json
          git diff --staged --quiet && exit 0
          git commit -m "live-price probe: $(date -u +%FT%TZ)"
          git pull --rebase --autostash; git push
