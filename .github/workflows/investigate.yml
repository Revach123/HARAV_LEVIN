name: Registry investigation (one-off)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/serene-pasteur-02932s]
    paths: [scripts/registry_refresh/investigate.py, .github/workflows/investigate.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
        run: python scripts/registry_refresh/investigate.py
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add reports/registry_refresh/investigation.json
          git diff --staged --quiet && exit 0
          git commit -m "registry investigation: $(date -u +%FT%TZ)"
          git pull --rebase --autostash; git push
