name: Name Accuracy Audit

# הרצה על-פי-דרישה (workflow_dispatch) - בדיקת איכות נתונים לרשימת
# companies-all: (1) האם השם השמור לכל עסק תואם לשם הרשמי העדכני ברשם
# (data.gov.il, דרך /api/lookup - אותו endpoint שהמנהל כבר משתמש בו),
# (2) אילו עסקים ברשימה יש להם שם דומה מספיק לבלבל משתמש שמחפש בלי ח.פ.
#
# מיועד לחומר שאפשר להראות למנהל האתר. פלט נכתב ל-reports/registry_audit/
# בריפו (ר' "Commit report" למטה), וגם מועלה כ-artifact.

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check name accuracy + find similar names
        run: python scripts/registry_audit/check_name_accuracy.py

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: name-accuracy-audit-report
          path: scripts/registry_audit/out/
          retention-days: 30

      - name: Commit report
        if: always()
        run: |
          mkdir -p reports/registry_audit
          for f in name_accuracy_report.json name_accuracy_report.csv \
                   similar_names_report.json similar_names_report.csv; do
            if [ -f "scripts/registry_audit/out/$f" ]; then
              cp "scripts/registry_audit/out/$f" "reports/registry_audit/$f"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/registry_audit/
          git diff --staged --quiet && echo "אין שינויים" && exit 0
          git commit -m "name-accuracy-audit: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase --autostash
          git push
