name: Compress new permit PDFs (auto)

# דחיסה אוטומטית של שטרות חדשים: בודק אם הועלו מסמכים גדולים שעוד אין להם גרסה קלה (docs-lite/), ודוחס אותם.
# מופעל מיד אחרי העלאת שטר (functions/api/permit-docs.js, אם מוגדר הסוד GH_DISPATCH_TOKEN), ובנוסף כל חצי שעה כרשת ביטחון.
# עד שהדחיסה מסתיימת השטר מוצג מהמקור (כמו קודם); אחריה - מהגרסה הקלה. המקור לא משתנה לעולם.
# המעקב: הטבלה permit_doc_lite ב-D1 (נוצרת אוטומטית), ורק מסמכים מה-3 ימים האחרונים. ריצה בלי מסמכים ממתינים לא מתקינה כלום ונגמרת בתוך חצי דקה.
# סודות: CF_D1_AND_R2_TOKEN + CF_ACCOUNT_ID (אותם סודות כמו compress-permit-pdfs). אפשר גם להפעיל ידנית (Run workflow).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compress-permit-pdfs
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_AND_R2_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install wrangler
        run: npm install -g wrangler@4 >/dev/null 2>&1
      - name: Count pending
        id: pend
        run: python3 -u scripts/compress_permit_pdfs.py --new-days 3 --count
      - name: Install PDF tools
        if: steps.pend.outputs.pending != '0'
        run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript poppler-utils >/dev/null
      - name: Compress new documents
        if: steps.pend.outputs.pending != '0'
        run: timeout 1800 python3 -u scripts/compress_permit_pdfs.py --new-days 3 --apply --limit 40
