name: Probe TASE securitydata (read-only, manual)

# בדיקה חד-פעמית של שדות נתוני הנייר בבורסה (תאריך הנפקה וכד'), לצורך "אג"ח שהונפקו לאחרונה". לא משנה כלום באתר.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bonds_list/probe_terms.py
      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/probe
          git diff --staged --quiet && echo "אין שינויים" && exit 0
          git commit -m "probe-securitydata: $(date -u +%FT%TZ)"
          git pull --rebase --autostash -X theirs
          git push
