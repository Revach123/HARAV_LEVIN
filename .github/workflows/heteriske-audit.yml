name: Full Audit (heteriske.com + name accuracy)

# הרצה חד-פעמית/על-פי-דרישה (workflow_dispatch) - מריצה את כל הבדיקות
# ביחד, ריצה אחת:
#
#   1-3. heteriske.com audit - משווה את רשימת העסקים ב-heteriske.com מול
#        הרשימה שלנו (/api/lists?type=companies-all), ומנסה לפתור ח.פ.
#        לכל עסק ב-heteriske דרך המרשם המלא של revach.pages.dev
#        (חברות/שותפויות/עמותות). ריצה ארוכה (שעה-שעתיים, תלוי כמה שמות
#        לא נפתרים בטייר המהיר).
#   4. heteriske name accuracy - לכל עסק ב-heteriske: האם השם שם תואם
#      *למאגר שבנינו* (לא ל-data.gov.il) - נגזר מקומית מפלט resolve_chp.py,
#      בלי קריאת רשת נוספת (מיידי).
#   5. similar names (במאגר שלנו) - בתוך רשימת companies-all שלנו, אילו
#      זוגות עסקים (ח.פ. שונה) יש להם שם דומה מספיק לבלבל משתמש שמחפש
#      בלי ח.פ. גם זה מקומי/מיידי.
#
# רץ מהריפו הציבורי הזה (לא מ-Revach123/Revach) כי זו ריצה ארוכה ודקות
# Actions כאן חינמיות/ללא הגבלה.
#
# פלט: כל שלב כותב ל-scripts/<תיקייה>/out/, מועלה כ-artifact (30 יום),
# וגם נכתב ל-reports/<תיקייה>/ בריפו (ר' צעדי "Commit report" למטה) כדי
# שהדוחות יהיו קריאים ב-git בלי תלות בהורדת artifact.
#
# resolve_chp.py שומר checkpoint ל-git תוך כדי הריצה (לא רק בסוף) - אם
# הריצה נעצרת/נכשלת/עוברת timeout באמצע, ריצה חדשה על אותו checkout
# ממשיכה מאיפה שהקודמת עצרה במקום להתחיל מאפס.

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"   # פלט חי בלוג במקום מצטבר בבאפר עד סוף הצעד

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity (for mid-run checkpoint commits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── heteriske.com audit ──────────────────────────────────────────
      - name: Scrape heteriske.com
        run: python scripts/heteriske_audit/scrape_heteriske.py

      - name: Compare against our own companies-all list
        run: python scripts/heteriske_audit/compare_registry.py

      - name: Resolve ח.פ. numbers via revach.pages.dev registry, verify on heteriske.com
        run: python scripts/heteriske_audit/resolve_chp.py

      - name: Build heteriske name-accuracy report (vs. our own database, local/instant)
        if: always()
        run: |
          if [ -f "scripts/heteriske_audit/out/heteriske_businesses_with_chp.json" ]; then
            python scripts/heteriske_audit/build_name_accuracy_report.py
          fi

      - name: Upload heteriske audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heteriske-audit-report
          path: scripts/heteriske_audit/out/
          retention-days: 30

      - name: Commit heteriske audit report
        if: always()
        run: |
          mkdir -p reports/heteriske_audit
          for f in comparison_report.json comparison_missing_in_harav_levin.csv \
                   comparison_missing_in_heteriske.csv heteriske_businesses_with_chp.json \
                   heteriske_businesses_with_chp.csv heteriske_similar_candidates.json \
                   heteriske_similar_candidates.csv heteriske_name_accuracy_report.json \
                   heteriske_name_accuracy_report.csv; do
            if [ -f "scripts/heteriske_audit/out/$f" ]; then
              cp "scripts/heteriske_audit/out/$f" "reports/heteriske_audit/$f"
            fi
          done
          git add reports/heteriske_audit/
          if git diff --staged --quiet; then
            echo "אין שינויים"
          else
            git commit -m "heteriske-audit: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase --autostash
            git push
          fi

      # ── similar names within our own database (local, no external calls) ──
      - name: Find similar-name pairs in our own companies-all list
        if: always()
        run: python scripts/registry_audit/check_similar_names.py

      - name: Upload similar-names audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: similar-names-audit-report
          path: scripts/registry_audit/out/
          retention-days: 30

      - name: Commit similar-names audit report
        if: always()
        run: |
          mkdir -p reports/registry_audit
          for f in similar_names_report.json similar_names_report.csv; do
            if [ -f "scripts/registry_audit/out/$f" ]; then
              cp "scripts/registry_audit/out/$f" "reports/registry_audit/$f"
            fi
          done
          git add reports/registry_audit/
          if git diff --staged --quiet; then
            echo "אין שינויים"
          else
            git commit -m "similar-names-audit: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase --autostash
            git push
          fi
