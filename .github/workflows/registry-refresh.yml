name: Registry refresh (businesses)

# מחליף את ה-Worker "registry-updater": מרענן שם רשמי + סוג עסק מ-data.gov.il ודגל "יש אג"ח" מ-datawise.
# ברירת מחדל: בדיקה בלבד (לא כותב ל-D1). כתיבה: הרצה ידנית עם apply=true, ורק אם הוגדרו הסודות
# CF_ACCOUNT_ID ו-CF_D1_TOKEN (טוקן עם עריכה ל-business-registry-db בלבד).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "כתיבה ל-D1 (true) או בדיקה בלבד (false)"
        type: boolean
        default: false
      scope:
        description: "מה לעדכן: all = שמות + סוגים + דגל אג\"ח (כמו הריצה היומית, כ-6 דקות); bonds = דגל אג\"ח בלבד (קצר); names = שמות וסוגים בלבד"
        type: choice
        options: [all, bonds, names]
        default: all
  schedule:
    - cron: "40 2 * * *"
  push:
    branches:
      - claude/serene-pasteur-02932s
    paths:
      - .github/workflows/registry-refresh.yml
      - scripts/registry_refresh/refresh_businesses.py

permissions:
  contents: write

concurrency:
  group: registry-refresh
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Refresh businesses
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) || github.event_name == 'schedule' }}
          SCOPE: ${{ inputs.scope || 'all' }}   # בריצה מתוזמנת (schedule) אין inputs, לכן all
        run: |
          if [ "$APPLY" = "true" ]; then python scripts/registry_refresh/refresh_businesses.py --apply --scope "$SCOPE"
          else python scripts/registry_refresh/refresh_businesses.py --scope "$SCOPE"; fi
      # עדכון שנכתב ל-D1 (שמות / סוגים / דגל אג"ח) - Revach בונה מחדש את רשימת ההיתרים מיד
      # (heter-refresh.yml שם). בלי הסוד REVACH_DISPATCH_TOKEN - מדלג, והשינוי ייכנס בריצה היומית של Revach.
      - name: Notify Revach
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.apply) || github.event_name == 'schedule')
        env:
          TOKEN: ${{ secrets.REVACH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "REVACH_DISPATCH_TOKEN not set - skipping"; exit 0; fi
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Revach123/Revach/dispatches \
            -d '{"event_type":"heter-changed","client_payload":{"reason":"registry-refresh"}}')
          echo "GitHub: $code"; [ "$code" = "204" ] || { cat /tmp/r.txt; echo "::warning::Revach notify failed ($code)"; }
      - name: Commit report
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add reports/registry_refresh
          git diff --staged --quiet && echo "אין שינויים" && exit 0
          git commit -m "registry-refresh: $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push
