name: Registry spot check (one-off)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/serene-pasteur-02932s]
    paths: [scripts/registry_refresh/spot_check.py, .github/workflows/spot-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/registry_refresh/spot_check.py
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add reports/registry_refresh/spot_check.json
          git diff --staged --quiet && exit 0
          git commit -m "registry spot check: $(date -u +%FT%TZ)"
          git pull --rebase --autostash; git push
