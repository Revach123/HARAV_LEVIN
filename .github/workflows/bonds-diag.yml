name: Bonds diagnose (one-off)
on:
  workflow_dispatch: {}
  push:
    branches: [claude/serene-pasteur-02932s]
    paths: [scripts/bonds_list/diagnose_missing.py, .github/workflows/bonds-diag.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/bonds_list/diagnose_missing.py
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add reports/bonds_diag.json
          git diff --staged --quiet && exit 0
          git commit -m "bonds-diag: $(date -u +%FT%TZ)"
          git pull --rebase --autostash; git push
