name: Compare bond sources (read-only, manual)

# השוואת שלושה מקורות לאג"ח: דפי החברה במאיה, datawise, ונתוני המסחר של הבורסה. לא משנה רשימות; שומר דוח אחד ב-data/probe.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bonds_list/compare_sources.py
      - name: Commit report
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/probe
          git diff --staged --quiet && echo "אין שינויים" && exit 0
          git commit -m "compare-bond-sources: $(date -u +%FT%TZ)"
          git pull --rebase --autostash -X theirs
          git push
