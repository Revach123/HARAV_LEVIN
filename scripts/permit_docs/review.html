<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת היתרי עיסקא</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#d9dde5;--acc:#1f5fbf;--ok:#1a7f4b;--warn:#b26a00}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--ink:#e8ebf1;--mut:#9aa3b5;--line:#343b49;--acc:#6aa3ff;--ok:#4cc38a;--warn:#e0a040}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font-size:16px}.mut{color:var(--mut);font-size:13px}
#banner{display:none;background:var(--warn);color:#fff;padding:6px 14px;font-size:14px}
#banner button{margin-inline-start:8px}
#top{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--card);border-bottom:1px solid var(--line);max-height:36vh}
#top>*{min-height:0;overflow:auto}
#q{padding:10px 14px;border-inline-start:1px solid var(--line)}
@media(max-width:900px){#top{grid-template-columns:1fr;max-height:46vh}#q{border-inline-start:0}}
#cards{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start;padding:8px 14px}
.card{border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:220px;flex:1;font-size:12px;line-height:1.35}
.card.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.card h4{margin:0 0 4px;font-size:15px}.card .row{display:flex;gap:6px}.card .row i{font-style:normal;color:var(--mut);min-width:78px}
textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:54px;resize:vertical}
.sec{margin:6px 0}.sec h3{margin:0 0 4px;font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)}button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
button.primary{background:var(--ok);color:#fff;border-color:var(--ok)}
.why{font-size:12px;color:var(--mut)}
.kind{margin:4px 0;padding:4px 8px;border-radius:8px;font-size:12px;border:1px solid var(--line)}
.kind-shared{background:#e8f4ff;border-color:#9cc8f5}.kind-multi{background:#fff4d6;border-color:#e8c36a}
input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:220px}
#res{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#viewer{flex:1;min-height:260px}#viewer iframe{width:100%;height:100%;border:0;background:#888}
footer{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--card);border-top:1px solid var(--line)}
footer .sp{flex:1}
</style>
</head>
<body>
<header><b>בדיקת היתרי עיסקא</b><span id="prog" class="mut"></span><span class="sp" style="flex:1"></span>
<label class="mut"><input type="checkbox" id="showAns"> הצג גם שנענו</label>
<button id="refresh">רענן נתונים</button></header>
<div id="banner">הקבצים התעדכנו (הריצה הסתיימה). <button id="r2">רענן עכשיו</button></div>
<div id="top"><div id="cards"></div><div id="q"></div></div>
<div id="viewer"><iframe id="pdf"></iframe></div>
<footer><button id="prev">→ הקודם</button><span class="mut" id="fname"></span><span class="sp"></span>
<button class="primary" id="next">שמור והבא ←</button></footer>
<script>
let items=[],dec={},biz=[],mt=0,idx=0,ans={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(keep){
  const cur=items[idx]?.aid;
  const r=await (await fetch("/api/items")).json();
  mt=r.mtime;items=r.items;dec=r.decisions;
  if(!biz.length)biz=await (await fetch("/api/businesses")).json();
  $("banner").style.display="none";
  const list=visible();
  idx=keep&&cur?Math.max(0,list.findIndex(i=>i.aid===cur)):firstOpen(list);
  if(idx<0)idx=0;show();
}
const visible=()=>items.filter(i=>$("showAns").checked||!dec[i.aid]);
const firstOpen=l=>l.length?0:-1;
function show(){
  const list=visible();const it=list[idx];
  const done=items.filter(i=>dec[i.aid]).length;
  $("prog").textContent=`נענו ${done} מתוך ${items.length} · מוצג ${list.length?idx+1:0}/${list.length}`;
  if(!it){$("cards").innerHTML="";$("q").innerHTML="<h3>אין עוד קבצים לבדיקה 🎉</h3>";$("pdf").removeAttribute("src");$("fname").textContent="";return}
  const d=dec[it.aid]||{};
  const ids=(d.company_ids||d.company_id||"").split(";").filter(Boolean),nms=(d.company_names||d.company_name||"").split(";");
  ans={type:d.type_answer||"",cids:ids.map((id,i)=>({id,name:nms[i]||""})),cspec:d.company_special||""};
  let h=`<div class="why">${it.reasons.map(esc).join(" · ")}${it.doc_type ? ` · סיווג לפי מיקום באתר: <b>${esc(it.doc_type)}</b>` : ""}</div>`;
  if(it.multi_kind&&it.multi_kind!=="יחיד")h+=`<div class="kind kind-${it.multi_kind==="מסמך משותף"?"shared":"multi"}"><b>${esc(it.multi_kind)}</b>${it.multi_kind==="מסמך משותף"?" (ח.פ.-ים קרובים זה לזה)":" (ח.פ.-ים בעמודים שונים - מועמד לפיצול)"}<br><span class="mut">${esc(it.hp_pages)}</span></div>`;
  h+=`<div class="mut">קובץ: ${esc(it.file)} · כותרת הפוסט: ${esc(it.post_title)||"—"}${it.linked_in?` · מקושר ב: ${esc(it.linked_in)}`:""}</div>`;
  if(it.ask_type){
    h+=`<div class="sec"><h3>כללי או פרטי? <span class="mut">(לפי המיקום: ${esc(it.doc_type)}; ${esc(it.text_check)})</span></h3><div class="btns" id="tb">`+
    ["כללי","פרטי","כללי + פרטי","לא ברור"].map(t=>`<button data-t="${t}" class="${ans.type===t?"sel":""}">${t}</button>`).join("")+`</div></div>`;
  }
  if(it.ask_company){
    h+=`<div class="sec"><h3>לאיזו חברה שייך המסמך? <span class="mut">(${esc(it.status)})</span></h3><div class="btns" id="cb">`+
    it.cands.map(c=>`<button data-id="${esc(c.id)}" data-n="${esc(c.name)}" class="${hasC(c.id)?"sel":""}">${esc(c.name)} <span class="why">${esc(c.chp)} · ${esc(c.why)}</span></button>`).join("")+
    ["מסמך קבוצתי (כמה חברות)","החברה לא במאגר","מסמך לא רלוונטי","לא ברור"].map(t=>`<button data-s="${t}" class="${ans.cspec===t?"sel":""}">${t}</button>`).join("")+
    `</div><div style="margin-top:4px"><input type="text" id="srch" placeholder="חיפוש חברה אחרת בשם או בח.פ."><div id="res"></div></div>`+
    (it.doc_name_matches?`<div class="why">שמות שנמצאו בקובץ: ${esc(it.doc_name_matches)}</div>`:"")+
    (it.doc_hps_not_in_db?`<div class="why">ח.פ. בקובץ שאינו במאגר: ${esc(it.doc_hps_not_in_db)}</div>`:"")+`</div>`;
  }
  if((it.dups||[]).length)h+=`<div class="sec"><label><input type="checkbox" id="applyDups" checked> יש ${it.dups.length} קבצים זהים לקובץ הזה בדיוק (מספרים ${it.dups.slice(0,6).join(", ")}${it.dups.length>6?"…":""}): להחיל עליהם את אותה תשובה</label></div>`;
  h+=`<div class="sec"><h3>ביאור חופשי — מה יש בקובץ</h3><textarea id="note" placeholder="כתוב כאן בטקסט חופשי מה כתוב במסמך, למי הוא שייך, כל דבר שחשוב לדעת"></textarea></div>`;
  $("q").innerHTML=h;$("note").value=d.note||"";renderCards(it);
  $("fname").textContent=it.file;
  $("pdf").src="/pdf?id="+encodeURIComponent(it.aid);
  $("tb")?.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ans.type=b.dataset.t;mark("tb",b)});
  $("cb")?.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.id){toggleC(b.dataset.id,b.dataset.n);b.classList.toggle("sel",hasC(b.dataset.id));if(ans.cspec&&ans.cspec!==GRP)ans.cspec="";syncSpecials()}
    else{const sp=b.dataset.s;ans.cspec=ans.cspec===sp?"":sp;if(ans.cspec&&ans.cspec!==GRP)ans.cids=[];syncSpecials();document.querySelectorAll("#cb button[data-id]").forEach(x=>x.classList.toggle("sel",hasC(x.dataset.id)))}
    renderCards(visible()[idx])});
  $("srch")?.addEventListener("input",e=>{const v=e.target.value.trim();if(v.length<2){$("res").innerHTML="";return}
    $("res").innerHTML=biz.filter(b=>b.name.includes(v)||b.permit_name.includes(v)||b.chp.includes(v)).slice(0,12)
    .map(b=>`<button data-id="${esc(b.id)}" data-n="${esc(b.name)}" class="${hasC(b.id)?"sel":""}">${esc(b.name)} <span class="why">${esc(b.chp)}</span></button>`).join("")});
  $("res")?.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;toggleC(b.dataset.id,b.dataset.n);b.classList.toggle("sel",hasC(b.dataset.id));
    if(ans.cspec&&ans.cspec!==GRP)ans.cspec="";syncSpecials();renderCards(visible()[idx])});
}
const GRP="מסמך קבוצתי (כמה חברות)";
const hasC=id=>ans.cids.some(c=>c.id===id);
function toggleC(id,name){const i=ans.cids.findIndex(c=>c.id===id);if(i>=0)ans.cids.splice(i,1);else ans.cids.push({id,name})}
function syncSpecials(){document.querySelectorAll("#cb button[data-s]").forEach(x=>x.classList.toggle("sel",ans.cspec===x.dataset.s))}
const VC={"רק כללי":"",};
function card(b,on,why){const dd=b.docs||{};
  const r=(k,v)=>v?`<div class="row"><i>${k}</i><span>${esc(v)}</span></div>`:"";
  return `<div class="card ${on?"on":""}"><h4>${esc(b.name)}${why?` <span class="why">(${esc(why)})</span>`:""}</h4>`+
  r("ח.פ.",b.chp)+r("שם ברשם",b.registrar_name)+r("שם בהיתר",b.permit_name)+r("סוג גוף",b.entity_type)+r("קטגוריה",b.category)+r("אזור",b.region)+
  r("במאגר שלנו",b.visibility)+r("אישור אג\"ח",b.agch)+r("הערות במאגר",b.notes)+
  r("מסמכים שנמצאו",`כללי ${dd.general||0} · פרטי ${dd.private||0} · לא ידוע ${dd.unknown||0}`)+
  `<div class="why">סטטוס רשם החברות אינו זמין בכלי המקומי; מצוי במאגר הנפרד</div></div>`}
function renderCards(it){
  const byId=Object.fromEntries(biz.map(b=>[b.id,b]));
  const ids=it.cands.map(c=>c.id);ans.cids.forEach(c=>{if(!ids.includes(c.id))ids.push(c.id)});
  const h=ids.map(id=>{const c=it.cands.find(x=>x.id===id);const b=byId[id];return b?card(b,hasC(id),c?.why):""}).join("");
  $("cards").innerHTML=h||`<span class="mut">לא זוהתה חברה מועמדת. חפש חברה בשדה החיפוש שבשאלה.</span>`}
function mark(id,b){document.querySelectorAll("#"+id+" button").forEach(x=>x.classList.remove("sel"));document.querySelectorAll("#res button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")}
async function save(){
  const it=visible()[idx];if(!it)return;
  if(!ans.type&&!ans.cids.length&&!ans.cspec&&!$("note").value){return false}
  const d={attachment_id:it.aid,file:it.file,type_answer:ans.type,company_id:ans.cids[0]?.id||"",company_name:ans.cids[0]?.name||"",
    company_ids:ans.cids.map(c=>c.id).join(";"),company_names:ans.cids.map(c=>c.name).join(";"),company_special:ans.cspec,note:$("note").value,
    apply_dups:!!($("applyDups")&&$("applyDups").checked)};
  await fetch("/api/answer",{method:"POST",body:JSON.stringify(d)});dec[it.aid]=d;
  if(d.apply_dups)for(const o of it.dups||[])dec[o]={...d,attachment_id:o,same_as:it.aid};return true;
}
$("next").onclick=async()=>{const before=visible();const it=before[idx];const saved=await save();
  const after=visible();
  if(saved&&!$("showAns").checked){/* the item left the list; same index now points to the next */ if(idx>=after.length)idx=Math.max(0,after.length-1)}
  else{idx=Math.min(idx+1,Math.max(0,after.length-1))}
  show()};
$("prev").onclick=()=>{idx=Math.max(0,idx-1);show()};
$("showAns").onchange=()=>{idx=0;show()};
$("refresh").onclick=()=>load(true);$("r2").onclick=()=>load(true);
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowLeft")$("next").click();if(e.key==="ArrowRight")$("prev").click()});
setInterval(async()=>{try{const r=await (await fetch("/api/mtime")).json();if(mt&&r.mtime>mt)$("banner").style.display="block"}catch(e){}},15000);
load(false);
</script>
</body>
</html>
