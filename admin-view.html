<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צפייה במסד הנתונים · ניהול</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#1a3a5c; --navy2:#1e4570; --gold:#c9a227;
    --bg:#f7f7f5; --bg2:#fff; --border:#e0ddd8;
    --text:#1a1a1a; --muted:#6b6b6b; --light:#a0a0a0;
    --red:#c0392b; --green:#1e7e4a;
  }
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;padding:0 0 3rem}
  header{background:var(--navy);color:#fff;height:52px;display:flex;align-items:center;padding:0 1.25rem}
  header h1{font-size:16px;font-weight:600}
  header h1 .gold{color:var(--gold)}
  .wrap{max-width:1400px;margin:0 auto;padding:1.25rem}

  .nav{display:flex;gap:.6rem;margin-bottom:1rem}
  .nav button{
    flex:1;max-width:260px;padding:.8rem 1rem;font-size:15px;font-weight:600;font-family:inherit;
    background:var(--bg2);color:var(--navy);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:.15s
  }
  .nav button:hover{border-color:var(--navy)}
  .nav button.active{background:var(--navy);color:#fff;border-color:var(--navy)}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.75rem;flex-wrap:wrap}
  .toolbar .info{font-size:14px;font-weight:600;color:var(--navy)}
  .toolbar .info .cnt{font-weight:500;color:var(--muted);margin-inline-start:.3rem}
  .tools{display:flex;gap:.5rem;align-items:center}
  .search{padding:.5rem .9rem;font-size:14px;font-family:inherit;border:1px solid var(--border);border-radius:8px;min-width:240px;background:var(--bg2)}
  .search:focus{outline:none;border-color:var(--navy)}
  .btn-csv{padding:.5rem 1rem;font-size:13px;font-weight:600;font-family:inherit;background:var(--navy);color:#fff;border:none;border-radius:8px;cursor:pointer;white-space:nowrap}
  .btn-csv:hover{background:var(--navy2)}

  .table-wrap{overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:10px;max-height:75vh;overflow-y:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  thead th{background:#f0efec;color:var(--navy);font-weight:600;text-align:right;padding:9px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;cursor:pointer;user-select:none}
  thead th:hover{background:#e7e5e0}
  thead th .arrow{color:var(--gold);font-size:11px;margin-inline-start:3px}
  tbody td{padding:7px 12px;border-bottom:1px solid #f4f3f0;max-width:280px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover{background:#faf9f7}
  .num{font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
  .state{padding:2.5rem;text-align:center;color:var(--muted)}
  .state.err{color:var(--red)}
</style>
</head>
<body>
<header><h1>מכון להיתר עסקה למהדרין · <span class="gold">צפייה במסד הנתונים</span></h1></header>

<div class="wrap">
  <div class="nav" id="nav">
    <button data-type="companies-all" class="active">רשם החברות</button>
    <button data-type="bonds-all">נתוני אג"ח מלאים</button>
  </div>
  <div id="container"></div>
</div>

<script>
const API_BASE = "https://harav-levin.pages.dev"; // "" when hosted on the same site

const LABELS = { companies: "רשם החברות", bonds: 'נתוני אג"ח מלאים' };

const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const looksNum = v => v !== "" && v != null && !isNaN(Number(v));

let state = { type:"companies-all", rows:[], cols:[], filtered:[], sortCol:null, sortDir:1 };

async function load(type) {
  state.type = type;
  const container = document.getElementById("container");
  container.innerHTML = '<div class="state">טוען…</div>';
  try {
    const res = await fetch(`${API_BASE}/api/lists?type=${type}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "error");
    state.rows = data.rows || [];
    state.cols = state.rows.length ? Object.keys(state.rows[0]) : [];
    state.filtered = state.rows.slice();
    state.sortCol = null; state.sortDir = 1;
    render();
  } catch (e) {
    container.innerHTML = `<div class="state err">שגיאה בטעינה: ${e.message}</div>`;
  }
}

function render() {
  const container = document.getElementById("container");
  container.innerHTML = "";

  const bar = el("div","toolbar");
  const label = state.type.startsWith("bonds") ? LABELS.bonds : LABELS.companies;
  const info = el("div","info"); info.innerHTML = `${label} <span class="cnt">(${state.filtered.length})</span>`;
  const tools = el("div","tools");
  const search = el("input","search"); search.type="search"; search.placeholder="חיפוש בכל העמודות…";
  const csv = el("button","btn-csv","⬇ ייצוא CSV");
  csv.onclick = ()=>{ window.location.href = `${API_BASE}/api/lists?type=${state.type}&format=csv`; };
  tools.append(search, csv);
  bar.append(info, tools);
  container.appendChild(bar);

  const wrap = el("div","table-wrap");
  const table = el("table");
  const thead = el("thead"); const trh = el("tr");
  state.cols.forEach(c=>{
    const th = el("th",null, c + (state.sortCol===c ? `<span class="arrow">${state.sortDir>0?"▲":"▼"}</span>` : ""));
    th.onclick = ()=> sortBy(c);
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  const tbody = el("tbody");
  table.append(thead, tbody);
  wrap.appendChild(table);
  container.appendChild(wrap);

  const draw = ()=>{
    tbody.innerHTML = "";
    if (!state.filtered.length) {
      const tr = el("tr"); const td = el("td"); td.colSpan = state.cols.length || 1;
      td.className="state"; td.textContent="אין רשומות"; tr.appendChild(td); tbody.appendChild(tr); return;
    }
    const frag = document.createDocumentFragment();
    for (const row of state.filtered) {
      const tr = el("tr");
      for (const c of state.cols) {
        const v = row[c];
        const td = el("td");
        if (looksNum(v)) td.className = "num";
        td.textContent = v == null ? "" : v;
        td.title = td.textContent;
        tr.appendChild(td);
      }
      frag.appendChild(tr);
    }
    tbody.appendChild(frag);
    info.innerHTML = `${label} <span class="cnt">(${state.filtered.length})</span>`;
  };

  search.addEventListener("input", ()=>{
    const q = search.value.trim().toLowerCase();
    state.filtered = !q ? state.rows.slice()
      : state.rows.filter(r => state.cols.some(c => String(r[c] ?? "").toLowerCase().includes(q)));
    applySort(); draw();
  });

  state._draw = draw;
  draw();
}

function sortBy(col) {
  if (state.sortCol === col) state.sortDir *= -1;
  else { state.sortCol = col; state.sortDir = 1; }
  applySort();
  render(); // redraw headers with arrow
}

function applySort() {
  if (!state.sortCol) return;
  const c = state.sortCol, dir = state.sortDir;
  state.filtered.sort((a,b)=>{
    const x=a[c], y=b[c];
    const xn=looksNum(x), yn=looksNum(y);
    if (xn && yn) return (Number(x)-Number(y))*dir;
    return String(x??"").localeCompare(String(y??""), "he")*dir;
  });
}

document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("active", x===b));
  load(b.dataset.type);
});

// טעינה ראשונית — או מפרמטר URL אם קיים
const urlType = new URLSearchParams(location.search).get("type");
if (urlType === "bonds-all") {
  document.querySelector('[data-type="bonds-all"]').classList.add("active");
  document.querySelector('[data-type="companies-all"]').classList.remove("active");
  load("bonds-all");
} else {
  load("companies-all");
}
</script>
</body>
</html>
