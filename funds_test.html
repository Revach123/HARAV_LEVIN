<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#274d5b">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<title>מסלולים וקרנות מאושרים</title>
<style>
  @font-face{font-family:'Alef';font-weight:400;font-display:swap;src:url(fonts/alef/alef-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
  @font-face{font-family:'Alef';font-weight:700;font-display:swap;src:url(fonts/alef/alef-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#274d5b;--accent:#2aada1;--accent-border:#b9e3de;--muted:#6a7c82;--line:#dbe7e6;--bg:#f4f7f7;--zebra:#f8fbfb}
  body{font-family:'Alef','Heebo',system-ui,sans-serif;background:var(--bg);color:#3b3d3d;font-size:17px;line-height:1.45;padding:0 .6rem 2rem}
  .wrap{max-width:1150px;margin:0 auto}
  .top{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 -.6rem;padding:0 .6rem .5rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .back{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;padding:0 .9rem;margin:.5rem 0 .3rem;font:inherit;font-size:17px;font-weight:700;color:var(--navy);text-decoration:none;background:#fff;border:2px solid var(--accent-border);border-radius:12px}
  .back::before{content:"\203A";font-size:24px;line-height:1}
  h1{font-size:21px;color:var(--navy);margin:.1rem 0 .4rem}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem}
  .tabs button{font:inherit;font-size:16px;font-weight:700;line-height:1.25;color:var(--navy);background:#fff;border:2px solid var(--accent-border);border-radius:12px;padding:.45rem .6rem;min-height:52px;cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
  .bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  .bar input{flex:1;min-width:200px;font:inherit;font-size:16px;padding:.45rem .7rem;border:2px solid var(--accent-border);border-radius:10px;background:#fff;color:inherit}
  .bar input:focus{outline:none;border-color:var(--accent)}
  .upd{font-size:14px;color:var(--muted);white-space:nowrap}
  .state{text-align:center;color:var(--muted);padding:2.5rem 0}
  table{width:100%;table-layout:fixed;border-collapse:collapse;background:#fff;border:2px solid var(--accent-border);border-radius:10px;overflow:hidden;margin-top:.8rem}
  th{background:var(--navy);color:#fff;font-size:15px;text-align:right;padding:.5rem .6rem;position:sticky;top:0}
  td{padding:.45rem .6rem;border-top:1px solid var(--line);vertical-align:top;font-size:16px}
  td.co{font-weight:700;color:var(--navy);background:#eef6f5;border-left:1px solid var(--line);width:15%}
  td.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
  td.note{font-size:14px;color:var(--muted)}
  tr.sec td{font-weight:700;font-size:16px;padding:.5rem .7rem;border-top:2px solid var(--accent-border)}
  .sec-h{font-weight:700;font-size:16px;padding:.45rem .7rem;border-radius:10px;margin:.9rem 0 .5rem}
  .tp{display:inline-block;font-size:13.5px;font-weight:700;padding:.08rem .5rem;border-radius:20px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  mark{background:#fff3a6;color:inherit;border-radius:3px;padding:0 1px}
  .cards{display:none}
  @media (max-width:760px){
    table{display:none}
    .cards{display:block;margin-top:.8rem}
    .card{background:#fff;border:2px solid var(--accent-border);border-radius:12px;margin-bottom:.7rem;overflow:hidden}
    .card h3{font-size:17px;color:#fff;background:var(--navy);padding:.4rem .7rem}
    .it{padding:.5rem .7rem;border-top:1px solid var(--line)}
    .it:first-of-type{border-top:0}
    .it b{display:block;font-size:16px}
    .it .meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.2rem}
    .it .num{direction:ltr;font-weight:700;font-variant-numeric:tabular-nums}
    .it .note{font-size:14px;color:var(--muted);margin-top:.15rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="back" href="kehilot.html">חזרה</a>
    <h1>רשימת מסלולים וקרנות מאושרים</h1>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-t="pension">קרנות פנסיה, גמל והשתלמות וחיסכון לכל ילד</button>
      <button role="tab" aria-selected="false" data-t="savings">תוכנית חיסכון, ביטוח, גמל להשקעה, קרנות סל</button>
    </div>
    <div class="bar"><input id="q" type="search" placeholder="חיפוש: חברה, מסלול, סוג או מספר קופה" autocomplete="off"><span class="upd" id="upd"></span></div>
  </header>
  <main id="out"><div class="state">טוען…</div></main>
</div>
<script>
const st = { tab: "pension", q: "", rows: [] };
const E = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().replace(/["'׳״`]/g, "").replace(/\s+/g, " ").trim();
// צבע לפי סוג (כמו בצבעים של הרשימה הקודמת): גוון קבוע לכל סוג
const TYPE_COL = [["פנסיה", "#ede4f7", "#6a3fa0"], ["פנסיונרים", "#f6eedb", "#8a6410"], ["לשכירים", "#e3ebf5", "#244a7c"], ["להשקעה", "#e2f4e7", "#1d7a3e"], ["השתלמות", "#f7e6dc", "#93451f"], ["ילד", "#e2f0fa", "#1d6497"], ["סל", "#efe5f7", "#6b2f9a"], ["נאמנות", "#eceff1", "#37474f"], ["כספית", "#fdecdc", "#b35a00"], ["ביטוח", "#e2f3fb", "#0d6d96"], ["בטוח", "#e2f3fb", "#0d6d96"], ["חיסכון", "#e2f3fb", "#0d6d96"]];
function hl(s) {
  const q = st.q.trim(); if (!q) return E(s);
  const i = String(s).toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return E(s);
  return E(s.slice(0, i)) + "<mark>" + E(s.slice(i, i + q.length)) + "</mark>" + E(s.slice(i + q.length));
}
function groups(list) {          // שורות רצופות של אותה חברה ואותו סוג = קבוצה אחת
  const out = [];
  for (const r of list) { const g = out[out.length - 1]; if (g && g.co === r.company && g.type === r.type) g.rows.push(r); else out.push({ co: r.company, type: r.type, rows: [r] }); }          // הרשימה מסודרת לפי סוג מוצר: חברה מאוחדת רק בתוך אותו סוג
  return out;
}
function paint() {
  const out = document.getElementById("out"), q = norm(st.q);
  const list = st.rows.filter(r => r.tab === st.tab && (!q || norm([r.company, r.track, r.type, r.number, r.note].join(" ")).includes(q)));
  if (!list.length) { out.innerHTML = `<div class="state">${q ? "לא נמצאו מסלולים מתאימים" : "אין מסלולים להצגה"}</div>`; return; }
  const sections = [];          // כותרת לכל סוג מוצר (הרשימה מסודרת לפי סוג); בתוך כל סוג - חברה מאוחדת לשורות רצופות
  for (const r of list) { const sc = sections[sections.length - 1]; if (sc && sc.type === r.type) sc.rows.push(r); else sections.push({ type: r.type, rows: [r] }); }
  const tc = t => (TYPE_COL.find(x => t.includes(x[0])) || ["", "#eef2f3", "#3b3d3d"]);
  const tbl = `<table><thead><tr><th style="width:16%">שם חברה</th><th style="width:38%">שם מסלול</th><th style="width:14%">מספר קופה</th><th style="width:32%">הערות</th></tr></thead><tbody>` +
    sections.map(sc => `<tr class="sec"><td colspan="4" style="background:${tc(sc.type)[1]};color:${tc(sc.type)[2]}">${hl(sc.type || "אחר")}</td></tr>` +
      groups(sc.rows).map(g => g.rows.map((r, i) => `<tr>${i === 0 ? `<td class="co" rowspan="${g.rows.length}">${hl(g.co)}</td>` : ""}<td>${hl(r.track)}</td><td class="num">${hl(r.number)}</td><td class="note">${hl(r.note)}</td></tr>`).join("")).join("")).join("") + `</tbody></table>`;
  const cards = `<div class="cards">` + sections.map(sc => `<div class="sec-h" style="background:${tc(sc.type)[1]};color:${tc(sc.type)[2]}">${hl(sc.type || "אחר")}</div>` +
    groups(sc.rows).map(g => `<div class="card">${g.co ? `<h3>${hl(g.co)}</h3>` : ""}${g.rows.map(r => `<div class="it">${r.track ? `<b>${hl(r.track)}</b>` : ""}${r.number ? `<div class="meta"><span class="num">${hl(r.number)}</span></div>` : ""}${r.note ? `<div class="note">${hl(r.note)}</div>` : ""}</div>`).join("")}</div>`).join("")).join("") + `</div>`;
  out.innerHTML = tbl + cards;
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  st.tab = b.dataset.t;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false"));
  paint();
}));
let tm; document.getElementById("q").addEventListener("input", e => { st.q = e.target.value; clearTimeout(tm); tm = setTimeout(paint, 150); });
fetch("/api/glatt-funds").then(r => r.json()).then(d => {
  if (d.error) throw new Error(d.error);
  st.rows = d.rows || [];
  document.getElementById("upd").textContent = d.updated ? "מעודכן " + d.updated : "";
  paint();
}).catch(e => { document.getElementById("out").innerHTML = `<div class="state">הטעינה נכשלה (${E(e.message)}). נסו לרענן את הדף.</div>`; });
</script>
</body>
</html>
