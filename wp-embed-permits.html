<!-- הדבקה בוורדפרס (Avada → Code Block): רשימת שטרות היתר עסקה לפי קטגוריות, עם לשוניות פרטי / כללי.
     הרשימה נגללת בתוך החלון, כך שהלשוניות, החיפוש וכותרת הקטגוריה נשארים קבועים בראש.
     data-offset = גובה הכותרת הקבועה של האתר בפיקסלים (מופחת מגובה החלון); ללשונית פתיחה אחרת: #t=general במקום #t=private -->
<iframe id="iska-permits" src="https://harav-levin.pages.dev/permits.html?embed=1#t=private" title="שטרות היתר עסקה"
  data-offset="140" style="width:100%;border:0;display:block;height:80vh;min-height:560px" allow="clipboard-write"></iframe>
<script>
(function () {
  var f = document.getElementById("iska-permits");
  function fit() { f.style.height = Math.max(560, window.innerHeight - (Number(f.getAttribute("data-offset")) || 140)) + "px"; }
  fit(); window.addEventListener("resize", fit);
})();
</script>
