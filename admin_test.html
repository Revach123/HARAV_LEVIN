<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ניהול · מכון להיתר עסקה למהדרין</title>
<meta name="robots" content="noindex,nofollow">
<script src="/permit-docs-test.js?v=78"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:   #1a3a5c;
    --navy2:  #1e4570;
    --gold:   #c9a227;
    --bg:     #f7f7f5;
    --bg2:    #ffffff;
    --border: #e0ddd8;
    --text:   #1a1a1a;
    --muted:  #6b6b6b;
    --light:  #a0a0a0;
    --red:    #c0392b;
    --green:  #1e7e4a;
    --green-bg: #edf7f1;
    --green-border: #a8d9bc;
    --danger-bg: #fdf0ef;
  }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    color: #fff;
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  header h1 { font-size: 17px; font-weight: 500; letter-spacing: .01em; }
  header small { font-size: 12px; opacity: .65; margin-right: 10px; }
  #admin-toggle {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    color: #fff;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s;
  }
  #admin-toggle:hover { background: rgba(255,255,255,.2); }
  .hdr-btns { display:flex; gap:8px; align-items:center; }
  #pw-btn { background:#fff; color:var(--navy,#274d5b); border:1px solid var(--navy,#274d5b); font-size:13px; padding:6px 14px; border-radius:4px; cursor:pointer; font-family:inherit; }
  #pw-btn:hover { background:var(--accent-bg,#e9f5f4); }

  /* ── MAIN ── */
  main { max-width: 1900px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: .6rem;
    align-items: center;
  }
  .filter-bar .fb-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .filter-bar .fb-label {
    font-size: 10px;
    color: var(--light);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding-right: 2px;
  }
  .filter-bar select, .filter-bar input {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg2);
    font-size: 13px;
    color: var(--text);
    direction: rtl;
    outline: none;
    transition: border-color .15s;
    height: 34px;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--navy); }
  .filter-bar select.active, .filter-bar input.active {
    border-color: var(--navy);
    background: #eef3f9;
    color: var(--navy);
    font-weight: 500;
  }
  .fb-search { flex: 1; min-width: 200px; }
  .clear-filters {
    padding: 6px 12px;
    background: none;
    border: 1px solid #f0b0aa;
    border-radius: 7px;
    font-size: 12px;
    color: var(--red);
    cursor: pointer;
    height: 34px;
    white-space: nowrap;
    transition: background .15s;
    align-self: flex-end;
  }
  .clear-filters:hover { background: var(--danger-bg); }

  /* ── SORTABLE HEADERS ── */
  thead th.sortable {
    cursor: pointer;
    user-select: none;
    position: relative;
    padding-left: 22px;
  }
  thead th.sortable:hover { color: var(--navy); }
  thead th.sort-active { color: var(--navy); font-weight: 600; }
  .sort-icon {
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    opacity: .5;
  }
  thead th.sort-active .sort-icon { opacity: 1; color: var(--navy); }

  /* ── CONTROLS (keep for compat) ── */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .controls input, .controls select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg2);
    font-size: 14px;
    color: var(--text);
    direction: rtl;
    outline: none;
    transition: border-color .15s;
  }
  .controls input { flex: 1; min-width: 200px; }
  .controls input:focus, .controls select:focus { border-color: var(--navy); }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 820px; table-layout: fixed; }
  col.c-num      { width: 36px; }
  col.c-name     { width: 150px; }
  col.c-permit   { width: 190px; }
  col.c-name-lg  { width: 240px; }
  col.c-pdp      { width: 84px; }
  col.c-pdg      { width: 84px; }
  col.c-pdx      { width: 150px; }
  col.c-chp      { width: 80px; }
  col.c-name2    { width: 318px; }
  col.c-details  { width: 235px; }
  td.biz-cell, td.det-cell { white-space: normal; vertical-align: top; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 6px; align-items: center; }
  .kv .k { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .kv .v { min-width: 0; overflow-wrap: anywhere; }
  .pn-same { font-size: 12px; color: var(--muted); }
  .pn-edit { border: 0; background: none; cursor: pointer; font-size: 12px; padding: 0 2px; opacity: .75; }
  .pn-edit:hover { opacity: 1; }
  .sub-add { margin-top: 6px; }
  .sub-add-list > div { font-size: 13px; margin-bottom: 3px; }
  .sub-add-btn { border: 1px dashed var(--border); background: none; color: var(--accent, #1a5c8a); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  .sub-add-btn:hover { background: var(--bg); }
  .sub-add-form { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .sub-add-form input { flex: 1; min-width: 140px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; background: var(--bg); color: var(--text); }
  .sub-add-form select { padding: 3px 4px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; background: var(--bg); color: var(--text); }
  .sub-add-form button { padding: 3px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; cursor: pointer; background: #fff; }
  .sub-add-form .sub-add-x { border: 0; background: none; color: var(--muted); }
  td.det-cell .kv .v { font-size: 12px; }
  td.biz-cell .kv .v.biz-name { white-space: normal; }
  col.c-cat      { width: 80px; }
  col.c-biztype  { width: 80px; }
  col.c-region   { width: 50px; }
  col.c-vis      { width: 108px; }
  col.c-agch-combined { width: 150px; }
  col.c-tase     { width: 62px; }
  col.c-agch     { width: 108px; }
  col.c-notes    { width: 200px; }
  col.c-nscope   { width: 150px; }
  col.c-regst    { width: 80px; }
  col.c-actions  { width: 110px; }
  thead th {
    text-align: right;
    padding: 11px 14px;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: normal;          /* כותרות בשתי שורות כשצריך */
    line-height: 1.25;
    background: var(--bg);
    overflow: hidden;
  }
  /* כותרות קבועות (freeze panes) בגלילת העמוד, במחשב. במסך צר הטבלה נגללת לרוחב ולכן נשארת כמו קודם. */
  @media (min-width: 900px) {
    .table-wrap { overflow: visible; }
    thead th, thead th.sortable { position: sticky; top: 56px; z-index: 6; box-shadow: 0 1px 0 var(--border); }
  }
  thead th:first-child { border-radius: 10px 0 0 0; }
  thead th:last-child  { border-radius: 0 10px 0 0; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: #f0f0ee; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  td { padding: 11px 14px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.notes-cell, td.biz-name { white-space: nowrap; }
  td.num { color: var(--light); font-size: 12px; width: 36px; }
  td.biz-name { font-weight: 500; }
  td.biz-name .permit { color: var(--muted); font-weight: 400; font-size: 13px; }
  td.cat-cell span {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    background: #eef0f5;
    color: var(--muted);
  }
  td.notes-cell { color: var(--light); font-size: 12px; }
  .empty-row td { text-align: center; padding: 2.5rem; color: var(--light); }

  /* ── DELETE MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeInOverlay .15s ease;
  }
  @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: var(--bg2);
    border-radius: 14px;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
    margin: 1rem;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    animation: slideUpModal .18s ease;
  }
  @keyframes slideUpModal { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-icon { font-size: 2.2rem; text-align: center; margin-bottom: .75rem; }
  .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: .4rem; }
  .modal-biz-name {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 14px;
    margin: .75rem 0 1.1rem;
    word-break: break-word;
  }
  .modal-instruction { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .modal-instruction strong { color: var(--red); font-family: monospace; }
  .modal-input {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    direction: ltr;
    text-align: center;
    outline: none;
    transition: border-color .15s;
    letter-spacing: .06em;
  }
  .modal-input:focus { border-color: var(--red); }
  .modal-input.confirmed { border-color: var(--red); background: #fff5f5; }
  .modal-actions { display: flex; gap: 8px; margin-top: 1.1rem; }
  .modal-actions .cancel {
    flex: 1; padding: 10px; background: none;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; color: var(--muted); cursor: pointer;
    transition: border-color .15s;
  }
  .modal-actions .cancel:hover { border-color: var(--navy); color: var(--navy); }
  .modal-actions .confirm-del {
    flex: 1; padding: 10px; background: var(--red);
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; color: #fff; cursor: pointer;
    opacity: .4; transition: opacity .15s;
    pointer-events: none;
  }
  .modal-actions .confirm-del.ready { opacity: 1; pointer-events: auto; }
  .modal-actions .confirm-del.ready:hover { background: #a93226; }

  /* ── ACTION BUTTONS (admin table) ── */
  .act-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 13px;
    transition: background .15s;
    color: var(--muted);
  }
  .act-btn:hover { background: var(--bg); }
  .act-btn.del { color: var(--red); }
  .confirm-row td { background: var(--danger-bg) !important; }
  .confirm-btns { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .confirm-btns .yes {
    background: var(--red); color: #fff;
    border: none; padding: 4px 10px;
    border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  .confirm-btns .no {
    background: none; border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 13px;
    color: var(--muted);
  }

  /* ── PANEL (login / form) ── */

  /* ── מסך ראשי של הניהול + חיפוש במאגר ── */
  .home-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; max-width:900px; margin:2.5rem auto; }
  .home-card.home-gf { padding:.5rem .8rem !important; display:flex; align-items:center; justify-content:center; gap:10px; }
  .home-card.home-gf .ico { display:none !important; }
  .home-card.home-gf b { font-size:clamp(14px,1.15vw,19px) !important; margin:0 !important; line-height:1.25; }
  .gf-tbl { width:100%; border-collapse:collapse; background:var(--bg2); font-size:14px; }
  .gf-tbl th { background:var(--navy); color:#fff; text-align:right; padding:6px 8px; position:sticky; top:0; z-index:1; font-size:13px; }
  .gf-tbl td { padding:3px 4px; border-top:1px solid var(--border); }
  .gf-tbl input { width:100%; box-sizing:border-box; padding:5px 7px; border:1px solid transparent; border-radius:5px; font-size:14px; background:transparent; color:var(--text); font-family:inherit; }
  .gf-tbl input:hover { border-color:var(--border); }
  .gf-tbl input:focus { border-color:var(--accent); background:var(--bg); outline:none; }
  .gf-tbl tr.gf-add td { border-top:0; padding:2px 6px 8px; }
  .gf-tbl tr.gf-sec td { background:var(--bg); color:var(--navy); font-weight:700; font-size:15px; padding:8px 10px; border-top:2px solid var(--navy); }
  .gf-b { border:1px solid var(--border); background:var(--bg); border-radius:5px; padding:2px 7px; margin:0 1px; cursor:pointer; font-size:12px; }
  .gf-b:disabled { opacity:.35; cursor:default; }
  .home-card { background:var(--bg2); border:1.5px solid var(--border); border-radius:14px; padding:1.8rem 1.4rem; text-align:center; cursor:pointer; font-family:inherit; transition:.15s; color:var(--navy); }
  .home-card:hover { border-color:var(--navy); box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-2px); }
  .home-card .ico { font-size:34px; display:block; margin-bottom:10px; }
  .home-card .ico-white { filter: grayscale(1) brightness(0) invert(1); }
  .home-card .home-n { font-size:.8em; font-weight:500; color:inherit; opacity:.85; }
  .home-card b { font-size:18px; display:block; margin-bottom:4px; }
  .home-card span.sub { font-size:13px; color:var(--muted); }
  .gs-box { max-width:900px; margin:0 auto 1rem; }
  .gs-box input { width:100%; padding:12px 16px; font-size:16px; border:1.5px solid var(--border); border-radius:10px; font-family:inherit; background:var(--bg2); }
  .gs-box input:focus { outline:none; border-color:var(--navy); }
  .gs-info { color:var(--muted); font-size:13px; margin:.4rem 0 1rem; }
  .gs-sec { font-size:15px; font-weight:600; color:var(--navy); margin:1.2rem 0 .6rem; }
  .gs-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  .scard { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px; }
  .scard .sh { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .scard .st { font-size:15px; font-weight:600; color:var(--navy); }
  .scard .badge-t { font-size:11px; padding:1px 8px; border-radius:10px; background:#e8eef5; color:var(--navy); white-space:nowrap; }
  .scard .badge-t.bond { background:#e6f4ea; color:var(--green); }
  .scard dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:0; }
  .scard dt { color:var(--muted); }
  .scard dd { margin:0; word-break:break-word; }
  .scard mark { background:#fff3b0; padding:0 1px; border-radius:2px; }
  .scard .sbtn { font-size:12px; padding:3px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); cursor:pointer; font-family:inherit; }
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    max-width: 520px;
    margin: 2rem auto;
  }
  .panel h2 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .panel-header h2 { margin: 0; }

  /* ── FORM ── */
  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    font-size: 14px;
    color: var(--text);
    direction: rtl;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--navy); background: #fff; }
  .field input.ltr { direction: ltr; text-align: left; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── LOOKUP BOX ── */
  .lookup-box {
    background: #f0f4f8;
    border: 1px solid #c8d8ea;
    border-radius: 9px;
    padding: 1.1rem;
    margin-bottom: 1.25rem;
  }
  .lookup-box p.lbl { font-size: 12px; font-weight: 500; color: var(--navy); margin-bottom: 10px; }
  .lookup-row { display: flex; gap: 8px; position: relative; align-items: center; }
  .lookup-row .spin { position: absolute; right: 12px; }
  #chp { padding-right: 38px; }
  .spin { width: 16px; height: 16px; border: 2px solid var(--accent-border); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: hlspin .7s linear infinite; vertical-align: middle; }
  @keyframes hlspin { to { transform: rotate(360deg); } }
  .lookup-loading { display:flex; align-items:center; gap:8px; color: var(--muted); font-size: 13px; margin-top: 8px; }
  .lookup-row input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    direction: ltr;
    text-align: left;
    outline: none;
    transition: border-color .15s;
  }
  .lookup-row input:focus { border-color: var(--navy); }
  .lookup-row button {
    padding: 9px 16px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: background .15s;
  }
  .lookup-row button:hover { background: var(--navy2); }
  .lookup-row button:disabled { opacity: .55; cursor: default; }
  .lookup-result {
    margin-top: 10px;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: 7px;
    padding: 10px 14px;
  }
  .lookup-result .found-name { font-size: 15px; font-weight: 500; margin: 3px 0; }
  .lookup-result .found-meta { font-size: 12px; color: var(--muted); }
  .lookup-error { color: var(--red); font-size: 13px; margin-top: 8px; }

  /* ── BUTTONS ── */
  .btn-primary {
    width: 100%;
    padding: 11px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
    margin-top: .5rem;
  }
  .btn-primary:hover { background: var(--navy2); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s;
  }
  .btn-ghost:hover { border-color: var(--navy); color: var(--navy); }
  .btn-add {
    padding: 8px 16px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-add:hover { background: var(--navy2); }
  .btn-danger {
    padding: 8px 16px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-danger:hover { background: #a93226; }
  .btn-danger:disabled { opacity: .55; cursor: default; }

  /* ── ADMIN BAR ── */
  .admin-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 8px;
  }
  .admin-bar h2 { font-size: 16px; font-weight: 500; color: var(--muted); }

  /* ── ERROR ── */
  .error-msg { color: var(--red); font-size: 13px; margin: 6px 0; min-height: 20px; }

  /* ── STATUS BAR ── */
  #status-bar {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 99;
  }
  #status-bar.show { opacity: 1; }

  /* ── COUNT BADGE ── */
  .count { font-size: 13px; color: var(--muted); }

  /* ── LOADING SPINNER ── */
  .loading {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-size: 14px;
  }

  /* ════════════════════════════════════════════
     CSV IMPORT STYLES
  ════════════════════════════════════════════ */

  .csv-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    max-width: 860px;
    margin: 1.5rem auto;
  }
  .csv-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.75rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px solid var(--border);
  }
  .csv-panel-header h2 { font-size: 18px; font-weight: 500; }

  /* Drop Zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    background: var(--bg);
    position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--navy);
    background: #f0f4f8;
  }
  .drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-zone .dz-icon { font-size: 2.5rem; margin-bottom: .75rem; }
  .drop-zone .dz-title { font-size: 15px; font-weight: 500; color: var(--navy); margin-bottom: .3rem; }
  .drop-zone .dz-sub { font-size: 13px; color: var(--muted); }
  .drop-zone .dz-btn {
    display: inline-block;
    margin-top: 1rem;
    padding: 8px 20px;
    background: var(--navy);
    color: #fff;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
  }

  /* Column mapping */
  .mapping-section { margin-bottom: 1.5rem; }
  .mapping-section h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: .9rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .mapping-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .mapping-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .mapping-row label { font-size: 12px; color: var(--muted); }
  .mapping-row select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    font-size: 13px;
    color: var(--text);
    direction: rtl;
    outline: none;
    cursor: pointer;
    transition: border-color .15s;
  }
  .mapping-row select:focus { border-color: var(--navy); }
  .mapping-row select.mapped { border-color: var(--green); background: var(--green-bg); }

  /* Preview table */
  .preview-section { margin-bottom: 1.5rem; }
  .preview-section h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: .75rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .preview-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 9px;
    max-height: 260px;
    overflow-y: auto;
  }
  .preview-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .preview-wrap thead th {
    padding: 8px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  .preview-wrap tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .preview-wrap tbody tr:hover { background: #f5f5f3; }
  .preview-wrap td { padding: 8px 12px; }

  /* Confirm box */
  .confirm-import-box {
    background: #fff8e6;
    border: 1px solid #f0d070;
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1.25rem;
    font-size: 14px;
  }
  .confirm-import-box strong { color: var(--red); }
  .confirm-import-box .ci-count { color: var(--green); font-weight: 500; }

  /* Progress */
  .progress-wrap { margin: 1.5rem 0; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar-bg {
    background: var(--border);
    border-radius: 20px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--navy);
    border-radius: 20px;
    transition: width .15s;
  }
  .progress-phase {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }

  /* Done summary */
  .done-box {
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: 10px;
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .done-box .done-icon { font-size: 2.5rem; margin-bottom: .5rem; }
  .done-box h3 { font-size: 17px; font-weight: 500; color: var(--green); margin-bottom: .4rem; }
  .done-box p { font-size: 14px; color: var(--muted); }
  .done-error-box {
    background: var(--danger-bg);
    border: 1px solid #f0b0aa;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-top: .75rem;
    font-size: 13px;
    color: var(--red);
    max-height: 120px;
    overflow-y: auto;
  }

  /* Steps indicator */
  .steps {
    display: flex;
    gap: 0;
    margin-bottom: 1.75rem;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .step {
    flex: 1;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--light);
    background: var(--bg);
    text-align: center;
    border-left: 1px solid var(--border);
    transition: all .2s;
  }
  .step:last-child { border-left: none; }
  .step.active { background: var(--navy); color: #fff; font-weight: 500; }
  .step.done { background: var(--green-bg); color: var(--green); }
  /* Alef — אותו גופן של האתר (SIL OFL), מאורח בריפו */
  @font-face{font-family:'Alef';font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/alef/alef-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Alef';font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/alef/alef-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Alef';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/alef/alef-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Alef';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/alef/alef-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  /* ═══ התאמה לעיצוב האתר (display.html): גופן Alef, צבעי navy/טורקיז, כותרות טבלה בירקרק בהיר ═══ */
  :root {
    --navy:#274d5b; --navy2:#1c3a47;
    --accent:#2aada1; --accent-dark:#1e8f85; --accent-bg:#e9f6f5; --accent-border:#b9e3de; --row-alt:#f6fafa;
    --bg:#f6fafa; --bg2:#ffffff; --border:#dfe7e8;
    --text:#3b3d3d; --muted:#6a7c82; --light:#a6b4b8;
    --green:#1e8f85; --green-bg:#e9f6f5; --green-border:#b9e3de;
  }
  body { font-family:'Alef','Heebo','Assistant',system-ui,-apple-system,'Segoe UI',sans-serif; background:#ffffff; font-size:16px; }
  button, input, select, textarea { font-family: inherit; }
  header { background: #fff; color: var(--navy); border-bottom: 3px solid var(--accent); box-shadow: none; }
  header h1 { font-size: 20px; font-weight: 700; color: var(--navy); }
  .logo-link { display: flex; align-items: center; text-decoration: none; }
  #site-logo { height: 46px; width: auto; display: block; }
  #admin-toggle { border-radius: 4px; background: var(--navy); color: #fff; border: 1px solid var(--navy); }
  #admin-toggle:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn-primary, .btn-add, .lookup-row button { border-radius: 4px; font-weight: 700; }
  .btn-primary:hover, .btn-add:hover, .lookup-row button:hover { background: var(--accent-dark); }
  .btn-ghost { border-radius: 4px; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent-dark); }
  .panel, .table-wrap, .csv-panel { border-radius: 4px; }
  thead th { background: var(--accent-bg); color: var(--navy); font-weight: 700; font-size: 13px; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--accent-bg); }
  .admin-bar h2, .panel h2, .panel-header h2 { color: var(--navy); font-weight: 700; }
  .home-card { border-radius: 4px; border-color: var(--border); }
  .home-card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(39,77,91,.12); }
  .home-card b { color: var(--navy); }
  .home-card .ico { color: var(--accent-dark); }
  .gs-box input:focus { border-color: var(--accent); }
  .scard { border-radius: 4px; }
  .scard .badge-t { background: var(--accent-bg); color: var(--accent-dark); }
  .scard .badge-t.bond { background: #dff0f0; color: var(--navy); }
  .scard .sbtn:hover { border-color: var(--accent); color: var(--accent-dark); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  /* ── שלוש האפשרויות בראש כל מסך ניהול (כמו לשוניות האתר) ── */
  tr.sub-row td { background:#f7fafa; font-size:.94em; }
  tr.sub-row td.biz-name { padding-inline-start:26px; }
  /* תת-שורות אג"ח: צרות, ופס צבע שלא מגיע לקצוות הטבלה (מתחיל בהזחה מימין ונגמר אחרי עמודת הת"ע כללי) */
  .admin-tbl tbody tr:nth-child(even) { background: transparent; }
  .admin-tbl tbody tr.alt, .admin-tbl tbody tr.bond-sub.alt:hover { background: var(--row-alt); }
  .admin-tbl tbody tr.bond-sub:not(.alt):hover { background: transparent; }
  /* חברה + תת-שורות אג"ח: בלי קו ביניהן; פס כחול בצד ימין מהחברה עד האג"ח האחרונה, שמתעקל פנימה בתחתית */
  .admin-tbl tbody tr.has-bonds td { border-bottom: 0; padding-bottom: 6px; }
  .admin-tbl tbody tr.bond-sub td { border-bottom: 0; }
  .admin-tbl tbody tr.bond-sub.bs-end td { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .admin-tbl tbody tr.has-bonds td:first-child, .admin-tbl tbody tr.bond-sub:not(.bs-end) td:first-child { box-shadow: inset -4px 0 0 #3f6ea8; }
  .admin-tbl tbody tr.bond-sub.bs-end td:first-child { position: relative; }
  .admin-tbl tbody tr.bond-sub.bs-end td:first-child::before { content: ""; position: absolute; right: 0; top: 0; bottom: 20px; width: 4px; background: #3f6ea8; }
  .admin-tbl tbody tr.bond-sub.bs-end td:first-child::after { content: ""; position: absolute; right: 0; bottom: 4px; width: 30px; height: 16px; border-right: 4px solid #3f6ea8; border-bottom: 4px solid #3f6ea8; border-bottom-right-radius: 14px; box-sizing: border-box; }
  tbody tr.bond-sub td { padding-top:3px; padding-bottom:3px; border-top:0; border-bottom:0; background:transparent; font-size:12.5px; }
  tbody tr.bond-sub td.bs { background:#f2f5f9; }
  tbody tr.bond-sub td.bs-first { background:linear-gradient(to left, transparent 28px, #f2f5f9 28px); padding-inline-start:36px; color:#1a3a5c; font-weight:500; white-space:nowrap; }
  /* המשך הפס הכחול: יורד בצד ימין, ממשיך מתחת לתת-השורות, ועולה בצד שמאל עד תחתית שורת החברה (פינות מעוגלות) */
  tbody tr.bond-sub td.bs-last { box-shadow: inset 4px 0 0 #3f6ea8; }
  tbody tr.bond-sub.bs-end td.bs { background: linear-gradient(#3f6ea8,#3f6ea8) left calc(100% - 4px) / 100% 4px no-repeat, linear-gradient(#f2f5f9,#f2f5f9) top / 100% calc(100% - 8px) no-repeat; }
  tbody tr.bond-sub.bs-end td.bs.bs-first { background: linear-gradient(#3f6ea8,#3f6ea8) left calc(100% - 4px) / calc(100% - 28px) 4px no-repeat, linear-gradient(to left, transparent 28px, #f2f5f9 28px) top / 100% calc(100% - 8px) no-repeat; }
  tbody tr.bond-sub.bs-end td.bs.bs-last { position: relative; box-shadow: none; background: linear-gradient(#3f6ea8,#3f6ea8) right calc(100% - 4px) / calc(100% - 16px) 4px no-repeat, linear-gradient(#f2f5f9,#f2f5f9) top / 100% calc(100% - 8px) no-repeat; }
  tbody tr.bond-sub.bs-end td.bs.bs-last::after { content: ""; position: absolute; left: 0; top: 0; bottom: 4px; width: 16px; border-left: 4px solid #3f6ea8; border-bottom: 4px solid #3f6ea8; border-bottom-left-radius: 14px; box-sizing: border-box; }
  tr.bond-sub .bs-tag { font-size:11px; color:var(--muted); }
  .pd-sm { padding:1px 7px !important; font-size:11.5px !important; }
  .chp-choice { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .big-card { text-align:center; background:#fff; border:2px dashed var(--border); border-radius:8px; padding:16px 18px; min-height:150px; }
  .big-card .ico { display:block; font-size:30px; margin-bottom:4px; }
  .big-card > b { display:block; font-size:21px; color:var(--navy); margin-bottom:12px; }
  .big-card:focus-within { border-color:var(--accent); }
  .big-nochp { width:100%; min-height:150px; font-family:inherit; font-size:21px; font-weight:700; color:var(--navy); background:#fff; border:2px dashed var(--border); border-radius:8px; cursor:pointer; transition:.15s; padding:12px; }
  #form-modal .big-nochp, #form-modal #name-search-wrap, #form-modal #nochp-bar, #form-modal .big-card > .ico, #form-modal .big-card > b { display:none !important; }
  #form-modal #chp-choice { grid-template-columns:1fr !important; }
  #form-modal #chp { background:#eef3f3; pointer-events:none; }
  .big-nochp:hover { border-color:var(--accent); background:var(--accent-bg); color:var(--accent-dark); }
  .big-nochp .ico { display:block; font-size:30px; margin-bottom:6px; }
  .big-nochp small { display:block; font-size:13px; font-weight:400; color:var(--muted); margin-top:4px; }
  .nochp-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 2px; color:var(--navy); }
  @media (max-width:700px) { .chp-choice { grid-template-columns:1fr !important; } }
  .permit-choice { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pc-btn { font-family:inherit; font-size:16px; font-weight:700; color:var(--navy); background:#fff; border:2px solid var(--border); border-radius:6px; padding:10px 12px; cursor:pointer; text-align:center; transition:.15s; }
  .pc-btn small { display:block; font-size:12px; font-weight:400; color:var(--muted); margin-top:2px; min-height:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .admin-tbl th, .admin-tbl td { padding-left:8px; padding-right:8px; }
  /* דף ראשי: ממלא את המסך בלי גלילה. למעלה: מצטרפים (ימין) וחיפוש (שמאל); באמצע: הוספה ועדכון (גדולים); למטה: ניהול השטרות (ימין) והעוגות (שמאל, באותו גובה) */
  .home-wrap { display:flex; flex-direction:column; gap:clamp(8px,1.5vh,20px); max-width:min(97vw,1900px); height:calc(100vh - 120px); min-height:460px; margin:0 auto; box-sizing:border-box; width:100%; position:relative; z-index:0; }
  .home-wrap .home-card { border:2px solid #8fb7c2; border-radius:18px; background:linear-gradient(180deg,#356477 0%,#274d5b 55%,#1e3e4a 100%); color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.18); padding:.5rem .8rem; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0; }
  .home-wrap .home-card .ico { font-size:clamp(24px,4vh,48px); margin-bottom:clamp(2px,.8vh,10px); }
  .home-wrap .home-card b { font-size:clamp(17px,1.5vw,30px); }
  .home-wrap .home-card span.sub { font-size:clamp(13px,1.05vw,19px); }
  .home-top { flex:0 0 clamp(80px,15vh,150px); display:flex; justify-content:space-between; gap:20px; }
  .home-top .home-card { width:clamp(260px,24vw,460px); flex:none; }
  .home-mid { flex:1 1 0; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,1.2vw,20px); }
  .home-mid .home-card .ico { font-size:clamp(34px,7vh,80px); }
  .home-mid .home-card b { font-size:clamp(22px,2.4vw,44px); }
  .home-mid .home-card span.sub { font-size:clamp(14px,1.3vw,24px); }
  .home-bot { flex:4 1 0; min-height:0; display:flex; gap:clamp(12px,1.5vw,28px); align-items:stretch; }
  .home-dash { flex:1; min-width:0; display:flex; flex-direction:column; gap:clamp(4px,1vh,10px); }
  .home-dash .pd-homeh { margin:0; font-size:clamp(18px,1.6vw,28px); }
  .home-dash .home-grid { margin:0 !important; max-width:none !important; flex:1; min-height:0; grid-template-columns:repeat(2,minmax(0,1fr)) !important; grid-auto-rows:1fr; gap:clamp(10px,1.2vw,20px); }
  .home-wrap .idx-row { flex:none; width:clamp(300px,28vw,540px); margin:0; justify-content:stretch; }
  .home-wrap .idx-box { border:2px solid #274d5b; border-radius:18px; box-shadow:0 2px 6px rgba(0,0,0,.18); flex-direction:column; flex-wrap:nowrap; justify-content:space-around; gap:10px; min-width:0; width:100%; box-sizing:border-box; padding:clamp(8px,1.5vh,20px) clamp(10px,1vw,20px); font-size:clamp(13px,1vw,18px); }
  .home-wrap .idx-sub { font-size:clamp(12px,.95vw,17px); margin-bottom:2px; }
  .home-wrap .idx-line span { font-size:clamp(11px,.85vw,15px); }
  .home-wrap .idx-pie { gap:clamp(8px,1vw,18px); }
  .home-wrap .idx-pie svg { width:clamp(70px,12vh,170px); height:auto; flex:none; }
  /* באנר האתר הישן: ברקע הדף הראשי, לכל הרוחב, מאחורי הכפתורים */
  body:has(.home-wrap) { overflow-x:hidden; }
  .home-band { position:relative; flex:5 1 0; min-height:0; display:flex; flex-direction:column; gap:clamp(8px,1.5vh,20px); }
  .home-band::before { content:""; position:absolute; z-index:-1; top:calc(-1 * clamp(8px,1.5vh,20px)); bottom:calc(-1 * clamp(8px,1.5vh,20px)); left:calc(50% - 50vw); right:calc(50% - 50vw); background:url(banner.jpg) center/cover no-repeat #3a3a3a; }
  /* כפתורים קטנים יותר עם רווחים ביניהם */
  .home-wrap { height:auto !important; min-height:calc(100vh - 96px) !important; max-width:min(92vw,1560px) !important; gap:clamp(70px,11vh,120px) !important; padding-bottom:0; justify-content:flex-end; }
  .home-band { flex:none !important; gap:clamp(14px,2.4vh,28px) !important; }
  .home-band::before { top:calc(-1 * clamp(24px,5vh,56px)) !important; bottom:calc(-1 * clamp(24px,5vh,56px)) !important; }

  .idx-row { display:flex; justify-content:center; margin:0 0 14px; }

  .sc-b.on { border-color:var(--accent); background:var(--accent-bg); color:var(--accent-dark); font-weight:700; }

  .circ:hover { background:var(--accent); color:#fff; }

  #pd-nd-tabs button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:78px; }

  .admin-tabs button:hover { color:var(--accent-dark); }

</head>
<body>

<header>
  <div>
    <div style="display:flex;align-items:center"><a href="/" class="logo-link"><img id="site-logo" src="logo.png" alt="מכון היתר עסקה למהדרין" onerror="this.style.display='none';document.getElementById('site-title').style.display='';"><h1 id="site-title" style="display:none;">מכון להיתר עסקה למהדרין</h1></a><button id="home-btn" class="hdr-home" style="display:none" onclick="setView('home')" title="חזרה לדף הראשי של הניהול">🏠 ראשי</button></div>
  </div>
  <div class="hdr-btns"><button id="pw-btn" onclick="openChangePassword()" style="display:none;">🔑 שינוי סיסמה</button><button id="admin-toggle" onclick="toggleAdmin()">כניסת מנהל</button></div>
</header>

<main>
  <div id="app"><div class="loading">טוען נתונים...</div></div>
</main>

<!-- Delete confirmation modal -->
<div id="delete-modal" style="display:none;"></div>

<div id="status-bar"></div>

<script src="xlsx-lite.js"></script>
<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let businesses = [];
let isAdmin    = false;
let adminToken = "";
let view       = "login";
let search     = "";
let filterCat  = "";
let filterRegion   = "";
let filterBizType  = "";
let filterVis      = "";
let filterDocs     = "";      // "" | review | missing: סינון לפי מצב מסמכי ההיתר (permit-docs.js)
let filterAgch     = "";   // "" | "אין" | "מאושר" | "לא מאושר" | "יש"
let sortCol    = "name";   // name | chp | category | region | biz_type | visibility | agch | notes
let sortDir    = "asc";    // asc | desc
let editBiz    = null;
let deleteId   = null;
let chpResult  = null;
let chpError   = "";
let chpLoading = false;
let saving     = false;

// CSV import state
let csvStep       = "upload";   // upload | preview | importing | done
let csvHeaders    = [];
let csvRows       = [];         // array of arrays (raw)
let csvColMap     = {};         // fieldKey → colIndex (or -1)
let csvProgress   = 0;
let csvTotal      = 0;
let csvPhase      = "";
let csvErrors     = [];
let csvImported   = 0;
let csvDeleted    = 0;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ─────────────────────────────────────────────
//  FIELD DEFINITIONS FOR CSV MAPPING
// ─────────────────────────────────────────────
const CSV_FIELDS = [
  { key: "chp_number",     label: "ח.פ. / מספר רישום",  aliases: ["חפ","ח.פ","ח.פ.","chp","chp_number","מספר רישום","מספר תאגיד","ס.מ.","ס\"מ"] },
  { key: "registrar_name", label: "שם ברשם הרשמי",       aliases: ["שם ברשם","שם רשמי","registrar_name","registrar","שם תאגיד","שם החברה","שם חברה / שותפות רשמי","שם חברה","שם שותפות"] },
  { key: "permit_name",    label: "שם בהיתר עסקה",       aliases: ["שם בהיתר","היתר","permit_name","permit","שם עסק","שם","היתר עסקה על שם","היתר עסקה"] },
  { key: "category",       label: "קטגוריה",              aliases: ["קטגוריה","category","ענף","סוג","עיסוק","תחום עיסוק"] },
  { key: "region",         label: "אזור",                 aliases: ["אזור","region","מחוז"] },
  { key: "visibility",     label: "פרטי / כללי",          aliases: ["פרטי/כללי","פרטי כללי","visibility","היתר עסקה חברה"] },
  { key: "agch_approved",  label: "אישור אג\"ח",          aliases: ["אישור אגח","אישור אג\"ח","agch_approved","אגח מאושר","היתר עסקה אגח","היתר עסקה אג\"ח"] },
  { key: "tase_has_agch",  label: "אג\"ח בורסה",          aliases: ["אגח בורסה","אג\"ח בורסה","tase_has_agch","בורסה"] },
  { key: "biz_type",       label: "סוג עסק",              aliases: ["סוג עסק","entity_type","biz_type","סוג החברה","סוג תאגיד","סוג"] },
  { key: "notes",          label: "הערות",                aliases: ["הערות","notes","remarks","הערה"] },
];

// ─────────────────────────────────────────────
//  API HELPERS
// ─────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (adminToken) headers["Authorization"] = `Bearer ${adminToken}`;
  const res = await fetch("/api" + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

let bizLoaded = false, adminDeferred = false;
// רשימת העסקים נשמרת בדפדפן: בכניסה מוצג מיד העותק האחרון, והנתונים העדכניים מחליפים אותו כשהם מגיעים (ברשת איטית זה החלק הארוך).
// עד שמגיעים הנתונים העדכניים, שמירה מהטבלה מחכה להם (כדי לא לשמור על בסיס עותק ישן).
const BIZ_CACHE = "hl_biz_cache_v1";
let bizStale = false, bizFreshP = null;
const bizFresh = async () => { if (bizStale && bizFreshP) { try { await bizFreshP; } catch { /* השגיאה תטופל בשמירה */ } } };
async function loadBusinesses() {
  if (!bizLoaded) {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(BIZ_CACHE) || "null"); } catch { cached = null; }
    if (Array.isArray(cached) && cached.length) { businesses = cached; bizLoaded = true; bizStale = true; render(); }
  }
  bizFreshP = apiFetch("/businesses");
  try { businesses = await bizFreshP; } finally { bizStale = false; }
  bizLoaded = true;
  try { localStorage.setItem(BIZ_CACHE, JSON.stringify(businesses)); } catch { /* אין מקום / חסום */ }
  render();
}

// ─────────────────────────────────────────────
//  DISPLAY NAME
// ─────────────────────────────────────────────
function displayName(b, asHTML = false) {
  const r = (b.registrar_name || "").trim();
  const p = (b.permit_name    || "").trim();
  if (r && p && r !== p) {
    return asHTML
      ? `${escHtml(r)} <span class="permit">(${escHtml(p)})</span>`
      : `${r} (${p})`;
  }
  return asHTML ? escHtml(r || p || "—") : (r || p || "—");   // בלי asHTML = טקסט רגיל (מי שמכניס ל-HTML מצפין בעצמו)
}

// Combined אג"ח status label for public table
function agchLabel(b) {
  const has  = (b.tase_has_agch  || "").trim();
  const appr = (b.agch_approved  || "").trim();
  if (has !== "יש") {
    return `<span style="color:var(--light);">אין אג"ח</span>`;
  }
  if (appr === "כן") {
    return `<span style="color:var(--green);font-weight:500;">יש אג"ח · מאושר</span>`;
  }
  if (appr === "לא") {
    return `<span style="color:#b85c00;font-weight:500;">יש אג"ח · לא מאושר</span>`;
  }
  return `<span style="color:var(--muted);">יש אג"ח</span>`;
}

const PCAT_SEP = "|";                       // כמה קטגוריות לעסק נשמרות בשדה אחד, מופרדות ב-|
const pcatSplit = s => String(s || "").split(PCAT_SEP).map(x => x.trim()).filter(Boolean);
function pcatBoxHtml(val) {
  const cur = pcatSplit(val), all = [...new Set(businesses.flatMap(x => pcatSplit(x.permits_category)))].sort((x, y) => x.localeCompare(y, "he"));
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">${cur.map((c, i) => `<span style="background:#e8f0fb;border:1px solid #9bb8e0;border-radius:14px;padding:3px 10px;font-size:.9em">${escHtml(c)} <a href="#" style="color:#a00;text-decoration:none" onclick="pcatDel(${i});return false" title="הסר">✕</a></span>`).join("") || '<span style="color:var(--light)">ללא קטגוריה</span>'}</div>
    <select onchange="pcatAdd(this)"><option value="">➕ הוספת קטגוריה…</option>${all.filter(x => !cur.includes(x)).map(x => `<option value="${escHtml(x)}">${escHtml(x)}</option>`).join("")}<option value="__new">קטגוריה חדשה…</option></select>`;
}
function pcatRender() { const h = document.getElementById("f-pcat"), b = document.getElementById("pcat-box"); if (h && b) b.innerHTML = pcatBoxHtml(h.value); }
function pcatAdd(sel) {
  const h = document.getElementById("f-pcat"); let v = sel.value;
  if (v === "__new") v = (prompt("שם הקטגוריה החדשה (לרשימת השטרות):") || "").trim();
  if (v) { const cur = pcatSplit(h.value); if (!cur.includes(v)) cur.push(v); h.value = cur.join(PCAT_SEP); }
  pcatRender();
}
function pcatDel(i) { const h = document.getElementById("f-pcat"), cur = pcatSplit(h.value); cur.splice(i, 1); h.value = cur.join(PCAT_SEP); pcatRender(); }
function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if      (view === "table")      { location.href = "/"; return; }   // התצוגה הציבורית היא דף נפרד (index.html)
  else if (view === "login")      app.innerHTML = renderLogin();
  else if (view === "home")       app.innerHTML = renderHome();
  else if (view === "search")     { app.innerHTML = adminTabs() + (window.PD ? '<div id="pd-sp-body"></div>' : renderSearch()); if (window.PD) PD.searchPage(document.getElementById("pd-sp-body")); }
  else if (view === "admin")      app.innerHTML = adminTabs() + ((adminDeferred || !bizLoaded) ? `<div class="loading" style="padding:3rem 0;text-align:center;"><span class="spin"></span> טוען את רשימת העסקים…</div>` : renderAdminTable());
  else if (view === "form")       { if (formModal) ensureFormModal().innerHTML = renderForm(); else app.innerHTML = adminTabs() + renderForm(); }
  else if (view === "csv-import") app.innerHTML = adminTabs() + renderCsvImport();
  else if (view === "dash")       { if (window.PD) PD.dashPage(app); }
  else if (view === "gfunds")     { app.innerHTML = renderGFunds(); if (!GF.loaded && !GF.loading) gfLoad(); }
  bindEvents();
  if (view === "admin") admWatch();
  document.getElementById("admin-toggle").style.display = isAdmin ? "none" : "";          // בלי כפתור "יציאה ממנהל"
  document.getElementById("admin-toggle").textContent = "כניסת מנהל";
  document.getElementById("home-btn").style.display = isAdmin && view !== "home" ? "" : "none";
  document.getElementById("pw-btn").style.display = isAdmin ? "" : "none";
}

// ── TABLE (public) — combined view ──
// ── LOGIN ──
function renderLogin() {
  return `
    <div class="panel" style="max-width:340px;">
      <h2>כניסת מנהל</h2>
      <div class="field">
        <label>סיסמה</label>
        <input id="pwd" type="password" class="ltr" placeholder="הכנס סיסמה" autocomplete="current-password">
      </div>
      <p class="error-msg" id="login-err"></p>
      <button class="btn-primary" onclick="doLogin()">כניסה</button>
      <button class="btn-ghost" style="width:100%;margin-top:8px;" onclick="location.href='/'">חזרה</button>
    </div>`;
}

// ── ADMIN TABLE ──
function renderAdminTable() {
  const sorted = filteredAndSorted();   // לפי החיפוש / המסננים (ברירת מחדל: כל העסקים, לפי שם)
  return `
    <div class="admin-bar">
      <h2>ניהול עסקים · <span class="count">${businesses.length} רשומות</span></h2>
    </div>
    <div class="chg-bar">
      <button class="btn-ghost" onclick="undoLast()" ${changeLog.some(e=>!e.undone) ? "" : "disabled"}>↩ ביטול שינוי אחרון</button>
      <button class="btn-ghost" onclick="openChangeLog()">📜 יומן שינויים${changeLog.length ? ` (${changeLog.length})` : ""}</button>
    </div>
    <div id="sync-status" style="display:none;margin-bottom:1rem;padding:10px 14px;border-radius:8px;font-size:13px;border:1px solid var(--border);background:var(--bg2);"></div>
    <div class="filter-bar">
      <div class="fb-group" style="flex:1;min-width:200px;">
        <span class="fb-label">חיפוש</span>
        <input type="text" id="adm-srch" class="fb-search${search ? " active" : ""}" autocomplete="off"
          placeholder="🔍 שם, ח.פ., קטגוריה, אזור, הערות…" value="${escHtml(search)}" oninput="onAdminSearch(this.value)">
      </div>
      ${window.PD && PD.docCounts ? (() => { const c = PD.docCounts(businesses); return `<div class="fb-group"><span class="fb-label">מסמכי היתר</span>
        <select id="f-docs" onchange="filterDocs=this.value;render()" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);">
          <option value="" ${!filterDocs ? "selected" : ""}>הכל (${businesses.length})</option>
          <option value="review" ${filterDocs === "review" ? "selected" : ""}>לבדיקה ידנית (${c.review})</option>
          <option value="missing" ${filterDocs === "missing" ? "selected" : ""}>חסר מסמך (${c.missing})</option>
          <option value="ok" ${filterDocs === "ok" ? "selected" : ""}>תקין (${c.ok})</option>
        </select></div>`; })() : ""}
      <div class="fb-group" style="justify-content:flex-end;"><span class="fb-label">&nbsp;</span>
        <span class="count" style="line-height:34px;">${sorted.length} מתוך ${businesses.length}</span></div>
    </div>
    <div class="table-wrap">
      <table class="admin-tbl">
        <colgroup>
          <col class="c-name2">

// טבלת הניהול בחלקים: בהתחלה רק ADM_STEP חברות (עם תתי-השורות שלהן), והשאר נוספות בגלילה למטה / "הצג עוד".
// טבלה מלאה של כ-1,500 חברות היא עשרות אלפי רכיבים, ובמחשב איטי בנייתה לוקחת עשרות שניות.
const ADM_STEP = 60;
let admShown = ADM_STEP, admRest = [], admGrp = 0, admTotal = 0, admObs = null;
function admPage(sorted) {
  const all = groupSubs(sorted); let n = 0, k = 0;
  for (; k < all.length; k++) { if (!all[k]._isSub) { if (n >= admShown) break; n++; } }
  admRest = all.slice(k); admGrp = n; admTotal = all.filter(b => !b._isSub).length;
  return all.slice(0, k);
}
function admMoreHtml() {
  return admRest.length ? `<div style="text-align:center;padding:14px;color:var(--muted);font-size:13px">מוצגות ${admGrp} מתוך ${admTotal} · <button type="button" class="btn-ghost" onclick="admMore()">הצג עוד</button> <button type="button" class="btn-ghost" onclick="admMore(true)">הצג הכל</button></div>` : "";
}
function admMore(all) {
  const tb = document.querySelector("#app table tbody"), more = document.getElementById("adm-more"); if (!tb || !admRest.length) return;
  let n = 0, k = 0;
  for (; k < admRest.length; k++) { if (!admRest[k]._isSub) { if (!all && n >= ADM_STEP) break; n++; } }
  const part = admRest.slice(0, k); admRest = admRest.slice(k);
  tb.insertAdjacentHTML("beforeend", admRowsHtml(part, admGrp)); admGrp += n; admShown = admGrp;
  if (more) more.innerHTML = admMoreHtml();
}
function admWatch() {          // טעינת החלק הבא כשמגיעים קרוב לסוף הטבלה
  if (admObs) admObs.disconnect();
  const m = document.getElementById("adm-more"); if (!m || !("IntersectionObserver" in window)) return;
  admObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && admRest.length) admMore(); }, { rootMargin: "600px" });
  admObs.observe(m);
}
function admRowsHtml(items, grp0) {
  let grp = grp0 - 1;
  return items.map(b0 => { if (!b0._isSub) grp++; const gi = grp;          // תת-שורה ("מסלול הלכה") באותו רקע כמו החברה שלה

            const bsubs = (window.PD && PD.bondDocs) ? PD.bondDocs(b.id) : [], alt = gi % 2 ? " alt" : "";          // חברה עם תת-שורות אג"ח: קבוצה אחת (אותו רקע, מסגרת ופס צבע בצד)
            return `

                <td class="biz-cell"><div class="kv"><span class="k"></span><span class="v biz-name">${b0._isSub ? "↳ " : ""}${(b.chp_number || "").toString().trim() ? escHtml(((b0._isSub ? b.permit_name : "") || b.registrar_name || b.permit_name || "").trim() || "—") : `<input type="text" value="${escHtml((b.permit_name || b.registrar_name || "").trim())}" title="עסק בלי ח.פ.: אפשר לעדכן את השם" onchange="nameInline('${b.id}', this.value)" style="width:100%;box-sizing:border-box;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg);color:var(--text);">`}</span>${(b.chp_number || "").toString().trim() ? `${samePermitName(b) ? `<span class="k"></span><span class="v pn-same"><span class="pn-txt">שם זהה בהיתר עסקה</span> <button type="button" class="pn-edit" onclick="pnEdit(this)" title="עריכת השם בהיתר עסקה">✏️</button><input type="text" style="display:none" value="${escHtml((b.permit_name || b.registrar_name || "").trim())}" title="שם בהיתר עסקה" onchange="permitNameSave('${b.id}', this.value)" data-s="width:100%;box-sizing:border-box;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg);color:var(--text);"></span>` : `<span class="k">שם בהיתר עסקה</span><span class="v">${(b.chp_number || "").toString().trim() ? `<input type="text" value="${escHtml((b.permit_name || b.registrar_name || "").trim())}" title="שם בהיתר עסקה" onchange="permitNameSave('${b.id}', this.value)" style="width:100%;box-sizing:border-box;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg);color:var(--text);">` : '<span style="color:var(--light)">—</span>'}</span>`}` : ""}</div>${!b0._isSub && (b.chp_number || "").toString().trim() ? subAddWidget(b.id) : ""}</td>

                  <span class="k">קטגוריה</span><span class="v">${escHtml(b.category)||"—"}</span></div></td>
                <td style="font-size:12px;">${escHtml(b.region)||"—"}</td>

                  <div style="margin-top:4px;">${(() => {
                  if (!(b.notes || "").trim()) return "";                              // בלי הערה - אין מה לבחור
                  const sc = b.notes_scope || ((b0.notes || "").trim() ? "companies" : "");   // הערה ישנה בלי בחירה = חברות

                  return `<span class="sc-btns ${sc?"":"need"}" title="באיזו רשימה מוצגת ההערה">${bt("companies","חברות")}${bt("bonds","אג\"ח")}${bt("both","שתיהן")}</span>`; })()}</div>
                </td>

// ════════════════════════════════════════════
//  CSV IMPORT VIEW
// ════════════════════════════════════════════
function renderCsvImport() {
  const stepLabels = ["העלאת קובץ", "מיפוי עמודות", "ייבוא", "סיום"];
  const stepIndex  = { upload: 0, preview: 1, importing: 2, done: 3 };
  const curStep    = stepIndex[csvStep] ?? 0;

  const stepsHtml = stepLabels.map((lbl, i) => {
    const cls = i < curStep ? "done" : i === curStep ? "active" : "";
    return `<div class="step ${cls}">${i < curStep ? "✓ " : ""}${lbl}</div>`;
  }).join("");

  let body = "";

  // ── STEP 1: Upload ──
  if (csvStep === "upload") {
    body = `
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-file-input').click()">
        <input type="file" id="csv-file-input" accept=".csv,text/csv" style="display:none">
        <div class="dz-icon">📄</div>
        <div class="dz-title">גרור קובץ CSV לכאן</div>
        <div class="dz-sub">או לחץ לבחירת קובץ</div>
        <div class="dz-btn">בחר קובץ CSV</div>
      </div>
      <div style="margin-top:1rem;padding:12px 16px;background:var(--bg);border-radius:8px;border:1px solid var(--border);">
        <p style="font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px;">📋 עמודות נתמכות (לפי שם הכותרת בקובץ):</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${CSV_FIELDS.map(f=>`
            <span style="font-size:12px;padding:3px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;color:var(--muted);">
              ${f.label}
            </span>`).join("")}
        </div>
        <p style="font-size:12px;color:var(--light);margin-top:8px;">הקובץ יכול להכיל כותרות בעברית או באנגלית — המערכת מזהה אוטומטית.</p>
      </div>`;
  }

  // ── STEP 2: Preview + Mapping ──
  else if (csvStep === "preview") {
    const colOptions  = (selVal) => `
      <option value="-1" ${selVal===-1?"selected":""}>— לא למפות —</option>
      ${csvHeaders.map((h,i) => `<option value="${i}" ${selVal===i?"selected":""}>${escHtml(h)}</option>`).join("")}`;

    body = `
      <div class="mapping-section">
        <h3>מיפוי עמודות — ${csvHeaders.length} עמודות זוהו, ${csvRows.length} שורות נתונים</h3>
        <div class="mapping-grid">
          ${CSV_FIELDS.map(f => {
            const val = csvColMap[f.key] ?? -1;
            return `
              <div class="mapping-row">
                <label>${f.label}</label>
                <select id="map-${f.key}" onchange="updateColMap('${f.key}',this.value)" class="${val>=0?'mapped':''}">
                  ${colOptions(val)}
                </select>
              </div>`;
          }).join("")}
        </div>
      </div>

      <div class="preview-section">
        <h3>תצוגה מקדימה — ${Math.min(20,csvRows.length)} שורות ראשונות מתוך ${csvRows.length}</h3>
        ${(() => {
          const previewRows   = csvRows.slice(0, 20);
          const mappedFields  = CSV_FIELDS.filter(f => (csvColMap[f.key]??-1) >= 0);
          // detect duplicate chp within the file
          const chpIdx = csvColMap["chp_number"] ?? -1;
          const chpCounts = {};
          if (chpIdx >= 0) {
            csvRows.forEach(r => {
              const v = (r[chpIdx]||"").trim();
              if (v) chpCounts[v] = (chpCounts[v]||0) + 1;
            });
          }
          // existing chp numbers
          const existingChp = new Set(businesses.map(b=>(b.chp_number||"").trim()).filter(Boolean));
          const dupInFile   = Object.values(chpCounts).some(c=>c>1);
          const dupWarning  = dupInFile
            ? `<div style="margin-bottom:.75rem;padding:8px 12px;background:#fff3cd;border:1px solid #f0c040;border-radius:7px;font-size:13px;color:#7a5800;">⚠️ זוהו ח.פ. כפולים בקובץ (מודגשים באדום) — רק הרשומה הראשונה תיובא</div>`
            : "";
          // col width map
          const colWidths = {
            chp_number:     "90px",  registrar_name: "200px",
            permit_name:    "180px", category:       "110px",
            region:         "75px",  visibility:     "68px",
            agch_approved:  "90px",  tase_has_agch:  "80px",
            biz_type:       "150px", notes:          "auto",
          };
          const seenChp = new Set();
          return dupWarning + `
          <div class="preview-wrap" style="max-height:360px;">
            <table style="table-layout:fixed;min-width:600px;">
              <colgroup>
                <col style="width:32px;">
                ${mappedFields.map(f=>`<col style="width:${colWidths[f.key]||'120px'};">`).join("")}

              <thead>
                <tr>
                  <th style="text-align:center;padding:8px 6px;">#</th>

                </tr>
              </thead>
              <tbody>
                ${previewRows.map((row, i) => {
                  const chpVal = chpIdx >= 0 ? (row[chpIdx]||"").trim() : "";
                  const isDupInFile = chpVal && chpCounts[chpVal] > 1 && seenChp.has(chpVal);
                  const isExisting  = chpVal && existingChp.has(chpVal);
                  if (chpVal) seenChp.add(chpVal);
                  const rowStyle = isDupInFile
                    ? 'background:#fdf0ef;'

                  const badge = isDupInFile
                    ? `<span style="font-size:10px;color:var(--red);margin-right:4px;">כפול</span>`
                    : isExisting
                    ? `<span style="font-size:10px;color:#9a7010;margin-right:4px;">קיים</span>`
                    : "";
                  return `<tr style="${rowStyle}">
                    <td style="text-align:center;color:var(--light);font-size:11px;padding:7px 4px;">${i+1}</td>
                    ${mappedFields.map((f,fi) => {
                      const val = escHtml(row[csvColMap[f.key]] || "");
                      const isChp = f.key === "chp_number";
                      return `<td style="padding:7px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${isChp?"direction:ltr;text-align:right;font-size:12px;":"font-size:13px;"}">
                        ${isChp ? badge : ""}${val||"—"}
                      </td>`;
                    }).join("")}
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;
        })()}
      </div>

      <div class="confirm-import-box">
        ⚠️ פעולה זו תמחק את כל <strong>${businesses.length} העסקים הקיימים</strong> ותייבא
        <span class="ci-count">${csvRows.length} עסקים חדשים</span> מהקובץ. לא ניתן לבטל פעולה זו.
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn-ghost" onclick="csvStep='upload';render()">← חזור</button>
        <button class="btn-danger" onclick="startImport()">
          🗑 מחק ${businesses.length} קיימים וייבא ${csvRows.length} חדשים
        </button>
      </div>`;
  }

  // ── STEP 3: Importing ──
  else if (csvStep === "importing") {
    const pct = csvTotal > 0 ? Math.round((csvProgress / csvTotal) * 100) : 0;
    body = `
      <div style="text-align:center;padding:1rem 0 0.5rem;">
        <div style="font-size:1.8rem;margin-bottom:.5rem;">⏳</div>
        <p style="font-size:15px;font-weight:500;margin-bottom:.3rem;">מייבא נתונים...</p>
        <p style="font-size:13px;color:var(--muted);">אנא המתן, אל תסגור את הדף</p>
      </div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>${csvPhase}</span>
          <span>${csvProgress} / ${csvTotal}</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${pct}%"></div>
        </div>
        <div class="progress-phase">${pct}% הושלם</div>
      </div>`;
  }

  // ── STEP 4: Done ──
  else if (csvStep === "done") {
    body = `
      <div class="done-box">
        <div class="done-icon">✅</div>
        <h3>הייבוא הושלם בהצלחה</h3>
        <p>נמחקו <strong>${csvDeleted}</strong> עסקים קיימים · יובאו <strong>${csvImported}</strong> עסקים חדשים</p>
      </div>
      ${csvErrors.length > 0 ? `
        <div class="done-error-box">
          <strong>שגיאות (${csvErrors.length}):</strong><br>
          ${csvErrors.map(e=>escHtml(e)).join("<br>")}
        </div>` : ""}
      <div style="display:flex;gap:10px;justify-content:center;margin-top:1rem;">
        <button class="btn-primary" style="width:auto;padding:10px 28px;" onclick="finishImport()">חזור לניהול</button>
      </div>`;
  }

  return `
    <div class="csv-panel">
      <div class="csv-panel-header">
        <h2>📥 ייבוא עסקים מ-CSV</h2>
        ${csvStep !== "importing" ? `<button class="btn-ghost" onclick="setView('admin')">✕ ביטול</button>` : ""}
      </div>
      <div class="steps">${stepsHtml}</div>
      ${body}
    </div>`;
}

// ════════════════════════════════════════════
//  מסלולים וקרנות גלאט הון: עריכת הרשימה שמוצגת בדף funds_test.html (API: /api/glatt-funds)
// ════════════════════════════════════════════
const GF = { types: {}, rows: [], updated: "", tab: "pension", q: "", dirty: false, loaded: false, loading: false, saving: false, err: "", savedAt: "" };
const GF_TABS = [["pension", "קרנות פנסיה, גמל והשתלמות וחיסכון לכל ילד"], ["savings", "תוכנית חיסכון, ביטוח, גמל להשקעה, קרנות סל"]];
const GF_FIELDS = [["company", "שם חברה", "16%"], ["track", "שם מסלול", "30%"], ["type", "סוג", "20%"], ["number", "מספר קופה", "10%"], ["note", "הערות", "24%"]];
async function gfLoad() {
  GF.loading = true; GF.err = "";
  try {
    const r = await fetch("/api/glatt-funds", { cache: "no-store" }); const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    GF.rows = (d.rows || []).map(x => ({ tab: x.tab, company: x.company, track: x.track, type: x.type, number: x.number, note: x.note }));
    GF.updated = d.updated || ""; GF.savedAt = d.saved_at || ""; GF.loaded = true; GF.dirty = false; GF.types = {}; gfSort();
  } catch (e) { GF.err = e.message; }
  GF.loading = false;
  if (view === "gfunds") render();
}
function gfMatch(r) { const q = GF.q.trim().toLowerCase(); return !q || [r.company, r.track, r.type, r.number, r.note].join(" ").toLowerCase().includes(q); }
function renderGFunds() {
  const head = `<div class="admin-bar" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">📋 מסלולים וקרנות גלאט הון</h2>
    <a class="btn-ghost" href="/funds_test.html" target="_blank" rel="noopener" style="text-decoration:none">👁 תצוגה בדף (בדיקה)</a>
    <span style="flex:1"></span>
    <label style="font-size:13px;color:var(--muted)">מעודכן: <input type="text" value="${escHtml(GF.updated)}" oninput="GF.updated=this.value;gfDirty()" placeholder='למשל: חשוון תשפ"ז' style="width:150px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:var(--bg);color:var(--text)"></label>
    <button class="btn-primary" id="gf-save" style="width:auto;padding:8px 22px;margin:0" onclick="gfSave()" ${GF.dirty && !GF.saving ? "" : "disabled"}>${GF.saving ? "שומר…" : GF.dirty ? "💾 שמירה" : "✓ נשמר"}</button></div>`;
  if (GF.loading || !GF.loaded) return head + (GF.err ? `<p class="error-msg">הטעינה נכשלה: ${escHtml(GF.err)} <button class="btn-ghost" onclick="gfLoad()">ניסיון נוסף</button></p>` : `<div class="loading" style="padding:3rem 0;text-align:center;"><span class="spin"></span> טוען…</div>`);
  const tabs = `<div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">${GF_TABS.map(([k, l]) => `<button class="${GF.tab === k ? "btn-primary" : "btn-ghost"}" style="width:auto;margin:0;padding:8px 14px" onclick="GF.tab='${k}';render()">${escHtml(l)} (${GF.rows.filter(r => r.tab === k).length})</button>`).join("")}
    <input type="search" value="${escHtml(GF.q)}" placeholder="סינון בטבלה…" oninput="GF.q=this.value;gfPaintBody()" style="flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:var(--bg);color:var(--text)"></div>`;
  const types = [...new Set(GF.rows.map(r => r.type).filter(Boolean))].sort((a, b) => a.localeCompare(b, "he"));
  const cos = [...new Set(GF.rows.map(r => r.company).filter(Boolean))].sort((a, b) => a.localeCompare(b, "he"));
  return head + tabs + `<datalist id="gf-types">${types.map(t => `<option value="${escHtml(t)}">`).join("")}</datalist><datalist id="gf-cos">${cos.map(t => `<option value="${escHtml(t)}">`).join("")}</datalist>
    <div style="overflow:auto"><table class="gf-tbl"><thead><tr><th style="width:28px">#</th>${GF_FIELDS.map(([, l, w]) => `<th style="width:${w}">${l}</th>`).join("")}<th style="width:60px">מחיקה</th></tr></thead><tbody id="gf-body">${gfBodyHtml()}</tbody></table></div>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button class="btn-ghost" onclick="gfAdd(-1)">➕ סוג מוצר חדש</button><span style="font-size:12px;color:var(--muted)">הסדר קבוע: לפי סוג מוצר, ובתוך כל סוג מיטב, הראל ואז שאר החברות לפי א-ב</span></div>
    ${GF.savedAt ? `<div style="font-size:12px;color:var(--muted);margin-top:8px">נשמר לאחרונה: ${escHtml(GF.savedAt)} (UTC)</div>` : ""}`;
}
// סדר קבוע ואוטומטי: לפי סוג מוצר (בסדר הקיים; סוג חדש - בסוף), ובתוך כל סוג: מיטב, הראל, ואז שאר החברות לפי א-ב
const GF_FIRST = ["מיטב", "הראל"];
function gfCoRank(c) { c = String(c || "").trim(); const k = GF_FIRST.indexOf(c); return k >= 0 ? [k, ""] : c ? [GF_FIRST.length, c] : [GF_FIRST.length + 1, ""]; }
function gfTypeOrder(tab) {          // סדר הסוגים: מהסדר שנשמר (GF.types), וסוג שלא היה - בסוף
  const o = GF.types[tab] = GF.types[tab] || [];
  for (const r of GF.rows) if (r.tab === tab && !o.includes(r.type)) o.push(r.type);
  const live = new Set(GF.rows.filter(r => r.tab === tab).map(r => r.type));
  GF.types[tab] = o.filter(t => live.has(t) || t === GF.pendingType);
  return GF.types[tab];
}
function gfSort() {
  const out = [];
  for (const [tab] of GF_TABS) {
    const order = gfTypeOrder(tab), rows = GF.rows.map((r, n) => ({ r, n })).filter(x => x.r.tab === tab);
    rows.sort((a, b) => { const ta = order.indexOf(a.r.type), tb = order.indexOf(b.r.type); if (ta !== tb) return (ta < 0 ? 1e6 : ta) - (tb < 0 ? 1e6 : tb);
      const ca = gfCoRank(a.r.company), cb = gfCoRank(b.r.company); return (ca[0] - cb[0]) || ca[1].localeCompare(cb[1], "he") || (a.n - b.n); });
    out.push(...rows.map(x => x.r));
  }
  GF.rows = out;
}
function gfBodyHtml() {
  const order = gfTypeOrder(GF.tab); let n = 0;
  return order.map((t, ti) => {
    const rows = GF.rows.map((r, i) => ({ r, i })).filter(x => x.r.tab === GF.tab && x.r.type === t);
    const shown = rows.filter(x => gfMatch(x.r));
    if (GF.q.trim() && !shown.length) return "";
    return `<tr class="gf-sec"><td colspan="${GF_FIELDS.length + 2}">${escHtml(t || "(סוג מוצר חדש: כתבו את שם הסוג בעמודת הסוג)")}</td></tr>` +
      shown.map(({ r, i }) => `<tr data-i="${i}"><td style="color:var(--muted);font-size:12px">${++n}</td>${GF_FIELDS.map(([k]) => `<td><input type="text" value="${escHtml(r[k])}" ${k === "type" ? 'list="gf-types"' : k === "company" ? 'list="gf-cos"' : ""} oninput="gfSet(${i},'${k}',this.value)" ${k === "type" || k === "company" ? `onchange="gfResort(${i},'${k}')"` : ""} ${k === "number" ? 'dir="ltr"' : ""}></td>`).join("")}
        <td style="text-align:center"><button class="gf-b" title="מחיקת השורה" style="color:var(--red)" onclick="gfDel(${i})">✕</button></td></tr>`).join("") +
      `<tr class="gf-add"><td colspan="${GF_FIELDS.length + 2}"><button class="gf-b" onclick="gfAdd(${ti})">➕ הוספת שורה ל${escHtml(t || "סוג החדש")}</button></td></tr>`;
  }).join("");
}
function gfPaintBody() { const b = document.getElementById("gf-body"); if (b) b.innerHTML = gfBodyHtml(); }

// נרמול לחיפוש: בלי ניקוד/גרשיים/מקפים, אותיות קטנות
const gsNorm = s => String(s ?? "").toLowerCase().replace(/[֑-ׇ]/g, "").replace(/["'״׳`´’]/g, "").replace(/[-–_.,/\\()\[\]:;]/g, " ").replace(/\s+/g, " ").trim();
function gsLev(a, b, max) {            // מרחק עריכה חסום, כולל החלפת אותיות סמוכות (פקוס ~ פוקס)
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const d = [];
  for (let i = 0; i <= a.length; i++) { d[i] = [i]; }
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    let best = Infinity;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      if (d[i][j] < best) best = d[i][j];
    }
    if (best > max) return max + 1;
  }
  return d[a.length][b.length];
}
function gsTokenScore(t, full, words) {  // 0 = אין התאמה
  if (/\d/.test(t)) return full.includes(t) ? 3 : 0;          // מספרים: התאמה מדויקת (חלקית)
  if (full.includes(t)) return words.some(w => w === t) ? 4 : 3;
  const max = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;
  if (!max) return 0;
  for (const w of words) if (gsLev(t, w, max) <= max || (w.length > t.length && gsLev(t, w.slice(0, t.length), 1) <= (t.length >= 5 ? 1 : 0))) return 1.5;
  return 0;
}
const gsCache = new WeakMap();           // טקסט מנורמל לכל רשומה (בלי לשנות את הרשומה עצמה - היא נשלחת לשרת בעדכון)
function gsMatch(rec, tokens) {         // מחזיר ציון או 0 (כל המילים חייבות להתאים)
  let c = gsCache.get(rec);
  if (!c) { const full = gsNorm(Object.values(rec).join(" ")); c = { full, words: [...new Set(full.split(" "))] }; gsCache.set(rec, c); }
  let sc = 0;
  for (const t of tokens) { const x = gsTokenScore(t, c.full, c.words); if (!x) return 0; sc += x; }
  return sc;
}
function gsHighlight(val, tokens) {
  return String(val ?? "").split(/(\s+)/).map(w => {
    if (!w.trim()) return escHtml(w);
    const n = gsNorm(w);
    const hit = n && tokens.some(t => /\d/.test(t) ? n.includes(t) : (n.includes(t) || gsLev(t, n, t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0) <= (t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0)));
    return hit ? `<mark>${escHtml(w)}</mark>` : escHtml(w);
  }).join("");
}
// ח.פ. או ח.צ.: חברה ציבורית (לפי סוג התאגיד ברשם, ובלעדיו לפי מספר שמתחיל ב-52) מוצגת "ח.צ."
const chpLbl = (chp, type) => /ציבורית/.test(type || "") || (!/פרטית|שותפות|עמותה|אגודה|חל"צ|ציבורית/.test(type || "") && /^52\d{7}$/.test(String(chp || "").replace(/\D/g, ""))) ? "ח.צ." : "ח.פ.";
const GS_BIZ_LABELS = { permit_name: "שם בהיתר", registrar_name: "שם ברשם", chp_number: 'ח.פ.', entity_type: "סוג ישות", category: "קטגוריה", region: "אזור", biz_type: "סוג עסק",
  visibility: "פרטי / כללי", agch_approved: 'אישור אג"ח', tase_has_agch: 'אג"ח בבורסה', registry_status: "סטטוס ברשם", notes: "הערות", notes_scope: "היכן להציג הערה", updated_at: "עודכן" };

  is_private: "קיים היתר פרטי", annual_interest: "ריבית %", redemption_date: "מועד פדיון", linkage: "הצמדה", last_price: "שער אחרון", ytm_gross: "תשואה לפדיון", midroog_rating: "דירוג מידרוג", maalot_rating: "דירוג מעלות", notes: "הערות" };

function gsCard(rec, kind, tokens) {

function runGlobalSearch() {

// חיפוש חברה לפי שם במאגר הרישום (company-info-db) - בחירה ממלאת את ח.פ. ומפעילה את החיפוש ברשם
let nsSeq = 0;
// חיפוש במאגר הרישום (לפי שם, או לפי תחילת מספר ח.פ.) - התוצאות מוצגות ב-#ns-out, כל חברה עם סימון קיים / חסר
async function registrySearchInto(q) {
  const out = document.getElementById("ns-out"); if (!out) return;
  const seq = ++nsSeq;
  out.innerHTML = `<div class="gs-info" style="margin:6px 0;">מחפש…</div>`;
  let d, errMsg = "";
  const ac = new AbortController(), tmo = setTimeout(() => ac.abort(), 10000);
  try { d = await apiFetch(`/registry-name-search?q=${encodeURIComponent(q)}`, { signal: ac.signal }); }
  catch (e) {
    errMsg = e.name === "AbortError" ? "החיפוש לא הגיב תוך 10 שניות" : /Unauthorized/.test(e.message) ? "הסיסמה שגויה - התחבר מחדש" : /503|לא מחובר/.test(e.message) ? "החיפוש לפי שם לא זמין (המאגר לא מחובר לפרויקט)" : "שגיאה בחיפוש: " + e.message;
  }
  clearTimeout(tmo);
  if (seq !== nsSeq) return;
  if (errMsg) { out.innerHTML = `<div class="gs-info" style="margin:6px 0;color:var(--red);">${escHtml(errMsg)}</div>`; return; }
  const rs = d.results || [];
  out.innerHTML = d.hint ? `<div class="gs-info" style="margin:6px 0;">${escHtml(d.hint)}</div>` : rs.length
    ? rs.map(r => { const ex = existingBiz(r.id);
        return `<div class="ns-row ${r.defunct ? "defunct" : ""} addable" data-id="${escHtml(String(r.id))}"><div><b>${escHtml(r.name)}</b>
          <div class="m">${escHtml(r.type)} · ${chpLbl(r.id, r.type)} ${escHtml(String(r.id))}${r.status ? " · " + escHtml(r.status) : ""}</div><div>${statusBadge(ex)}</div></div>
          ${ex.length ? circ("edit", `data-edit="${escHtml(ex[0].id)}"`) : circ("add", `data-add="${escHtml(String(r.id))}"`)}</div>`; }).join("") + (d.more ? `<div class="gs-info" style="margin:6px 0;">יש עוד תוצאות - דייק את החיפוש</div>` : "")
    : `<div class="gs-info" style="margin:6px 0;">לא נמצאו חברות${/^\d+$/.test(q) ? " שמספרן מתחיל בספרות האלה" : " בשם הזה"}${(d.errors || []).length ? ` (שגיאה חלקית: ${escHtml(d.errors.join(" | "))})` : ""}</div>`;
  out.querySelectorAll(".ns-row.addable").forEach(row => row.addEventListener("click", () => {      // כל הכרטיסייה לחיצה: קיים = עריכה, חסר = הוספה
    const ex = existingBiz(row.dataset.id);
    if (ex.length) openFormSkip(ex[0].id); else addCompany(row.dataset.id);
  }));
}

function bindEvents() {
  const on = (id, ev, fn) => { const el=document.getElementById(id); if(el) el.addEventListener(ev, fn); };

  on("srch",     "input",  e => { search        = e.target.value; render(); });

    on("f-region", "change", e => { filterRegion  = e.target.value; render(); });
    on("f-biztype","change", e => { filterBizType = e.target.value; render(); });
    on("f-vis",    "change", e => { filterVis     = e.target.value; render(); });

  }
  on("pwd","keydown", e => { if(e.key==="Enter") doLogin(); });
