    document.getElementById("f-permit")?.addEventListener("input", updatePermitGate);
    document.getElementById("f-reg")?.addEventListener("input", updatePermitGate);
  }
  if (view === "search" && !window.PD) {
    const g = document.getElementById("gs");
    if (g) { let tm; g.addEventListener("input", e => { gsQuery = e.target.value; clearTimeout(tm); tm = setTimeout(runGlobalSearch, 120); }); g.focus(); }
    runGlobalSearch();
  }

  // שמירת ח.פ. שמוקלד בזמן אמת כדי שלא יאבד בעת render מחדש
  const chpEl = document.getElementById("chp");
  if (chpEl) {
    let lt, pt;
    chpEl.addEventListener("input", e => {
      editBiz = { ...(editBiz || {}), chp_number: e.target.value };
      updateFormGate();
      const n = e.target.value.trim();
      clearTimeout(lt);
      if (/^\d{9}$/.test(n) && !chpCheckDigitOk(n)) {       // מספר לא תקין: מציגים מיד, בלי חיפוש ברשם
        clearTimeout(pt); lookupSeq++; chpResult = null; chpError = ""; lastAutoNumber = "";
        const ns0 = document.getElementById("ns-out"); if (ns0) ns0.innerHTML = "";
        const sp = document.getElementById("chp-spin"); if (sp) sp.style.display = "none";
        const lo0 = document.getElementById("lookup-out"); if (lo0) lo0.innerHTML = lookupOutHtml();
        updateFormGate(); return;
      }
      if (!chpResult) { const lo = document.getElementById("lookup-out"); if (lo && !/^\d{7,10}$/.test(n)) lo.innerHTML = lookupOutHtml(); }
      const ns = document.getElementById("ns-out");
      if (/^\d{3,8}$/.test(n)) { clearTimeout(pt); pt = setTimeout(() => registrySearchInto(n), 300); }            // תחילת מספר: רשימת חברות שהמספר שלהן מתחיל כך
      else if (ns && !/^\d{9,10}$/.test(n)) { clearTimeout(pt); ns.innerHTML = ""; }
      if (/^\d{9,10}$/.test(n)) { clearTimeout(pt); if (ns) ns.innerHTML = ""; }
      if (/^\d{7,10}$/.test(n) && n !== lastAutoNumber) lt = setTimeout(() => { lastAutoNumber = n; doLookup(true); }, n.length >= 9 ? 0 : 450);   // מ-7 ספרות: חיפוש ברשם אוטומטי
    });

  // CSV drag-drop
  const dz = document.getElementById("drop-zone");
  if (dz) {
    dz.addEventListener("dragover",  e => { e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag-over"));
    dz.addEventListener("drop", e => {
      e.preventDefault();
      dz.classList.remove("drag-over");
      const file = e.dataTransfer?.files?.[0];
      if (file) handleCsvFile(file);
    });
  }
  const fi = document.getElementById("csv-file-input");
  if (fi) fi.addEventListener("change", e => {
    const file = e.target.files?.[0];
    if (file) handleCsvFile(file);
  });

  // Auto-focus
  const pwd = document.getElementById("pwd");
  if (pwd) setTimeout(() => pwd.focus(), 40);
}

function chpCheckDigitOk(n) {

let lookupSeq = 0, lastAutoNumber = "";

async function doLookup(auto) {
  const number = (document.getElementById("chp")?.value || "").trim();
  if (!number) { if (!auto) { chpError = "הכנס מספר רישום"; render(); } return; }
  if (noChp) return;

  const seq = ++lookupSeq;
  const out = () => document.getElementById("lookup-out");
  const spin = document.getElementById("chp-spin");
  if (auto) { chpResult = null; chpError = ""; if (spin) spin.style.display = ""; if (out()) out().innerHTML = `<div class="lookup-loading"><span class="spin"></span> מחפש ברשם…</div>`; updateFormGate(); }
  else { chpLoading = true; chpError = ""; chpResult = null; render(); }
  let res = null, err = "";
  try {
    res = await apiFetch(`/lookup?number=${encodeURIComponent(number)}`);
    if (!res.found) { err = number.length < 9 ? "" : "לא נמצא תאגיד עם מספר זה בשום רשם. לעסק בלי ח.פ. - לחץ \"אין ח.פ.\""; res = null; }   // מספר חלקי: בלי הודעת שגיאה (הרשימה למעלה מציגה מועמדים)
  } catch(e) { err = "שגיאת חיבור לרשם הרשמי"; }
  if (seq !== lookupSeq || (document.getElementById("chp")?.value || "").trim() !== number) {   // הוקלד מספר אחר בינתיים

  if (res) res.id = number;
  chpResult = res; chpError = err; chpLoading = false;

  if (auto) { if (out()) out().innerHTML = lookupOutHtml(); updateFormGate(); } else render();
  if (chpResult) {
    const regEl = document.getElementById("f-reg");
    if (regEl) regEl.value = chpResult.name;     // כשיש ח.פ. השם נשלט ע"י הרשם (לא ניתן לעריכה)

  }
}

      try {
        const live = await apiFetch("/company-bonds?chp=" + encodeURIComponent(chp));
        if (live && live.ok) {
          for (const m of live.rows || []) rows.push({ id: m.security_id, name: m.name, symbol: m.symbol, inMaya: true,
            scope: (savedBy.get(m.security_id) || {}).scope || "", saved: savedBy.has(m.security_id) });
          bpState.live = live.date || true;
        } else if (live) bpState.liveErr = live.message || live.error || "שגיאה לא ידועה";
      } catch (e) { if (e.message === "Unauthorized") throw e; bpState.liveErr = e.message; }
    }
    const seen = new Set(rows.map(r => r.id));
    for (const r of saved.rows || []) {
      if (!seen.has(Number(r.security_id))) rows.push({ id: Number(r.security_id), name: r.bond_name, symbol: r.symbol, inMaya: false, scope: r.scope, saved: true });
    }
    const off = await fetch("/data/bonds_list/offerings.json").then(r => r.ok ? r.json() : null).catch(() => null);
    if (off) rows.push(...bpOfferingRows(off, bpState.biz, chp, savedBy, new Set(rows.map(r => r.id))));
    bpState.rows = rows; bpState.updated = snap ? snap.updated : ""; bpState.noSnap = !snap;
  } catch (e) {
    bpState.error = e.message === "Unauthorized" ? "נדרשת התחברות" : "שגיאה בטעינה: " + e.message;
  }
  bpState.loading = false;
  renderBondPicker();
}

// הנפקות (עתידיות/פתוחות) בחלון הבחירה, גם לחברה חדשה שעוד לא נכנסה לבנייה: לפי ח.פ., או לפי שם הנפקה (מקוצר) שהוא תחילת השם של החברה הזו בלבד
function bpWords(n) { return String(n || "").toLowerCase().replace(/בע"?מ|בע״מ|בע''מ/g, " ").split(/\s+/).map(w => w.replace(/[^0-9a-z\u0590-\u05ff]/g, "")).filter(Boolean); }
function bpNameMatches(offName, biz) {
  const w = bpWords(offName); if (!w.length) return false;
  const lead = n => { const x = bpWords(n); return x.length >= w.length && w.every((v, i) => x[i] === v); };
  if (!lead(biz.registrar_name) && !lead(biz.permit_name)) return false;
  return !businesses.some(b => b.id !== biz.id && (lead(b.registrar_name) || lead(b.permit_name)));
}
function bpOfferingRows(off, biz, chp, savedBy, seen) {
  const norm = x => String(x || "").replace(/^0+/, "");
  const mine = (oc, name) => oc ? norm(oc) === norm(chp) : bpNameMatches(name, biz);
  const out = [];
  for (const o of off.open || []) {
    if (!mine(o.chp_number, o.issuer_name)) continue;
    for (const sec of o.securities || []) {
      const id = Number(sec.security_id); if (!id || seen.has(id)) continue; seen.add(id);
      out.push({ id, name: `${String(sec.security_name || "").replace(/\s+/g, " ").trim()} (בהנפקה)`, symbol: "", inMaya: true,
                 scope: (savedBy.get(id) || {}).scope || "", saved: savedBy.has(id) });
    }
  }
  for (const o of off.upcoming || []) {
    if (!mine(o.chp_number, o.company_name)) continue;
    (o.securities || []).forEach((sec, i) => {
      const pid = 900000000000 + Number(o.id) * 100 + i;
      if (sec.name && Number.isFinite(pid) && !seen.has(pid)) { seen.add(pid);
        out.push({ id: pid, name: `${sec.name} (הנפקה עתידית)`, symbol: "", inMaya: true, scope: (savedBy.get(pid) || {}).scope || "", saved: savedBy.has(pid) });
      } else if (!sec.name) {
        out.push({ info: true, name: `${sec.security_type || 'אג"ח'} - הנפקה עתידית${o.draft_title ? " (" + o.draft_title + ")" : ""}`,
                   link: o.link_prospectus || o.link_trust_indenture || "" });
      }
    });
  }
  return out;
}

const BP_ON  = "background:var(--navy,#274d5b);color:#fff;border-color:var(--navy,#274d5b);";
const BP_OFF = "background:var(--bg);color:var(--text);border-color:var(--border);";
// כפתורי הבחירה: "פרטי" = פרטי + כללי (שניהם, "כללי" מסומן אוטומטית), "כללי" = כללי בלבד, "רק פרטי" = פרטי בלבד. לחיצה שנייה מבטלת.
const BP_SCOPE_OF = { private: "both", general: "general", only: "private" };
const bpOn = (scope, which) => which === "private" ? scope === "both" : which === "general" ? (scope === "general" || scope === "both") : scope === "private";
function bpToggle(i, which) {   // מעדכן רק את הכפתורים (בלי לטעון מחדש את החלון)
  const r = bpState.rows[i];
  r.scope = r.scope === BP_SCOPE_OF[which] ? "" : BP_SCOPE_OF[which];
  for (const w of ["private", "general", "only"]) {
    const el = document.getElementById(`bp-${i}-${w}`);
    if (el) el.style.cssText = bpBtnStyle(w) + (bpOn(r.scope, w) ? BP_ON : BP_OFF);
  }
}
const bpBtnStyle = w => w === "only" ? "padding:2px 8px;border-radius:6px;border:1px solid;cursor:pointer;font-size:11px;" : "padding:3px 12px;border-radius:6px;border:1px solid;cursor:pointer;font-size:12px;";

function bpAddById() {
  const el = document.getElementById("bp-add-id");
  const id = parseInt(el.value, 10);
  if (!Number.isInteger(id) || id <= 0) { showStatus("מספר אג\"ח לא תקין"); return; }
  if (!bpState.rows.some(r => r.id === id)) bpState.rows.push({ id, name: "אג\"ח מספר " + id, symbol: "", inMaya: false, scope: "both", saved: false, added: true });
  renderBondPicker();
}

function bpRemove(i) { bpState.rows[i].remove = true; renderBondPicker(); }
function closeBondPicker() { bpState = null; document.getElementById("bp-root")?.remove(); }

async function saveBondPicker() {
  const st = bpState; if (!st) return;
  const items = st.rows.filter(r => !r.remove && r.scope).map(r => ({ security_id: r.id, bond_name: r.name, symbol: r.symbol, scope: r.scope }));
  // מחיקה מפורשת בלבד: אג"ח שהיא במאיה והוסרה ממנה הסימון, או שהוסרה ידנית. אג"ח שנעלמה ממאיה לא נמחקת.
  const remove = st.rows.filter(r => r.saved && (r.remove || (r.inMaya && !r.scope))).map(r => r.id);
  try {
    const resp = await apiFetch("/approved-bonds", { method: "PUT", body: JSON.stringify({ chp: String(st.biz.chp_number).trim(), items, remove }) });
    showStatus(resp && resp.refresh && resp.refresh.triggered
      ? "נשמר ✓ הרשימה נבנית עכשיו; האג\"ח יופיעו בעוד כדקה-שתיים"
      : "נשמר ✓ (לא ניתן להפעיל בנייה מיידית - הרשימה תתעדכן בריצה הבאה של bonds-list)");
    closeBondPicker();
    if (window.PD && PD.apprReload) PD.apprReload().then(() => { if (view === "admin") render(); });
  } catch (e) {
    if (e.message === "Unauthorized") { handleUnauth(); return; }
    showStatus("שגיאה בשמירה: " + e.message);
  }
}

    <div class="bp-list" style="max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:8px;">

        return `
        <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #edf2f2;${r.inMaya ? "" : "opacity:.65;"}">

            <div style="font-size:11px;color:var(--muted);">מס' ${r.id}${r.symbol ? " · " + escHtml(r.symbol) : ""}${r.inMaya ? "" : " · לא קיימת כרגע במאיה (נשמרת, לא מוצגת ברשימה)"}</div></div>
          <div style="white-space:nowrap;">${btn(bpOn(r.scope, "private"), "פרטי", i, "private")} ${btn(bpOn(r.scope, "only"), "רק פרטי", i, "only")} ${btn(bpOn(r.scope, "general"), "כללי", i, "general")}
            ${!r.inMaya ? `<button onclick="bpRemove(${i})" title="הסרה מהרשימה השמורה" style="border:none;background:none;cursor:pointer;">🗑</button>` : ""}</div>
        </div>`; }).join("") || '<div style="padding:14px;text-align:center;color:var(--light);">אין אג"ח לחברה</div>'}
    </div>
    <div style="display:flex;gap:6px;margin-top:10px;"><input id="bp-add-id" type="number" placeholder="הוספה לפי מספר אג&quot;ח" style="flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;direction:ltr;">
      <button class="btn-ghost" onclick="bpAddById()">הוסף</button></div>`;
  const root = document.createElement("div");

    <div class="modal-box" style="max-width:560px;${reopen ? "animation:none;" : ""}">
      <div class="modal-title">בחירת אג"ח מסוימים</div>
      <div class="modal-biz-name">${escHtml((st.biz.registrar_name || st.biz.permit_name || "").trim())} · ${chpLbl(st.biz.chp_number, st.biz.biz_type)} ${escHtml(st.biz.chp_number || "")}</div>
      ${body}
      <div class="modal-actions" style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn-ghost" onclick="closeBondPicker()">ביטול</button>
        <button class="btn-primary" onclick="saveBondPicker()" ${st.loading || st.error ? "disabled" : ""}>שמירה</button>
      </div>
    </div></div>`;
  document.body.appendChild(root);
  const list = root.querySelector(".bp-list"); if (list) list.scrollTop = keepScroll;
}

// שינוי "אישור אג"ח" בטבלת הניהול. "⚙ בחירת אג"ח…" היא פעולה: תמיד פותחת את חלון הבחירה (גם אם החברה כבר במצב
// "אג"ח מסוימים"), ומעבירה את החברה למצב הזה אם עוד לא; הבחירה בתפריט עצמה חוזרת לערך הנוכחי.
async function agchChange(id, sel) {
  const biz = businesses.find(b => b.id === id); if (!biz) return;
  const val = sel.value === "__pick__" ? BOND_PICK : sel.value;
  if (val !== (biz.agch_approved || "")) { const ok = await inlineUpdate(id, "agch_approved", val); if (!ok) { sel.value = biz.agch_approved || ""; return; } render(); }
  else if (sel.value === "__pick__") sel.value = BOND_PICK;
  if (sel.value === "__pick__" || val === BOND_PICK) openBondPicker(id);
}

let admSearchTimer = null;
function onAdminSearch(v) {   // חיפוש בטבלת הניהול: הרצה אחרי הפסקת הקלדה (ולא באמצע), ושדה החיפוש נשאר אותו אלמנט כדי שההקלדה לא תיקטע
  search = v;

async function inlineUpdate(id, field, value) { return inlineUpdateMany(id, { [field]: value }); }
async function inlineUpdateMany(id, fields) {
  await bizFresh();
  const biz = businesses.find(b => b.id === id);
  if (!biz) return;
  const updated = { ...biz, ...fields };
  try {
    await apiFetch(`/businesses/${id}`, { method: "PUT", body: JSON.stringify(updated) });
    businesses = businesses.map(b => b.id === id ? updated : b);
    logChange("edit", biz, updated);
    showStatus("נשמר ✓");
    return true;
  } catch(e) {
    if (e.message === "Unauthorized") { handleUnauth(); return false; }
    showStatus("שגיאה בשמירה"); render();
    return false;
  }
}

// טבלת העדכון: כל שינוי נשמר מיד ואוטומטית ונרשם ביומן השינויים (אפשר לבטל). הערה חדשה ממתינה (pendingNotes) עד שבוחרים היכן להציג אותה.
const pendingNotes = {};
async function noteInline(id, raw) {
  const v = (raw || "").trim();
  const biz = businesses.find(b => b.id === id); if (!biz) return;
  if (!v) { delete pendingNotes[id]; if ((biz.notes || "") !== "" || biz.notes_scope) await inlineUpdateMany(id, { notes: "", notes_scope: "" }); render(); return; }
  if (v === (biz.notes || "").trim() && pendingNotes[id] === undefined) return;
  if (biz.notes_scope) { delete pendingNotes[id]; await inlineUpdateMany(id, { notes: v }); render(); return; }
  if ((biz.notes || "").trim()) { delete pendingNotes[id]; await inlineUpdateMany(id, { notes: v, notes_scope: "companies" }); render(); return; }   // הערה ישנה בלי בחירה = חברות
  pendingNotes[id] = v; showStatus("בחר היכן להציג את ההערה"); render();     // הערה חדשה: חובה לבחור
}
async function noteScopeChange(id, scope) {
  if (pendingNotes[id] !== undefined) { const v = pendingNotes[id]; delete pendingNotes[id]; await inlineUpdateMany(id, { notes: v, notes_scope: scope }); }
  else await inlineUpdateMany(id, { notes_scope: scope });
  render();
}
// שם בהיתר עסקה זהה לשם ברשם (בלי הבדלי בע"מ, רווחים ופיסוק): מוצג "שם זהה בהיתר עסקה" עם עיפרון לעריכה
const pnNorm = x => String(x || "").replace(/בע"?מ|בע״מ|בע''מ/g, "").replace(/["'׳״`.,\-()]/g, "").replace(/\s+/g, " ").trim();
function samePermitName(b) { const p = (b.permit_name || "").trim(); return !p || pnNorm(p) === pnNorm(b.registrar_name); }
function subAddOpen(btn) { const w = btn.closest(".sub-add"), f = w.querySelector(".sub-add-form"); btn.style.display = "none"; f.style.display = ""; f.querySelector("input").focus(); }
function subAddClose(btn) { const w = btn.closest(".sub-add"); w.querySelector(".sub-add-form").style.display = "none"; w.querySelector(".sub-add-btn").style.display = ""; }
const SUB_VIS_OPTS = [["", "כללי"], ["פרטי", "פרטי + כללי"], ["רק פרטי", "רק פרטי"]];
const subVisLabel = v => (SUB_VIS_OPTS.find(x => x[0] === (v || "")) || SUB_VIS_OPTS[0])[1];
const subNormName = x => String(x || "").replace(/["'׳״`\-–(),.]/g, " ").replace(/\s+/g, " ").trim();
function subRowsOf(main) { return main && digitsOf(main.chp_number) ? businesses.filter(b => b.id !== main.id && digitsOf(b.chp_number) === digitsOf(main.chp_number)) : []; }
// "+ הוספת תת-שורה" (רישום נוסף עם אותו ח.פ. ושם בהיתר = הפירוט): בטבלת העדכון, בטופס העריכה ובהוספת עסק עם ח.פ. שכבר קיים. נשמר מיד
function subAddWidget(id, withList) {
  const list = withList ? subRowsOf(businesses.find(b => b.id === id)) : [];
  return `<div class="sub-add" onclick="event.stopPropagation()">${withList ? `<div class="sub-add-list">${list.map(x => `<div>↳ ${escHtml(x.permit_name || "")} <span style="color:var(--muted);font-size:12px">(${subVisLabel(x.visibility)})</span></div>`).join("")}</div>` : ""}<button type="button" class="sub-add-btn" onclick="subAddOpen(this)" title="רישום נוסף לאותה חברה (אותו ח.פ.), למשל &quot;מסלול הלכה&quot;: מופיע ברשימות מתחת לחברה">+ הוספת תת-שורה</button><span class="sub-add-form" style="display:none"><input type="text" placeholder="פירוט (למשל: מסלול הלכה)" onkeydown="if(event.key==='Enter'){event.preventDefault();subAddSave('${id}',this)}"><select>${SUB_VIS_OPTS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select><button type="button" onclick="subAddSave('${id}',this)">הוספה</button><button type="button" class="sub-add-x" onclick="subAddClose(this)">ביטול</button></span></div>`;
}
async function subAddSave(id, el) {          // "הוספת תת-שורה" מתחת לשם העסק: רישום נוסף עם אותו ח.פ. ושם בהיתר = הפירוט
  await bizFresh();
  const f = el.closest(".sub-add-form"), name = f.querySelector("input").value.replace(/\s+/g, " ").trim(), vis = f.querySelector("select").value, main = businesses.find(b => b.id === id);
  if (!main) return;
  if (!name) { f.querySelector("input").focus(); return; }
  if (subRowsOf(main).some(b => subNormName(b.permit_name) === subNormName(name))) { alert("כבר יש תת-שורה בשם הזה"); return; }
  const sub = { id: uid(), chp_number: main.chp_number, entity_type: main.entity_type || "company", registrar_name: main.registrar_name || "", permit_name: name, category: main.category || "", region: main.region || "", notes: "", visibility: vis, agch_approved: "לא", biz_type: main.biz_type || "", has_details: 0 };
  try {
    await apiFetch("/businesses", { method: "POST", body: JSON.stringify(sub) });
    businesses = [...businesses, sub]; logChange("add", null, sub);
    showStatus("נוספה תת-שורה: " + name);
    if (view === "form") { const w = el.closest(".sub-add"), lst = w.querySelector(".sub-add-list"); if (lst) lst.insertAdjacentHTML("beforeend", `<div>↳ ${escHtml(name)} <span style="color:var(--muted);font-size:12px">(${subVisLabel(vis)})</span></div>`); f.querySelector("input").value = ""; subAddClose(el); }          // בטופס: בלי רינדור מחדש (כדי לא לאבד שדות שעוד לא נשמרו)
    else render();
  } catch (e) { if (e.message === "Unauthorized") { handleUnauth(); return; } alert("השמירה נכשלה: " + e.message); }
}

// ── שינוי סיסמה (כפתור בכותרת, בכל אזורי הניהול) ──
function openChangePassword() {

// ── כיסוי מדד: כמה אחוז מחברות המדד (ברירת מחדל ת"א-SME60) יש להן היתר עסקה, וכמה היתר פרטי ──
let idxBonds = null, idxMarket = null; const idxCache = {}; let idxLoading = false;
// עוגה בתוך עוגה: טבעת חיצונית = אחוז עם היתר עסקה, טבעת פנימית = אחוז עם היתר פרטי (מתוך כלל המדד)
function idxPie(permit, priv, note1, note2) {
  const gen = Math.max(0, Math.round((permit - priv) * 10) / 10), c = 2 * Math.PI * 38, seg = (from, pct, color) => pct > 0 ? `<circle cx="50" cy="50" r="38" fill="none" stroke="${color}" stroke-width="22" stroke-dasharray="${(c * Math.min(pct, 100) / 100).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-c * from / 100).toFixed(2)}" transform="rotate(-90 50 50)"/>` : "";
  return `<div class="idx-pie"><svg viewBox="0 0 100 100" width="96" height="96"><circle cx="50" cy="50" r="38" fill="none" stroke="#e6ecec" stroke-width="22"/>${seg(0, priv, "#1fa59a")}${seg(priv, gen, "#274d5b")}</svg>
    <div><div class="idx-line"><i style="background:#1fa59a"></i><b>${priv}%</b> פרטי</div>
    <div class="idx-line" style="margin-top:6px;"><i style="background:#274d5b"></i><b>${permit}%</b> הת"ע</div></div></div>`;
}
function idxBoxHtml() {
  const d = idxCache.tb60;
  let body;
  if (!d) { body = `<span style="color:var(--muted);font-size:12px;">${idxLoading ? "טוען…" : ""}</span>`; if (!idxLoading) idxLoad(); }
  else if (d.error) body = `<span style="color:var(--red);font-size:12px;">${escHtml(d.error)}</span>`;
  else {
    const appr = new Map((idxBonds?.rows || []).map(r => [String(r.security_id), r.list || ""]));       // מספר אג"ח -> רשימה (כללי / פרטי / כללי+פרטי)
    const tw = d.securities.reduce((a, x) => a + x.weight, 0) || 1;
    const hit = d.securities.filter(x => appr.has(x.securityNumber)), prv = hit.filter(x => /פרטי/.test(appr.get(x.securityNumber)));
    const wsum = l => l.reduce((a, x) => a + x.weight, 0), pc = w => Math.round(w * 1000 / tw) / 10;
    body = `<div class="idx-blk"><div class="idx-sub">תל בונד 60</div>` + idxPie(pc(wsum(hit)), pc(wsum(prv)), `${hit.length} מתוך ${d.securities.length} אג"ח`, `${prv.length} אג"ח`) + `</div>`;
    const m = idxMarket;
    if (m && m.totalValue) {       // כלל האג"ח בבורסה, לפי שווי שוק
      const sv = ids => ids.reduce((a, i) => a + (m.values[i] || 0), 0), ids = [...appr.keys()].filter(i => m.values[i]), pids = ids.filter(i => /פרטי/.test(appr.get(i)));
      const p2 = v => Math.round(v * 1000 / m.totalValue) / 10;
      body += `<div class="idx-blk"><div class="idx-sub">כלל האג"ח</div>` + idxPie(p2(sv(ids)), p2(sv(pids)), `${ids.length} מתוך ${m.count} אג"ח`, `${pids.length} אג"ח`) + `</div>`;

}

// ── יומן שינויים: כל הוספה / מחיקה / עדכון נרשמים, ואפשר לבטל שינוי מסוים או לחזור אחורה ──
let changeLog = []; let chgSeq = 0;
try { changeLog = JSON.parse(sessionStorage.getItem("chglog") || "[]"); chgSeq = changeLog.reduce((m, e) => Math.max(m, e.n), 0); } catch {}
const saveLog = () => { try { sessionStorage.setItem("chglog", JSON.stringify(changeLog.slice(-200))); } catch {} };
const CHG_LABELS = { permit_name: "שם בהיתר", registrar_name: "שם ברשם", chp_number: "ח.פ.", category: "קטגוריה", permits_category: "קטגוריה לרשימת השטרות", region: "אזור", notes: "הערה", notes_scope: "היכן להציג הערה", visibility: "פרטי/כללי", agch_approved: "אישור אג\"ח", biz_type: "סוג עסק" };
const CHG_SCOPE = { companies: "חברות", bonds: "אג\"ח", both: "שתיהן" };
const chgVal = (f, v) => v === undefined || v === null || v === "" ? (f === "visibility" ? "רק כללי" : "ריק") : f === "notes_scope" ? (CHG_SCOPE[v] || v) : f === "visibility" && v === "פרטי" ? "יש גם פרטי" : v;
const chgName = b => ((b.permit_name || b.registrar_name || "") + "").trim() || "(ללא שם)";
function logChange(type, before, after) {
  const e = { n: ++chgSeq, ts: Date.now(), type, id: (after || before).id, name: chgName(after || before), before, after, changes: [], undone: false };
  if (type === "edit") {
    e.changes = Object.keys(CHG_LABELS).filter(f => (before[f] ?? "") !== (after[f] ?? "")).map(f => ({ f, from: before[f] ?? "", to: after[f] ?? "" }));
    if (!e.changes.length) { chgSeq--; return; }
  }
  changeLog.push(e); if (changeLog.length > 200) changeLog.shift(); saveLog();
}
async function undoEntry(e) {
  try {
    if (e.type === "edit") {
      const cur = businesses.find(b => b.id === e.id); if (!cur) throw new Error("העסק כבר לא קיים");
      const upd = { ...cur }; e.changes.forEach(c => { upd[c.f] = c.from; });
      await apiFetch(`/businesses/${e.id}`, { method: "PUT", body: JSON.stringify(upd) });
      businesses = businesses.map(b => b.id === e.id ? upd : b);
    } else if (e.type === "add") {
      if (businesses.some(b => b.id === e.id)) await apiFetch(`/businesses/${e.id}`, { method: "DELETE" });
      businesses = businesses.filter(b => b.id !== e.id);
    } else {
      if (!businesses.some(b => b.id === e.id)) await apiFetch("/businesses", { method: "POST", body: JSON.stringify(e.before) });
      if (!businesses.some(b => b.id === e.id)) businesses = [...businesses, e.before];
    }
    e.undone = true; saveLog(); return true;
  } catch (err) {
    if (err.message === "Unauthorized") { handleUnauth(); return false; }
    showStatus("הביטול נכשל: " + err.message); return false;
  }
}
async function undoLast() { const e = [...changeLog].reverse().find(x => !x.undone); if (e && await undoEntry(e)) { showStatus("השינוי האחרון בוטל"); render(); if (document.getElementById("log-root")) openChangeLog(); } }
async function undoOne(n) { const e = changeLog.find(x => x.n === n); if (e && !e.undone && await undoEntry(e)) { showStatus("השינוי בוטל"); render(); openChangeLog(); } }
async function undoBackTo(n) {      // מבטל את כל השינויים שאחרי השינוי הזה (מהחדש לישן), כך שהמצב חוזר לרגע שאחריו
  const list = changeLog.filter(x => x.n > n && !x.undone).reverse();
  for (const e of list) if (!(await undoEntry(e))) break;
  render(); openChangeLog();
}
function openChangeLog() {
  document.getElementById("log-root")?.remove();
  const fmtT = ts => new Date(ts).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const det = e => e.type === "edit" ? e.changes.map(c => `${CHG_LABELS[c.f]}: "${escHtml(chgVal(c.f, c.from))}" ← "${escHtml(chgVal(c.f, c.to))}"`).join("<br>") : "";
  const rows = [...changeLog].reverse().map(e => `<div class="lg-row ${e.undone ? "undone" : ""}">
      <div class="lg-top"><span class="lg-chip ${e.type}">${e.type === "add" ? "נוסף" : e.type === "delete" ? "נמחק" : "שונה"}</span><b class="lg-name">${escHtml(e.name)}</b><span style="color:var(--light);font-size:11px;">${fmtT(e.ts)}${e.undone ? " · בוטל" : ""}</span></div>

      <div class="lg-btns">${e.undone ? "" : `<button onclick="undoOne(${e.n})">בטל שינוי זה</button>`}${changeLog.some(x => x.n > e.n && !x.undone) ? `<button onclick="undoBackTo(${e.n})">חזור למצב שאחרי שינוי זה</button>` : ""}</div>
    </div>`).join("") || '<div style="padding:16px;text-align:center;color:var(--light);">עדיין אין שינויים</div>';
  const root = document.createElement("div"); root.id = "log-root";
  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target.classList.contains('modal-overlay'))document.getElementById('log-root').remove()">
    <div class="modal-box" style="max-width:600px;"><div class="modal-title">יומן שינויים</div>

  document.body.appendChild(root);

// החלף את הפונקציה runRegistrySync הקיימת בזו:

async function runRegistrySync() {
  const btn    = document.getElementById("sync-btn");
  const status = document.getElementById("sync-status");
  if (!btn || !status) return;

  btn.disabled = true;
  btn.textContent = "⏳ מסנכרן...";
  status.style.display  = "block";
  status.style.background = "var(--bg2)";
  status.innerHTML = "מתחיל סנכרון...";

  const withChp   = businesses.filter(b => b.chp_number);
  const total     = withChp.length;
  let processed   = 0;
  let updated     = 0;
  let errors      = 0;
  const CONCURRENCY = 5;   // 5 בקשות במקביל

  for (let i = 0; i < withChp.length; i += CONCURRENCY) {
    const batch = withChp.slice(i, i + CONCURRENCY);

    await Promise.all(batch.map(async (biz) => {
      try {
        const res = await apiFetch(`/lookup?number=${encodeURIComponent(biz.chp_number)}`);

        if (res.found) {
          const newName = (res.name    || "").trim();
          const newType = (res.bizType || "").trim();

          const nameChanged = newName && newName !== (biz.registrar_name || "").trim();
          const typeChanged = newType && newType !== (biz.biz_type       || "").trim();

          if (nameChanged || typeChanged) {
            const updatedBiz = {
              ...biz,
              registrar_name: nameChanged ? newName : biz.registrar_name,
              biz_type:       typeChanged ? newType : biz.biz_type,
            };
            await apiFetch(`/businesses/${biz.id}`, {
              method: "PUT",
              body:   JSON.stringify(updatedBiz),
            });
            businesses = businesses.map(b => b.id === biz.id ? updatedBiz : b);
            updated++;
          }
        }
      } catch(e) {
        errors++;
        console.warn(`Lookup failed (${biz.chp_number}):`, e.message);
      }

      processed++;
      const pct = Math.round((processed / total) * 100);
      status.innerHTML = `⏳ ${pct}% — עברו ${processed}/${total} · עודכנו: <strong>${updated}</strong>`;
    }));
  }

  status.style.background = "#edf7f1";
  status.innerHTML = `✅ סנכרון הושלם — עודכנו <strong>${updated}</strong> מתוך <strong>${total}</strong> עסקים${errors ? ` · שגיאות: ${errors}` : ""}`;
  btn.disabled    = false;
  btn.textContent = "🔄 עדכן שמות מרשם";
  render();
}

    <span class="sub-add-form"><input type="text" id="new-sub-name" placeholder="פירוט (למשל: מסלול הלכה)" onkeydown="if(event.key==='Enter'){event.preventDefault();newSubAdd()}"><select id="new-sub-vis">${SUB_VIS_OPTS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select><button type="button" onclick="newSubAdd()">+ הוספת תת-שורה</button></span>`;
}
function subsRepaint() { const el = document.getElementById("subs-box"); if (el) el.innerHTML = formSubsHtml(); }
function newSubAdd() {
  const n = document.getElementById("new-sub-name"), name = String(n && n.value || "").replace(/\s+/g, " ").trim(), vis = (document.getElementById("new-sub-vis") || {}).value || "";
  if (!name) { if (n) n.focus(); return; }
  if (newSubs.some(x => subNormName(x.name) === subNormName(name))) { alert("כבר יש תת-שורה בשם הזה"); return; }
  newSubs.push({ name, vis }); formDirty = true; subsRepaint(); const n2 = document.getElementById("new-sub-name"); if (n2) n2.focus();
}

// ════════════════════════════════════════════
//  CSV IMPORT LOGIC
// ════════════════════════════════════════════

function openCsvImport() {
  csvStep = "upload"; csvHeaders = []; csvRows = [];
  csvColMap = {}; csvErrors = []; csvImported = 0; csvDeleted = 0;
  view = "csv-import";
  render();
}

// Parse CSV (handles quoted fields, commas inside quotes, \r\n and \n)
function parseCsv(text) {
  // Normalize line endings
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  const result = [];

  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let cur = "";
    let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuote) {
        if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
        else if (ch === '"') { inQuote = false; }
        else { cur += ch; }
      } else {
        if (ch === '"') { inQuote = true; }
        else if (ch === ',') { row.push(cur.trim()); cur = ""; }
        else { cur += ch; }
      }
    }
    row.push(cur.trim());
    result.push(row);
  }
  return result;
}

// Auto-detect which column maps to which field
function autoDetectMapping(headers) {
  const map = {};
  for (const field of CSV_FIELDS) {
    map[field.key] = -1;
    for (let i = 0; i < headers.length; i++) {
      const h = headers[i].trim().toLowerCase().replace(/['"]/g,"");
      for (const alias of field.aliases) {
        if (h === alias.toLowerCase().replace(/['"]/g,"") || h.includes(alias.toLowerCase())) {
          map[field.key] = i;
          break;
        }
      }
      if (map[field.key] >= 0) break;
    }
  }
  return map;
}

function handleCsvFile(file) {
  if (!file.name.endsWith(".csv") && file.type !== "text/csv") {
    alert("אנא בחר קובץ CSV בלבד");
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    let text = e.target.result;
    // Strip BOM if present
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    const parsed = parseCsv(text);
    if (parsed.length < 2) {
      alert("הקובץ ריק או מכיל שורה אחת בלבד");
      return;
    }
    csvHeaders = parsed[0];
    csvRows    = parsed.slice(1).filter(r => r.some(c => c.trim()));
    csvColMap  = autoDetectMapping(csvHeaders);
    csvStep    = "preview";
    render();
  };
  reader.readAsText(file, "UTF-8");
}

function updateColMap(fieldKey, value) {
  csvColMap[fieldKey] = parseInt(value, 10);
  // Update the select's 'mapped' class visually
  const sel = document.getElementById(`map-${fieldKey}`);
  if (sel) sel.className = parseInt(value) >= 0 ? "mapped" : "";
  // Re-render preview table only (lightweight update)
  const previewSection = document.querySelector(".preview-section");
  if (previewSection) {
    const previewRows = csvRows.slice(0, 8);
    const mappedFields = CSV_FIELDS.filter(f => (csvColMap[f.key]??-1) >= 0);
    previewSection.querySelector("table").innerHTML = `
      <thead><tr>${mappedFields.map(f=>`<th>${f.label}</th>`).join("")}</tr></thead>
      <tbody>
        ${previewRows.map(row=>`
          <tr>${mappedFields.map(f=>`<td>${escHtml(row[csvColMap[f.key]]||"")}</td>`).join("")}</tr>
        `).join("")}
      </tbody>`;
  }
}

// Normalize agch_approved values from CSV → system values
function normalizeAgch(val) {
  const v = (val || "").trim();
  if (v === "מאושר"  || v === "כן" || v === "yes" || v === "true" || v === "1") return "כן";
  if (v === "לא מאושר" || v === "לא" || v === "no"  || v === "false"|| v === "0") return "לא";
  if (v === "רק פרטי" || v === "פרטי בלבד" || v === "רק-פרטי") return "רק פרטי";
  if (v === "רק כללי" || v === "כללי בלבד" || v === "רק-כללי") return "רק כללי";
  return "";
}
async function startImport() {
  // Validate at least a name field is mapped
  const hasName = (csvColMap["registrar_name"]??-1) >= 0 || (csvColMap["permit_name"]??-1) >= 0;
  if (!hasName) {
    alert("חובה למפות לפחות את עמודת 'שם ברשם הרשמי' או 'שם בהיתר עסקה'");
    return;
  }

  csvStep    = "importing";
  csvErrors  = [];
  csvImported = 0;
  csvDeleted  = 0;

  const existingIds = businesses.map(b => b.id);
  csvTotal    = existingIds.length + csvRows.length;
  csvProgress = 0;
  csvPhase    = "מוחק עסקים קיימים...";
  render();

  // ── PHASE 1: Delete all existing ──
  for (const id of existingIds) {
    try {
      await apiFetch(`/businesses/${id}`, { method: "DELETE" });
      csvDeleted++;
    } catch(e) {
      csvErrors.push(`שגיאה במחיקת ${id}: ${e.message}`);
    }
    csvProgress++;
    updateProgressUI();
  }

  // Clear local cache
  businesses = [];

  // ── PHASE 2: Import new rows ──
  csvPhase = "מייבא שורות חדשות...";
  updateProgressUI();

  for (let i = 0; i < csvRows.length; i++) {
    const row = csvRows[i];
    const get = (key) => {
      const idx = csvColMap[key] ?? -1;
      return idx >= 0 ? (row[idx] || "").trim() : "";
    };

    const regName    = get("registrar_name");
    const permitName = get("permit_name");

    if (!regName && !permitName) {
      csvErrors.push(`שורה ${i+2}: חסר שם — דולגה`);
      csvProgress++;
      updateProgressUI();
      continue;
    }

    // ── Duplicate ח.פ. check within import ──
    const chpVal = get("chp_number");
    if (chpVal && businesses.some(b => (b.chp_number||"").trim() === chpVal)) {
      csvErrors.push(`שורה ${i+2} (${regName||permitName}): ${chpLbl(chpVal)} ${chpVal} כבר קיים — דולגה`);
      csvProgress++;
      updateProgressUI();
      continue;
    }

    const payload = {
      id:             uid(),
      chp_number:     get("chp_number"),
      registrar_name: regName,
      permit_name:    permitName,
      category:       get("category"),
      region:         get("region"),
      visibility:     get("visibility"),
      agch_approved:  normalizeAgch(get("agch_approved")),
      tase_has_agch:  get("tase_has_agch"),
      biz_type:       get("biz_type"),
      notes:          get("notes"),
      notes_scope:    get("notes") ? "companies" : "",
      has_details:    0,
    };

    try {
      await apiFetch("/businesses", { method: "POST", body: JSON.stringify(payload) });
      businesses = [...businesses, payload];
      csvImported++;
    } catch(e) {
      csvErrors.push(`שורה ${i+2} (${regName||permitName}): ${e.message}`);
    }

    csvProgress++;
    updateProgressUI();
  }

  csvStep = "done";
  render();
}

function updateProgressUI() {
  const fill  = document.querySelector(".progress-bar-fill");
  const label = document.querySelector(".progress-label span:last-child");
  const phase = document.querySelector(".progress-phase");
  const pct   = csvTotal > 0 ? Math.round((csvProgress / csvTotal) * 100) : 0;
  if (fill)  fill.style.width = pct + "%";
  if (label) label.textContent = `${csvProgress} / ${csvTotal}`;
  if (phase) phase.textContent = pct + "% הושלם";
  const phaseEl = document.querySelector(".progress-label span:first-child");
  if (phaseEl) phaseEl.textContent = csvPhase;
}

function finishImport() {
  showStatus(`✅ יובאו ${csvImported} עסקים בהצלחה`);
  setView("admin");
}

// ─────────────────────────────────────────────
//  CSV EXPORT
// ─────────────────────────────────────────────
function exportCsv(allRows = false) {
  const rows = allRows ? businesses : filtered();
  if (!rows.length) { showStatus("אין נתונים לייצוא"); return; }

  const HEADERS = [
    "מספר תאגיד",
    "שם חברה / שותפות רשמי",
    "היתר עסקה על שם",
    "עיסוק",
    "סוג עסק",
    "היתר עסקה חברה",
    "היתר עסקה אגח",
    "אג\"ח בורסה",
    "הערות",
  ];

  const csvCell = (v) => {
    const s = (v || "").toString().replace(/"/g, '""');
    return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s}"` : s;
  };

  const lines = [
    HEADERS.map(csvCell).join(","),
    ...rows.map(b => [
      b.chp_number     || "",
      b.registrar_name || "",
      b.permit_name    || "",
      b.category       || "",
      b.biz_type       || "",
      b.visibility     || "",
      b.agch_approved === "כן" ? "מאושר" : b.agch_approved === "לא" ? "לא מאושר" : b.agch_approved === BOND_PICK ? "אג\"ח מסוימים" : "",
      b.tase_has_agch  || "",
      b.notes          || "",
    ].map(csvCell).join(",")),
  ];

  // UTF-8 BOM for Hebrew Excel compatibility
  const bom     = "\uFEFF";
  const content = bom + lines.join("\r\n");
  const blob    = new Blob([content], { type: "text/csv;charset=utf-8;" });
  const url     = URL.createObjectURL(blob);
  const a       = document.createElement("a");
  const date    = new Date().toISOString().slice(0,10);
  a.href        = url;
  a.download    = `עסקים-מורשים-${date}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showStatus(`✅ יוצאו ${rows.length} שורות`);
}

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function uniqueCats() {
  return [...new Set(businesses.map(b=>b.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"he"));
}

function setSort(col) {
  if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
  else { sortCol = col; sortDir = "asc"; }
  render();
}

function clearFilters() {
  search = ""; filterCat = ""; filterRegion = "";
  filterBizType = ""; filterVis = ""; filterAgch = ""; filterDocs = "";
  render();
}

function agchSortKey(b) {
  if ((b.tase_has_agch||"") !== "יש") return 0;
  if ((b.agch_approved||"") === "כן")  return 2;
  if ((b.agch_approved||"") === "לא")  return 1;
  return 1;
}

// רישומים כפולים לאותה חברה (אותו ח.פ., למשל "מסלול הלכה"): שורה ראשית, והשאר כתתי-שורות מיד אחריה
function groupSubs(list) {
  const norm = s => String(s || "").replace(/["'׳״.\-,()]/g, " ").replace(/\s+/g, " ").replace(/\bבע ?מ\b/g, "").trim();
  const by = new Map();
  for (const b of businesses) { const k = String(b.chp_number || "").trim(); if (!k) continue; if (!by.has(k)) by.set(k, []); by.get(k).push(b); }
  const parentOf = new Map();
  for (const g of by.values()) { if (g.length < 2) continue; const main = g.find(b => norm(b.permit_name) === norm(b.registrar_name)) || g[0]; for (const b of g) if (b !== main) parentOf.set(b.id, main.id); }
  const have = new Set(list.map(b => b.id)), kids = new Map(), out = [];
  for (const b of list) if (parentOf.has(b.id) && have.has(parentOf.get(b.id))) { const p = parentOf.get(b.id); if (!kids.has(p)) kids.set(p, []); kids.get(p).push(b); }
  for (const b of list) { if (parentOf.has(b.id) && have.has(parentOf.get(b.id))) continue; out.push(b); for (const k of kids.get(b.id) || []) out.push({ ...k, _isSub: true }); }
  return out;
}
function filteredAndSorted() {
  const q = search.trim().toLowerCase();

  // Filter
  const textHit = b => displayName(b).toLowerCase().includes(q)
        || (b.permit_name ||"").toLowerCase().includes(q)
        || (b.registrar_name ||"").toLowerCase().includes(q)
        || (b.category   ||"").toLowerCase().includes(q)
        || (b.region     ||"").toLowerCase().includes(q)
        || (b.chp_number ||"").toLowerCase().includes(q)
        || (b.notes      ||"").toLowerCase().includes(q)
        || (b.biz_type   ||"").toLowerCase().includes(q);
  // חיפוש גם בשמות תת-השורות (כמה רישומים לאותו ח.פ., למשל "מסלול הלכה"): התאמה באחד מהם מציגה את כל הקבוצה, עם השורה הראשית
  const hitChp = new Set(q ? businesses.filter(textHit).map(b => String(b.chp_number || "").trim()).filter(Boolean) : []);
  let rows = businesses.filter(b => {
    if (q && !textHit(b) && !hitChp.has(String(b.chp_number || "").trim())) return false;
    if (filterCat     && b.category    !== filterCat)     return false;
    if (filterRegion  && b.region      !== filterRegion)  return false;
    if (filterBizType && b.biz_type    !== filterBizType) return false;
    if (filterVis     && b.visibility  !== filterVis)     return false;
    if (filterDocs && window.PD && PD.docStatus && PD.docStatus(b) !== filterDocs) return false;
    if (filterAgch) {
      const has  = (b.tase_has_agch||"").trim();
      const appr = (b.agch_approved||"").trim();
      if (filterAgch === "אין"      && has === "יש")                 return false;
      if (filterAgch === "אין"      && has !== "יש")                 {} // keep
      else if (filterAgch === "מאושר"   && !(has === "יש" && appr === "כן")) return false;
      else if (filterAgch === "לא מאושר" && !(has === "יש" && appr === "לא")) return false;
      else if (filterAgch === "יש"      && has !== "יש")             return false;
    }
    return true;
  });

  // Sort
  const he = (a, b) => (a||"").localeCompare(b||"", "he");
  rows.sort((a, b) => {
    let cmp = 0;
    switch (sortCol) {
      case "num":        cmp = 0; break;
      case "chp":        cmp = (a.chp_number||"").localeCompare(b.chp_number||""); break;
      case "name":       cmp = he(displayName(a), displayName(b)); break;
      case "category":   cmp = he(a.category,   b.category);   break;
      case "region":     cmp = he(a.region,      b.region);     break;
      case "biz_type":   cmp = he(a.biz_type,    b.biz_type);   break;
      case "visibility": cmp = he(a.visibility,  b.visibility); break;
      case "agch":       cmp = agchSortKey(a) - agchSortKey(b); break;
      case "notes":      cmp = he(a.notes,       b.notes);      break;
    }
    return sortDir === "asc" ? cmp : -cmp;
  });

  return rows;
}

// keep old filtered() for CSV export
function filtered() { return filteredAndSorted(); }

function showStatus(msg) {
  const el = document.getElementById("status-bar");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), String(msg).length > 60 ? 10000 : 2500);      // הודעה ארוכה נשארת זמן מספיק לקריאה
}
