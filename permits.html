<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#274d5b">
<link rel="icon" type="image/png" href="/favicon.png">
<title>רשימת שטרות היתר עסקה</title>
<style>
  /* רשימת שטרות היתר עסקה לפי קטגוריות ("קטגוריה עבור רשימת השטרות" בניהול). לכל חברה: צפייה והורדה של ההיתר הכללי, ו"יש פרטי" בצד עם צפייה והורדה. */
  @font-face{font-family:'Alef';font-weight:400;font-display:swap;src:url(fonts/alef/alef-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
  @font-face{font-family:'Alef';font-weight:700;font-display:swap;src:url(fonts/alef/alef-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#274d5b;--accent:#2aada1;--accent-dark:#1e8f85;--accent-bg:#e9f6f5;--accent-border:#b9e3de;--border:#dfe7e8;--text:#3b3d3d;--muted:#6a7c82}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Alef','Heebo','Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f7f7;color:var(--text);font-size:17px;line-height:1.5;padding:0 .8rem 2rem}
  .wrap{max-width:1000px;margin:0 auto}
  .top{position:sticky;top:0;z-index:10;background:#f4f7f7;margin:0 -.8rem;padding:.5rem .8rem .5rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  h1{font-size:22px;color:var(--navy);margin:.2rem 0 .5rem}
  .bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  .bar input,.bar select{font:inherit;font-size:16px;padding:.45rem .7rem;border:2px solid var(--accent-border);border-radius:10px;background:#fff;color:var(--text);min-height:44px}
  .bar input{flex:1;min-width:180px}.bar select{min-width:200px}
  .cnt{font-size:14px;color:var(--muted);margin-inline-start:auto}
  .chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
  .chip{font:inherit;font-size:15px;font-weight:700;color:var(--navy);background:#fff;border:2px solid var(--accent-border);border-radius:999px;padding:.2rem .8rem;cursor:pointer}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.chip small{font-weight:400;opacity:.75;margin-inline-start:.3rem}
  .cat{margin:1.1rem 0 .3rem;font-size:19px;font-weight:700;color:var(--navy);border-bottom:2px solid var(--accent-border);padding-bottom:.2rem}
  .cat small{font-size:14px;color:var(--muted);font-weight:400;margin-inline-start:.4rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.5rem}
  .row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:#fff;border:1px solid var(--border);border-radius:10px;padding:.45rem .7rem}
  .nm{min-width:0;font-weight:700;overflow-wrap:anywhere}.nm .p{display:block;font-size:13px;font-weight:400;color:var(--muted)}
  .docs{display:grid;grid-template-columns:76px 76px;gap:0 10px;flex:none;align-items:start}
  .col{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:1px}
  .col.side{position:relative}.col.side::before{content:"";position:absolute;inset-block:0;inset-inline-start:-6px;border-inline-start:1px solid var(--border)}
  .tag{font-size:12px;font-weight:700;color:var(--navy);line-height:16px;height:16px}
  .pair{display:flex;gap:5px}
  a.ic{display:inline-flex;width:34px;height:32px;align-items:center;justify-content:center;border:1px solid var(--accent-border);border-radius:6px;background:#fff;color:var(--accent-dark);text-decoration:none}
  a.ic:hover{background:var(--accent-bg)}
  .none{color:#a8b3b6;font-size:15px;text-align:center}
  .state{padding:2rem;text-align:center;color:var(--muted)}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  body.embed .top{position:static;box-shadow:none}body.embed h1{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>רשימת שטרות היתר עסקה</h1>
    <div class="bar">
      <input type="search" id="q" placeholder="חיפוש חברה…" autocomplete="off" aria-label="חיפוש חברה">
      <select id="cat" aria-label="בחירת קטגוריה"><option value="">כל הקטגוריות</option></select>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="list"><div class="state">טוען…</div></main>
</div>
<script>
const API_BASE = "https://harav-levin.pages.dev";
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ICON_VIEW = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_DL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>';
if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
const INACTIVE = /^(מחוסל|חיסול|מחוק|נגרע)/;
let ROWS = [], CAT = "", Q = "";

// צפייה והורדה כ-JSON (base64): רשתות עם סינון תוכן חוסמות הורדת PDF ישירה. אם נכשל - נופלים לקישור הישיר
async function fetchPdf(id) {
  const r = await fetch(`${API_BASE}/api/permit-docs-public/${encodeURIComponent(id)}?enc=b64`);
  if (!r.ok) throw new Error(r.status);
  const j = await r.json(), bin = atob(j.data), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return { blob: new Blob([u8], { type: "application/pdf" }), name: j.name || "permit.pdf" };
}
async function pdView(ev, id) {
  ev.preventDefault();
  const direct = `${API_BASE}/api/permit-docs-public/${encodeURIComponent(id)}`, w = window.open("", "_blank");
  if (!w) { location.href = direct; return false; }
  try { w.document.title = "טוען…"; w.document.body.innerHTML = '<p style="font:16px sans-serif;text-align:center;margin-top:30vh" dir="rtl">טוען את המסמך…</p>'; } catch (e) {}
  try { w.location.href = URL.createObjectURL((await fetchPdf(id)).blob); } catch (e) { w.location.href = direct; }
  return false;
}
async function pdDownload(ev, id) {
  ev.preventDefault();
  const a = ev.currentTarget; a.style.opacity = ".5"; a.style.pointerEvents = "none";
  try {
    const f = await fetchPdf(id), url = URL.createObjectURL(f.blob), d = document.createElement("a");
    d.href = url; d.download = f.name; document.body.appendChild(d); d.click(); d.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { window.open(`${API_BASE}/api/permit-docs-public/${encodeURIComponent(id)}?dl=1`, "_blank"); }
  finally { a.style.opacity = ""; a.style.pointerEvents = ""; }
  return false;
}
const lnk = (id, ic, label, dl) => `<a class="ic" href="${API_BASE}/api/permit-docs-public/${esc(id)}${dl ? "?dl=1" : ""}" target="_blank" rel="noopener" title="${label}" aria-label="${label}" onclick="return ${dl ? "pdDownload" : "pdView"}(event,'${esc(id)}')"${dl ? " download" : ""}>${ic}</a>`;
const pair = id => `<div class="pair">${lnk(id, ICON_VIEW, "צפייה")}${lnk(id, ICON_DL, "הורדה", 1)}</div>`;

function nameOf(b) {
  const r = (b.registrar_name || "").trim(), p = (b.permit_name || "").trim();
  return r && p && r !== p ? { main: r, sub: p } : { main: r || p || "—", sub: "" };
}
function draw() {
  const q = Q.trim().toLowerCase(), cats = new Map();
  for (const r of ROWS) cats.set(r.cat, (cats.get(r.cat) || 0) + 1);
  const names = [...cats.keys()].sort((a, b) => a.localeCompare(b, "he"));
  const sel = document.getElementById("cat");
  if (sel.options.length !== names.length + 1) sel.innerHTML = '<option value="">כל הקטגוריות</option>' + names.map(c => `<option value="${esc(c)}">${esc(c)} (${cats.get(c)})</option>`).join("");
  sel.value = CAT;
  document.getElementById("chips").innerHTML = names.map(c => `<button class="chip${c === CAT ? " on" : ""}" data-c="${esc(c)}">${esc(c)}<small>${cats.get(c)}</small></button>`).join("");
  const rows = ROWS.filter(r => (!CAT || r.cat === CAT) && (!q || r.hay.includes(q)));
  document.getElementById("cnt").textContent = rows.length + " חברות";
  const by = new Map();
  for (const r of rows) { if (!by.has(r.cat)) by.set(r.cat, []); by.get(r.cat).push(r); }
  const out = [...by.keys()].sort((a, b) => a.localeCompare(b, "he")).map(c => `<h2 class="cat">${esc(c)}<small>${by.get(c).length}</small></h2><div class="grid">${by.get(c).map(r => {
    const n = nameOf(r.b), hasP = r.priv || r.b.visibility === "פרטי" || r.b.visibility === "רק פרטי";
    const gen = r.gen ? pair(r.gen) : '<div class="none">—</div>';
    const side = hasP ? `<div class="col side"><div class="tag">יש פרטי</div>${r.priv ? pair(r.priv) : ""}</div>` : "";
    return `<div class="row"><div class="nm">${esc(n.main)}${n.sub ? `<span class="p">${esc(n.sub)}</span>` : ""}</div><div class="docs"><div class="col">${hasP ? '<div class="tag"></div>' : ""}${gen}</div>${side}</div></div>`;
  }).join("")}</div>`).join("");
  document.getElementById("list").innerHTML = out || '<div class="state">לא נמצאו חברות</div>';
}
document.getElementById("q").addEventListener("input", e => { Q = e.target.value; draw(); });
document.getElementById("cat").addEventListener("change", e => { CAT = e.target.value; location.hash = CAT ? "cat=" + encodeURIComponent(CAT) : ""; draw(); });
document.getElementById("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; CAT = CAT === b.dataset.c ? "" : b.dataset.c; location.hash = CAT ? "cat=" + encodeURIComponent(CAT) : ""; draw(); });

(async () => {
  try {
    const [lr, dr] = await Promise.all([
      fetch(`${API_BASE}/api/lists?type=companies-all`).then(r => r.json()),
      fetch(`${API_BASE}/api/permit-docs-public`).then(r => r.json()).catch(() => ({ links: [] })),
    ]);
    const byChp = new Map(), byName = new Map();
    for (const l of dr.links || []) { if (l.chp) byChp.set(String(l.chp).trim(), l); else byName.set(l.name, l); }
    ROWS = (lr.rows || []).filter(b => (b.permits_category || "").trim() && !INACTIVE.test(b.registry_status || "") && (b.permit_name || b.registrar_name) !== "מסלול הלכה").flatMap(b => {
      const l = byChp.get(String(b.chp_number || "").trim()) || byName.get(b.permit_name) || {}, n = nameOf(b);
      return b.permits_category.split("|").map(x => x.trim()).filter(Boolean).map(cat =>          // עסק עם כמה קטגוריות מופיע בכל אחת מהן
        ({ b, cat, gen: l.general || "", priv: l.private || "", hay: `${n.main} ${n.sub} ${b.chp_number || ""}`.toLowerCase() }));
    });
    const m = /cat=([^&]+)/.exec(location.hash); if (m) CAT = decodeURIComponent(m[1]);
    draw();
  } catch (e) { document.getElementById("list").innerHTML = '<div class="state">הרשימה לא זמינה כרגע. נסו שוב מאוחר יותר.</div>'; }
})();
</script>
</body>
</html>
