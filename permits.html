<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#274d5b">
<link rel="icon" type="image/png" href="/favicon.png">
<title>שטרות היתר עיסקא</title>
<style>
  /* רשימת שטרות היתר עסקה לפי קטגוריות ("קטגוריה עבור רשימת השטרות" בניהול). לכל חברה: צפייה והורדה של ההיתר הכללי, ו"יש פרטי" בצד עם צפייה והורדה. */
  @font-face{font-family:'Alef';font-weight:400;font-display:swap;src:url(fonts/alef/alef-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
  @font-face{font-family:'Alef';font-weight:700;font-display:swap;src:url(fonts/alef/alef-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#274d5b;--accent:#2aada1;--accent-dark:#1e8f85;--accent-bg:#e9f6f5;--accent-border:#b9e3de;--border:#dfe7e8;--text:#3b3d3d;--muted:#6a7c82}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Alef','Heebo','Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f7f7;color:var(--text);font-size:17px;line-height:1.5;padding:0 .8rem 2rem}
  .wrap{max-width:1100px;margin:0 auto}
  .hero{background:linear-gradient(135deg,#1d3b46,#274d5b 60%,#35616f);color:#fff;text-align:center;margin:0 -.8rem 1.2rem;padding:1.6rem .8rem 1.3rem}
  .hero h1{font-size:30px;font-weight:700;margin:0}.hero .bc{font-size:14px;opacity:.8;margin-top:.3rem}
  .stick{position:sticky;top:0;z-index:20;background:#f4f7f7;margin:0 -.8rem 1rem;padding:.5rem .8rem .4rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .stick .bar{max-width:760px;margin:0 auto}
  .curcat{font-size:21px;font-weight:700;color:var(--navy);text-align:center;margin-top:.45rem;padding-top:.35rem;border-top:2px solid var(--accent-border)}
  .tabs{display:flex;gap:0;margin:0 0 .55rem;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .tabs button{flex:1;min-width:150px;padding:.7rem 1rem;font-size:18px;font-weight:700;font-family:inherit;background:transparent;color:var(--navy);border:none;border-top:3px solid transparent;border-radius:0;cursor:pointer;transition:.15s}
  .tabs button:hover{color:var(--accent-dark)}
  .tabs button.on{color:var(--accent-dark);border-top-color:var(--accent);background:var(--accent-bg)}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:2rem;align-items:start}
  .side{position:sticky;top:calc(var(--sh,120px) + .6rem)}
  .side button{display:flex;width:100%;justify-content:space-between;align-items:center;font:inherit;font-size:calc(19px*var(--sf,1));line-height:1.2;color:var(--navy);background:none;border:0;border-bottom:1px solid var(--border);padding:calc(.26rem*var(--sf,1)) .4rem;cursor:pointer;text-align:start}
  .side button::after{content:"\2039";font-size:20px;color:var(--muted);order:2;margin-inline-start:.4rem}
  .side button small{color:var(--muted);font-size:calc(13px*var(--sf,1));margin-inline-start:auto;padding-inline:.5rem}
  .side button:hover{background:#eef4f5}.side button.on{font-weight:700;color:var(--accent-dark);border-bottom-color:var(--accent)}
  .bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .bar input{flex:1;min-width:180px;font:inherit;font-size:16px;padding:.5rem .8rem;border:2px solid var(--accent-border);border-radius:10px;background:#fff;color:var(--text);min-height:44px}
  .cnt{font-size:14px;color:var(--muted)}
  .cat{margin:1.6rem 0 .4rem;font-size:22px;font-weight:700;color:var(--navy);text-align:center;border-bottom:2px solid var(--accent-border);padding-bottom:.3rem}
  .cat small{font-size:14px;color:var(--muted);font-weight:400;margin-inline-start:.4rem}
  .items{column-count:2;column-gap:2.2rem}
  .it{display:flex;justify-content:space-between;align-items:center;gap:.8rem;break-inside:avoid;background:#fff;border:1px solid var(--border);border-radius:12px;padding:.55rem .8rem;margin-bottom:.6rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .nm{flex:1 1 0;min-width:0;font-size:20px;color:#2f6270;overflow-wrap:anywhere;text-align:start}.nm .p{display:block;font-size:14px;color:var(--muted)}
  .act{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:flex-end;gap:.5rem .9rem}
  .grp{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--navy);font-weight:700;width:82px}
  .pair{display:flex;gap:5px}
  a.ic{display:inline-flex;width:34px;height:32px;align-items:center;justify-content:center;border:1px solid var(--accent-border);border-radius:6px;background:#fff;color:var(--accent-dark);text-decoration:none}
  a.ic:hover{background:var(--accent-bg)}
  .none{color:#a8b3b6;font-size:14px;font-weight:400}
  .state{padding:2rem;text-align:center;color:var(--muted)}
  @media(max-width:760px){.items{column-count:1}.layout{grid-template-columns:1fr}.side{position:static;display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem}.side button{width:auto;white-space:nowrap;border:2px solid var(--accent-border);border-radius:999px;padding:.25rem .8rem}.side button::after{display:none}.side button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.hero h1{font-size:24px}}
  body.embed .hero{display:none}
  body.embed .wrap{max-width:none}          /* בהטמעה הרוחב נקבע בעמוד האב (permits-embed.js מרחיב את ה-iframe מעבר לעמודת התוכן) */
  html.embed,body.embed{background:#fff}body.embed{padding:0 .6rem 1rem}body.embed .stick{background:#fff;margin:0 -.6rem .8rem;padding:.4rem .6rem .3rem}
  .stick{scroll-margin-top:0}
  /* ?auto=1 (permits-embed.js): ה-iframe באורך התוכן, בלי גלילה פנימית. הסרגל העליון (לשוניות, חיפוש, קטגוריה) נבנה בעמוד האב ונצמד שם (position:fixed), כמו ברשימת החברות;
     כאן הוא מוסתר, והתפריט בצד נגלל עם הדף (במובייל מוסתר: הבחירה בסרגל) */
  html.auto{overflow:hidden}
  body.auto .stick{display:none}
  body.auto .side{position:relative;top:auto}
  body.auto.ext .side{visibility:hidden}          /* בהטמעה רחבה התפריט האמיתי נבנה בעמוד האב (position:fixed) - כאן נשמר רק המקום */
  @media(max-width:760px){body.auto .side{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><h1>שטרות היתר עיסקא</h1><div class="bc" id="bc">דף הבית « שטרות היתר עיסקא</div></header>
  <div class="stick" id="stick">
    <div class="bar"><input type="search" id="q" placeholder="חיפוש חברה…" autocomplete="off" aria-label="חיפוש חברה"><span class="cnt" id="cnt"></span></div>
    <h2 class="curcat" id="curcat" hidden></h2>
  </div>
  <div class="layout">
    <nav class="side" id="side" aria-label="קטגוריות"></nav>
    <main>
      <div id="list"><div class="state">טוען…</div></div>
    </main>
  </div>
</div>
<script>
const API_BASE = "https://harav-levin.pages.dev";
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ICON_VIEW = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_DL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>';
if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed"), document.documentElement.classList.add("embed");
const AUTO = window.parent !== window && new URLSearchParams(location.search).has("auto");
if (AUTO) document.body.classList.add("auto"), document.documentElement.classList.add("auto");
let CAT = "", Q = "";

// צפייה והורדה כ-JSON (base64): רשתות עם סינון תוכן חוסמות הורדת PDF ישירה. אם נכשל - נופלים לקישור הישיר
async function fetchPdf(id) {
  const r = await fetch(`${API_BASE}/api/permit-docs-public/${encodeURIComponent(id)}?enc=b64`);
  if (!r.ok) throw new Error(r.status);
  const j = await r.json(), bin = atob(j.data), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return { blob: new Blob([u8], { type: "application/pdf" }), name: j.name || "permit.pdf" };
}
async function pdView(ev, id) {
  ev.preventDefault();
  const direct = `${API_BASE}/api/permit-docs-public/${encodeURIComponent(id)}`, w = window.open("", "_blank");
  if (!w) { location.href = direct; return false; }
  try { w.document.title = "טוען…"; w.document.body.innerHTML = '<p style="font:16px sans-serif;text-align:center;margin-top:30vh" dir="rtl">טוען את המסמך…</p>'; } catch (e) {}
  try { w.location.href = URL.createObjectURL((await fetchPdf(id)).blob); } catch (e) { w.location.href = direct; }
  return false;
}
async function pdDownload(ev, id) {
  ev.preventDefault();
  const a = ev.currentTarget; a.style.opacity = ".5"; a.style.pointerEvents = "none";
  try {
    const f = await fetchPdf(id), url = URL.createObjectURL(f.blob), d = document.createElement("a");
    d.href = url; d.download = f.name; document.body.appendChild(d); d.click(); d.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { window.open(`${API_BASE}/api/permit-docs-public/${encodeURIComponent(id)}?dl=1`, "_blank"); }
  finally { a.style.opacity = ""; a.style.pointerEvents = ""; }
  return false;
}
const lnk = (id, ic, label, dl) => `<a class="ic" href="${API_BASE}/api/permit-docs-public/${esc(id)}${dl ? "?dl=1" : ""}" target="_blank" rel="noopener" title="${label}" aria-label="${label}" onclick="return ${dl ? "pdDownload" : "pdView"}(event,'${esc(id)}')"${dl ? " download" : ""}>${ic}</a>`;
const pair = id => `<div class="pair">${lnk(id, ICON_VIEW, "צפייה")}${lnk(id, ICON_DL, "הורדה", 1)}</div>`;

// כמו display.html: שמות החברות והשיוך ללשונית (פרטי / כללי) מגיעים מרשימות /api/lists, והמסמכים לפי השיוך שבניהול
const TABS = {};          // רשימה אחת (כללי + פרטי): אין לשוניות
const LISTS = {};
let LINKS = null, TAB = "all";
const qnorm = s => String(s || "").replace(/["'׳״]/g, "");
async function loadTab(level) {
  if (LISTS[level]) return LISTS[level];
  if (!LINKS) LINKS = await fetch(`${API_BASE}/api/permit-docs-public`).then(r => r.json()).then(d => d.links || []).catch(() => []);
  const byChp = new Map(), byName = new Map();
  const subs = new Map();          // תת-שורה (אותו ח.פ., למשל "מסלול הלכה"): רק המסמכים שלה, לא של הראשית
  for (const l of LINKS) { if (l.sub) { const k = String(l.chp || "").trim(); if (!subs.has(k)) subs.set(k, []); subs.get(k).push(l); } else if (l.chp) byChp.set(String(l.chp).trim(), l); else byName.set(l.name, l); }
  const linkOf = (chp, name) => { const k = String(chp || "").trim(), n = String(name || "").replace(/\s+/g, " ").trim(); return (subs.get(k) || []).find(l => n === l.sub || n.endsWith(`(${l.sub})`)) || byChp.get(k) || byName.get(name); };
  const lr = await fetch(`${API_BASE}/api/lists?type=companies-${level}`).then(r => r.json());
  const rows = [];
  for (const b of lr.rows || []) {
    let cats = String(b.permits_category || "").split("|").map(x => x.trim()).filter(Boolean).filter(x => x !== "שונות");          // בלי קטגוריה = "שונות"; עם קטגוריה ספציפית - לא ב"שונות"
    if (!cats.length) cats = ["שונות"];
    if ((b.permit_name || b._registrar) === "מסלול הלכה") continue;
    const l = linkOf(b.chp_number, b.permit_name) || {};
    const gen = level === "general";
    const row = { key: String(b.chp_number || "").trim() || b.permit_name || b._registrar || "", name: b.permit_name || b._registrar || "—", doc: l[level] || "", priv: gen ? (l.private || "") : "", hasPriv: gen && (b.has_private_permit === "כן" || !!l.private), specials: l.specials || [], hay: `${b.permit_name || ""} ${b._registrar || ""} ${b.chp_number || ""}`.toLowerCase() };
    if (!row.doc && !row.priv && !row.specials.length) continue;          // רק חברה עם שטר משויך
    for (const cat of cats) rows.push({ ...row, cat });
  }
  return LISTS[level] = rows;
}
// רשימה אחת: בסיס = רשימת הכללי (עם הפרטי שלה אם יש), ובנוסף חברות שיש להן רק שטר פרטי; מי שיש לו רק סוג אחד מקבל כיתוב "כללי" / "פרטי"
async function loadAll() {
  if (LISTS.all) return LISTS.all;
  const [gen, prv] = await Promise.all([loadTab("general"), loadTab("private")]);
  const rows = gen.map(r => ({ ...r, gdoc: r.doc, pdoc: r.priv }));
  const have = new Set(rows.map(r => r.key + "|" + r.cat));
  for (const r of prv) if (!have.has(r.key + "|" + r.cat)) rows.push({ ...r, gdoc: "", pdoc: r.doc, hasPriv: false });
  return LISTS.all = rows;
}
async function draw() {
  document.getElementById("bc").textContent = "דף הבית « שטרות היתר עיסקא";
  const list = document.getElementById("list");
  let ROWS;
  try { ROWS = await loadAll(); } catch (e) { list.innerHTML = '<div class="state">הרשימה לא זמינה כרגע. נסו שוב מאוחר יותר.</div>'; return; }
  const q = Q.trim().toLowerCase(), cats = new Map();
  for (const r of ROWS) cats.set(r.cat, (cats.get(r.cat) || 0) + 1);
  if (CAT && !cats.has(CAT)) CAT = "";
  const names = [...cats.keys()].sort((a, b) => a.localeCompare(b, "he"));
  document.getElementById("side").innerHTML = `<button data-c=""${CAT ? "" : ' class="on"'}>כל הקטגוריות<small>${ROWS.length}</small></button>` + names.map(c => `<button data-c="${esc(c)}"${c === CAT ? ' class="on"' : ""}>${esc(c)}<small>${cats.get(c)}</small></button>`).join("");
  fitKey = ""; placeSide();
  const qn = qnorm(q), words = qn.split(/\s+/).filter(Boolean);
  // חיפוש מתחילת מילה בלבד (לא באמצע מילה), מאות אחת: קודם מי ששמו מתחיל במה שהוקלד (המילה הראשונה), אחר כך מי שמילה אחרת בשמו מתחילה בכך, ואחר כך כל השאר
  const score = r => { if (!qn) return 0; const n = qnorm(r.name).toLowerCase(); if (n.startsWith(qn)) return 0; const w = n.split(/[\s\-–,()]+/); return words.every(t => w.some(x => x.startsWith(t))) ? 1 : 2; };
  const rows = ROWS.filter(r => (!CAT || r.cat === CAT) && (!qn || words.every(t => (r.hw || (r.hw = qnorm(r.hay).split(/[\s\-–,()\/]+/).filter(Boolean))).some(x => x.startsWith(t))))).map(r => ({ ...r, sc: score(r) }));
  document.getElementById("cnt").textContent = rows.length + " חברות";
  const cc = document.getElementById("curcat"); cc.hidden = !CAT; cc.textContent = CAT;          // כותרת הקטגוריה הנבחרת: קבועה בראש הדף
  const by = new Map();
  for (const r of rows) { if (!by.has(r.cat)) by.set(r.cat, []); by.get(r.cat).push(r); }
  const bestSc = c => Math.min(...by.get(c).map(r => r.sc));
  const out = [...by.keys()].sort((a, b) => (qn ? bestSc(a) - bestSc(b) : 0) || a.localeCompare(b, "he")).map(c => `${CAT ? "" : `<h2 class="cat">${esc(c)}<small>${by.get(c).length}</small></h2>`}<div class="items">${by.get(c).sort((x, y) => x.sc - y.sc || qnorm(x.name).localeCompare(qnorm(y.name), "he")).map(r => {
    const main = r.gdoc ? `<div class="grp">כללי ${pair(r.gdoc)}</div>` : '<div class="grp"></div>';          // תמיד עם כיתוב: כללי / פרטי
    const side = r.pdoc ? `<div class="grp">פרטי ${pair(r.pdoc)}</div>` : r.hasPriv ? '<div class="grp"><span class="none">יש פרטי</span></div>' : '<div class="grp"></div>';
    const sp = r.specials.map(x => `<div class="grp"><span>${esc(x.title)}</span> ${pair(x.id)}</div>`).join("");
    return `<div class="it"><div class="nm">${esc(r.name)}</div><div class="act">${main}${side}${sp}${main || side || sp ? "" : '<div class="grp none">—</div>'}</div></div>`;
  }).join("")}</div>`).join("");
  list.innerHTML = out || '<div class="state">לא נמצאו חברות</div>';
  if (AUTO) window.parent.postMessage({ source: "harav-levin", type: "permits-spec", tab: TAB, tabs: TABS, cat: CAT, cats: names.map(c => [c, cats.get(c)]), total: ROWS.length, count: rows.length }, "*");
}
function setHash() { location.hash = (CAT ? "cat=" + encodeURIComponent(CAT) : ""); }
document.getElementById("q").addEventListener("input", e => { Q = e.target.value; draw(); });
document.getElementById("side").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; CAT = b.dataset.c === CAT ? "" : b.dataset.c; setHash(); draw(); });
// ── הטמעה באתר (permits-embed.js): דיווח גובה לעמוד האב, ושליטה מהסרגל הקבוע שבעמוד האב (לשונית / חיפוש / קטגוריה) ──
if (AUTO) {
  const docH = () => Math.ceil(document.documentElement.getBoundingClientRect().height);
  const geo = () => { const sd = document.getElementById("side"), lay = document.querySelector(".layout"); if (!sd || !lay) return null; const r = sd.getBoundingClientRect(); return { t: sd.offsetTop, l: Math.round(r.left), w: Math.round(r.width), h: lay.offsetHeight }; };
  const report = () => window.parent.postMessage({ source: "harav-levin", type: "resize", height: docH(), side: geo() }, "*");
  new ResizeObserver(report).observe(document.body);
  addEventListener("message", e => {
    const d = e.data; if (!d || d.source !== "harav-parent") return;
    if (d.type === "setCat") { CAT = String(d.value || ""); setHash(); draw(); }
    else if (d.type === "setQ") { Q = String(d.value || ""); draw(); }
    else if (d.type === "ext") { document.body.classList.toggle("ext", !!d.on); report(); }
  });
  report();
}
// התפריט בצד: בתצוגה עצמאית - sticky; אם הרשימה ארוכה מהמסך - מקטינים מעט את הפונט והריווח (--sf). בהטמעה (auto) התפריט נבנה בעמוד האב (permits-embed.js)
let fitKey = "";
function fitSide(avail) {
  const s = document.getElementById("side"); if (!s || avail < 120) return;
  const key = Math.round(avail) + "|" + s.children.length; if (key === fitKey) return; fitKey = key;
  s.style.maxHeight = ""; s.style.setProperty("--sf", "1");
  const H = s.offsetHeight, f = H > avail ? Math.max(.75, avail / H) : 1;
  s.style.setProperty("--sf", f.toFixed(3)); s.style.maxHeight = Math.round(avail) + "px"; s.style.overflowY = "auto";
}
function placeSide() { if (!document.body.classList.contains("auto")) fitSide(innerHeight - (document.getElementById("stick").offsetHeight || 0) - 24); }
addEventListener("resize", () => { fitKey = ""; placeSide(); });
{
  const sh = () => document.documentElement.style.setProperty("--sh", document.getElementById("stick").offsetHeight + "px");
  sh(); addEventListener("resize", sh); setTimeout(placeSide, 0); if (window.ResizeObserver) new ResizeObserver(sh).observe(document.getElementById("stick"));
}
{
  const m = /cat=([^&]+)/.exec(location.hash);
  if (m) CAT = decodeURIComponent(m[1]);
  draw();
}
</script>
</body>
</html>
