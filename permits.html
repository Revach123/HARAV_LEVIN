<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#274d5b">
<link rel="icon" type="image/png" href="/favicon.png">
<title>רשימת שטרות היתר עסקה</title>
<style>
  /* רשימת שטרות היתר עסקה לפי קטגוריות ("קטגוריה עבור רשימת השטרות" בניהול). לכל חברה: צפייה והורדה של ההיתר הכללי, ו"יש פרטי" בצד עם צפייה והורדה. */
  @font-face{font-family:'Alef';font-weight:400;font-display:swap;src:url(fonts/alef/alef-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
  @font-face{font-family:'Alef';font-weight:700;font-display:swap;src:url(fonts/alef/alef-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#274d5b;--accent:#2aada1;--accent-dark:#1e8f85;--accent-bg:#e9f6f5;--accent-border:#b9e3de;--border:#dfe7e8;--text:#3b3d3d;--muted:#6a7c82}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Alef','Heebo','Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f7f7;color:var(--text);font-size:17px;line-height:1.5;padding:0 .8rem 2rem}
  .wrap{max-width:1100px;margin:0 auto}
  .hero{background:linear-gradient(135deg,#1d3b46,#274d5b 60%,#35616f);color:#fff;text-align:center;margin:0 -.8rem 1.2rem;padding:1.6rem .8rem 1.3rem}
  .hero h1{font-size:30px;font-weight:700;margin:0}.hero .bc{font-size:14px;opacity:.8;margin-top:.3rem}
  .tabs{display:flex;justify-content:center;gap:.5rem;margin:-.4rem 0 1.2rem;flex-wrap:wrap}
  .tabs button{font:inherit;font-size:18px;font-weight:700;color:var(--navy);background:#fff;border:2px solid var(--accent-border);border-radius:999px;padding:.4rem 1.6rem;cursor:pointer}
  .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:2rem;align-items:start}
  .side{position:sticky;top:.6rem}
  .side button{display:flex;width:100%;justify-content:space-between;align-items:center;font:inherit;font-size:17px;color:var(--navy);background:none;border:0;border-bottom:1px solid var(--border);padding:.65rem .4rem;cursor:pointer;text-align:start}
  .side button::after{content:"\2039";font-size:20px;color:var(--muted);order:2;margin-inline-start:.4rem}
  .side button small{color:var(--muted);font-size:13px;margin-inline-start:auto;padding-inline:.5rem}
  .side button:hover{background:#eef4f5}.side button.on{font-weight:700;color:var(--accent-dark);border-bottom-color:var(--accent)}
  .bar{margin-bottom:1rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .bar input{flex:1;min-width:180px;font:inherit;font-size:16px;padding:.5rem .8rem;border:2px solid var(--accent-border);border-radius:10px;background:#fff;color:var(--text);min-height:44px}
  .cnt{font-size:14px;color:var(--muted)}
  .cat{margin:1.6rem 0 .4rem;font-size:22px;font-weight:700;color:var(--navy);text-align:center;border-bottom:2px solid var(--accent-border);padding-bottom:.3rem}
  .cat small{font-size:14px;color:var(--muted);font-weight:400;margin-inline-start:.4rem}
  .it{text-align:center;padding:.9rem .5rem;border-bottom:1px solid #edf1f2}
  .nm{font-size:21px;color:#2f6270;overflow-wrap:anywhere}.nm .p{display:block;font-size:14px;color:var(--muted)}
  .act{display:flex;justify-content:center;gap:1.4rem;flex-wrap:wrap;margin-top:.35rem}
  .grp{display:flex;align-items:center;gap:.4rem;font-size:13px;color:var(--navy);font-weight:700}
  .pair{display:flex;gap:5px}
  a.ic{display:inline-flex;width:34px;height:32px;align-items:center;justify-content:center;border:1px solid var(--accent-border);border-radius:6px;background:#fff;color:var(--accent-dark);text-decoration:none}
  a.ic:hover{background:var(--accent-bg)}
  .none{color:#a8b3b6;font-size:14px;font-weight:400}
  .state{padding:2rem;text-align:center;color:var(--muted)}
  @media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem}.side button{width:auto;white-space:nowrap;border:2px solid var(--accent-border);border-radius:999px;padding:.25rem .8rem}.side button::after{display:none}.side button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.hero h1{font-size:24px}}
  body.embed .hero{display:none}
  .sp{font-size:13px;color:var(--navy);margin-top:.35rem}.sp b{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><h1>שטרות היתר עסקה</h1><div class="bc" id="bc">דף הבית « שטרות היתר עסקה</div></header>
  <div class="tabs" id="tabs" role="tablist"><button role="tab" data-t="private">שטרות פרטיים</button><button role="tab" data-t="general">שטרות כלליים</button></div>
  <div class="layout">
    <nav class="side" id="side" aria-label="קטגוריות"></nav>
    <main>
      <div class="bar"><input type="search" id="q" placeholder="חיפוש חברה…" autocomplete="off" aria-label="חיפוש חברה"><span class="cnt" id="cnt"></span></div>
      <div id="list"><div class="state">טוען…</div></div>
    </main>
  </div>
</div>
<script>
const API_BASE = "https://harav-levin.pages.dev";
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ICON_VIEW = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_DL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>';
if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
let CAT = "", Q = "";

// צפייה והורדה כ-JSON (base64): רשתות עם סינון תוכן חוסמות הורדת PDF ישירה. אם נכשל - נופלים לקישור הישיר
async function fetchPdf(id) {
  const r = await fetch(`${API_BASE}/api/permit-docs-public/${encodeURIComponent(id)}?enc=b64`);
  if (!r.ok) throw new Error(r.status);
  const j = await r.json(), bin = atob(j.data), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return { blob: new Blob([u8], { type: "application/pdf" }), name: j.name || "permit.pdf" };
}
async function pdView(ev, id) {
  ev.preventDefault();
  const direct = `${API_BASE}/api/permit-docs-public/${encodeURIComponent(id)}`, w = window.open("", "_blank");
  if (!w) { location.href = direct; return false; }
  try { w.document.title = "טוען…"; w.document.body.innerHTML = '<p style="font:16px sans-serif;text-align:center;margin-top:30vh" dir="rtl">טוען את המסמך…</p>'; } catch (e) {}
  try { w.location.href = URL.createObjectURL((await fetchPdf(id)).blob); } catch (e) { w.location.href = direct; }
  return false;
}
async function pdDownload(ev, id) {
  ev.preventDefault();
  const a = ev.currentTarget; a.style.opacity = ".5"; a.style.pointerEvents = "none";
  try {
    const f = await fetchPdf(id), url = URL.createObjectURL(f.blob), d = document.createElement("a");
    d.href = url; d.download = f.name; document.body.appendChild(d); d.click(); d.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { window.open(`${API_BASE}/api/permit-docs-public/${encodeURIComponent(id)}?dl=1`, "_blank"); }
  finally { a.style.opacity = ""; a.style.pointerEvents = ""; }
  return false;
}
const lnk = (id, ic, label, dl) => `<a class="ic" href="${API_BASE}/api/permit-docs-public/${esc(id)}${dl ? "?dl=1" : ""}" target="_blank" rel="noopener" title="${label}" aria-label="${label}" onclick="return ${dl ? "pdDownload" : "pdView"}(event,'${esc(id)}')"${dl ? " download" : ""}>${ic}</a>`;
const pair = id => `<div class="pair">${lnk(id, ICON_VIEW, "צפייה")}${lnk(id, ICON_DL, "הורדה", 1)}</div>`;

// כמו display.html: שמות החברות והשיוך ללשונית (פרטי / כללי) מגיעים מרשימות /api/lists, והמסמכים לפי השיוך שבניהול
const TABS = { private: "שטרות פרטיים", general: "שטרות כלליים" };
const LISTS = {};
let LINKS = null, TAB = "private";
const qnorm = s => String(s || "").replace(/["'׳״]/g, "");
async function loadTab(level) {
  if (LISTS[level]) return LISTS[level];
  if (!LINKS) LINKS = await fetch(`${API_BASE}/api/permit-docs-public`).then(r => r.json()).then(d => d.links || []).catch(() => []);
  const byChp = new Map(), byName = new Map();
  for (const l of LINKS) { if (l.chp) byChp.set(String(l.chp).trim(), l); else byName.set(l.name, l); }
  const lr = await fetch(`${API_BASE}/api/lists?type=companies-${level}`).then(r => r.json());
  const rows = [];
  for (const b of lr.rows || []) {
    const cats = String(b.permits_category || "").split("|").map(x => x.trim()).filter(Boolean);
    if (!cats.length || (b.permit_name || b._registrar) === "מסלול הלכה") continue;
    const l = byChp.get(String(b.chp_number || "").trim()) || byName.get(b.permit_name) || {};
    const gen = level === "general";
    const row = { name: b.permit_name || b._registrar || "—", doc: l[level] || "", priv: gen ? (l.private || "") : "", hasPriv: gen && (b.has_private_permit === "כן" || !!l.private), specials: l.specials || [], hay: `${b.permit_name || ""} ${b._registrar || ""} ${b.chp_number || ""}`.toLowerCase() };
    for (const cat of cats) rows.push({ ...row, cat });
  }
  return LISTS[level] = rows;
}
async function draw() {
  document.querySelectorAll("#tabs button").forEach(t => t.classList.toggle("on", t.dataset.t === TAB));
  document.getElementById("bc").textContent = "דף הבית « " + TABS[TAB];
  document.title = TABS[TAB];
  const list = document.getElementById("list");
  let ROWS;
  try { ROWS = await loadTab(TAB); } catch (e) { list.innerHTML = '<div class="state">הרשימה לא זמינה כרגע. נסו שוב מאוחר יותר.</div>'; return; }
  const q = Q.trim().toLowerCase(), cats = new Map();
  for (const r of ROWS) cats.set(r.cat, (cats.get(r.cat) || 0) + 1);
  if (CAT && !cats.has(CAT)) CAT = "";
  const names = [...cats.keys()].sort((a, b) => a.localeCompare(b, "he"));
  document.getElementById("side").innerHTML = `<button data-c=""${CAT ? "" : ' class="on"'}>כל הקטגוריות<small>${ROWS.length}</small></button>` + names.map(c => `<button data-c="${esc(c)}"${c === CAT ? ' class="on"' : ""}>${esc(c)}<small>${cats.get(c)}</small></button>`).join("");
  const rows = ROWS.filter(r => (!CAT || r.cat === CAT) && (!q || r.hay.includes(q)));
  document.getElementById("cnt").textContent = rows.length + " חברות";
  const by = new Map();
  for (const r of rows) { if (!by.has(r.cat)) by.set(r.cat, []); by.get(r.cat).push(r); }
  const out = [...by.keys()].sort((a, b) => a.localeCompare(b, "he")).map(c => `${CAT ? "" : `<h2 class="cat">${esc(c)}<small>${by.get(c).length}</small></h2>`}${by.get(c).sort((x, y) => qnorm(x.name).localeCompare(qnorm(y.name), "he")).map(r => {
    const main = r.doc ? `<div class="grp">${pair(r.doc)}</div>` : "";
    const side = r.hasPriv ? `<div class="grp">יש פרטי ${r.priv ? pair(r.priv) : ""}</div>` : "";
    const sp = r.specials.map(x => `<div class="grp"><span>${esc(x.title)}</span> ${pair(x.id)}</div>`).join("");
    return `<div class="it"><div class="nm">${esc(r.name)}</div><div class="act">${main}${side}${sp}${main || side || sp ? "" : '<div class="grp none">—</div>'}</div></div>`;
  }).join("")}`).join("");
  list.innerHTML = out || '<div class="state">לא נמצאו חברות</div>';
}
function setHash() { location.hash = `t=${TAB}` + (CAT ? "&cat=" + encodeURIComponent(CAT) : ""); }
document.getElementById("q").addEventListener("input", e => { Q = e.target.value; draw(); });
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; TAB = b.dataset.t; CAT = ""; setHash(); draw(); });
document.getElementById("side").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; CAT = b.dataset.c; setHash(); draw(); });
{
  const t = /t=(private|general)/.exec(location.hash), m = /cat=([^&]+)/.exec(location.hash);
  if (t) TAB = t[1]; if (m) CAT = decodeURIComponent(m[1]);
  draw();
}
</script>
</body>
</html>
