<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ניהול · מכון להיתר עסקה למהדרין</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:   #1a3a5c;
    --navy2:  #1e4570;
    --gold:   #c9a227;
    --bg:     #f7f7f5;
    --bg2:    #ffffff;
    --border: #e0ddd8;
    --text:   #1a1a1a;
    --muted:  #6b6b6b;
    --light:  #a0a0a0;
    --red:    #c0392b;
    --green:  #1e7e4a;
    --green-bg: #edf7f1;
    --green-border: #a8d9bc;
    --danger-bg: #fdf0ef;
  }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    color: #fff;
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  header h1 { font-size: 17px; font-weight: 500; letter-spacing: .01em; }
  header small { font-size: 12px; opacity: .65; margin-right: 10px; }
  #admin-toggle {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    color: #fff;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s;
  }
  #admin-toggle:hover { background: rgba(255,255,255,.2); }

  /* ── MAIN ── */
  main { max-width: 1900px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: .6rem;
    align-items: center;
  }
  .filter-bar .fb-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .filter-bar .fb-label {
    font-size: 10px;
    color: var(--light);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding-right: 2px;
  }
  .filter-bar select, .filter-bar input {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg2);
    font-size: 13px;
    color: var(--text);
    direction: rtl;
    outline: none;
    transition: border-color .15s;
    height: 34px;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--navy); }
  .filter-bar select.active, .filter-bar input.active {
    border-color: var(--navy);
    background: #eef3f9;
    color: var(--navy);
    font-weight: 500;
  }
  .fb-search { flex: 1; min-width: 200px; }
  .clear-filters {
    padding: 6px 12px;
    background: none;
    border: 1px solid #f0b0aa;
    border-radius: 7px;
    font-size: 12px;
    color: var(--red);
    cursor: pointer;
    height: 34px;
    white-space: nowrap;
    transition: background .15s;
    align-self: flex-end;
  }
  .clear-filters:hover { background: var(--danger-bg); }

  /* ── SORTABLE HEADERS ── */
  thead th.sortable {
    cursor: pointer;
    user-select: none;
    position: relative;
    padding-left: 22px;
  }
  thead th.sortable:hover { color: var(--navy); }
  thead th.sort-active { color: var(--navy); font-weight: 600; }
  .sort-icon {
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    opacity: .5;
  }
  thead th.sort-active .sort-icon { opacity: 1; color: var(--navy); }

  /* ── CONTROLS (keep for compat) ── */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .controls input, .controls select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg2);
    font-size: 14px;
    color: var(--text);
    direction: rtl;
    outline: none;
    transition: border-color .15s;
  }
  .controls input { flex: 1; min-width: 200px; }
  .controls input:focus, .controls select:focus { border-color: var(--navy); }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 820px; table-layout: fixed; }
  col.c-num      { width: 36px; }
  col.c-name     { width: 150px; }
  col.c-name-lg  { width: 240px; }
  col.c-chp      { width: 80px; }
  col.c-cat      { width: 80px; }
  col.c-biztype  { width: 80px; }
  col.c-region   { width: 50px; }
  col.c-vis      { width: 108px; }
  col.c-agch-combined { width: 150px; }
  col.c-tase     { width: 62px; }
  col.c-agch     { width: 108px; }
  col.c-notes    { width: 150px; }
  col.c-nscope   { width: 175px; }
  col.c-regst    { width: 80px; }
  col.c-actions  { width: 140px; }
  thead th {
    text-align: right;
    padding: 11px 14px;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: normal;          /* כותרות בשתי שורות כשצריך */
    line-height: 1.25;
    background: var(--bg);
    overflow: hidden;
  }
  /* כותרות קבועות (freeze panes) בגלילת העמוד, במחשב. במסך צר הטבלה נגללת לרוחב ולכן נשארת כמו קודם. */
  @media (min-width: 900px) {
    .table-wrap { overflow: visible; }
    thead th, thead th.sortable { position: sticky; top: 56px; z-index: 6; box-shadow: 0 1px 0 var(--border); }
  }
  thead th:first-child { border-radius: 10px 0 0 0; }
  thead th:last-child  { border-radius: 0 10px 0 0; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: #f0f0ee; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  td { padding: 11px 14px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.notes-cell, td.biz-name { white-space: nowrap; }
  td.num { color: var(--light); font-size: 12px; width: 36px; }
  td.biz-name { font-weight: 500; }
  td.biz-name .permit { color: var(--muted); font-weight: 400; font-size: 13px; }
  td.cat-cell span {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    background: #eef0f5;
    color: var(--muted);
  }
  td.notes-cell { color: var(--light); font-size: 12px; }
  .empty-row td { text-align: center; padding: 2.5rem; color: var(--light); }

  /* ── DELETE MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeInOverlay .15s ease;
  }
  @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: var(--bg2);
    border-radius: 14px;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
    margin: 1rem;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    animation: slideUpModal .18s ease;
  }
  @keyframes slideUpModal { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-icon { font-size: 2.2rem; text-align: center; margin-bottom: .75rem; }
  .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: .4rem; }
  .modal-biz-name {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 14px;
    margin: .75rem 0 1.1rem;
    word-break: break-word;
  }
  .modal-instruction { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .modal-instruction strong { color: var(--red); font-family: monospace; }
  .modal-input {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    direction: ltr;
    text-align: center;
    outline: none;
    transition: border-color .15s;
    letter-spacing: .06em;
  }
  .modal-input:focus { border-color: var(--red); }
  .modal-input.confirmed { border-color: var(--red); background: #fff5f5; }
  .modal-actions { display: flex; gap: 8px; margin-top: 1.1rem; }
  .modal-actions .cancel {
    flex: 1; padding: 10px; background: none;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; color: var(--muted); cursor: pointer;
    transition: border-color .15s;
  }
  .modal-actions .cancel:hover { border-color: var(--navy); color: var(--navy); }
  .modal-actions .confirm-del {
    flex: 1; padding: 10px; background: var(--red);
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; color: #fff; cursor: pointer;
    opacity: .4; transition: opacity .15s;
    pointer-events: none;
  }
  .modal-actions .confirm-del.ready { opacity: 1; pointer-events: auto; }
  .modal-actions .confirm-del.ready:hover { background: #a93226; }

  /* ── ACTION BUTTONS (admin table) ── */
  .act-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 13px;
    transition: background .15s;
    color: var(--muted);
  }
  .act-btn:hover { background: var(--bg); }
  .act-btn.del { color: var(--red); }
  .confirm-row td { background: var(--danger-bg) !important; }
  .confirm-btns { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .confirm-btns .yes {
    background: var(--red); color: #fff;
    border: none; padding: 4px 10px;
    border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  .confirm-btns .no {
    background: none; border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 13px;
    color: var(--muted);
  }

  /* ── PANEL (login / form) ── */

  /* ── מסך ראשי של הניהול + חיפוש במאגר ── */
  .home-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; max-width:900px; margin:2.5rem auto; }
  .home-card { background:var(--bg2); border:1.5px solid var(--border); border-radius:14px; padding:1.8rem 1.4rem; text-align:center; cursor:pointer; font-family:inherit; transition:.15s; color:var(--navy); }
  .home-card:hover { border-color:var(--navy); box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-2px); }
  .home-card .ico { font-size:34px; display:block; margin-bottom:10px; }
  .home-card b { font-size:18px; display:block; margin-bottom:4px; }
  .home-card span.sub { font-size:13px; color:var(--muted); }
  .gs-box { max-width:900px; margin:0 auto 1rem; }
  .gs-box input { width:100%; padding:12px 16px; font-size:16px; border:1.5px solid var(--border); border-radius:10px; font-family:inherit; background:var(--bg2); }
  .gs-box input:focus { outline:none; border-color:var(--navy); }
  .gs-info { color:var(--muted); font-size:13px; margin:.4rem 0 1rem; }
  .gs-sec { font-size:15px; font-weight:600; color:var(--navy); margin:1.2rem 0 .6rem; }
  .gs-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  .scard { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px; }
  .scard .sh { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .scard .st { font-size:15px; font-weight:600; color:var(--navy); }
  .scard .badge-t { font-size:11px; padding:1px 8px; border-radius:10px; background:#e8eef5; color:var(--navy); white-space:nowrap; }
  .scard .badge-t.bond { background:#e6f4ea; color:var(--green); }
  .scard dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:0; }
  .scard dt { color:var(--muted); }
  .scard dd { margin:0; word-break:break-word; }
  .scard mark { background:#fff3b0; padding:0 1px; border-radius:2px; }
  .scard .sbtn { font-size:12px; padding:3px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); cursor:pointer; font-family:inherit; }
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    max-width: 520px;
    margin: 2rem auto;
  }
  .panel h2 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .panel-header h2 { margin: 0; }

  /* ── FORM ── */
  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    font-size: 14px;
    color: var(--text);
    direction: rtl;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--navy); background: #fff; }
  .field input.ltr { direction: ltr; text-align: left; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── LOOKUP BOX ── */
  .lookup-box {
    background: #f0f4f8;
    border: 1px solid #c8d8ea;
    border-radius: 9px;
    padding: 1.1rem;
    margin-bottom: 1.25rem;
  }
  .lookup-box p.lbl { font-size: 12px; font-weight: 500; color: var(--navy); margin-bottom: 10px; }
  .lookup-row { display: flex; gap: 8px; position: relative; align-items: center; }
  .lookup-row .spin { position: absolute; right: 12px; }
  #chp { padding-right: 38px; }
  .spin { width: 16px; height: 16px; border: 2px solid var(--accent-border); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: hlspin .7s linear infinite; vertical-align: middle; }
  @keyframes hlspin { to { transform: rotate(360deg); } }
  .lookup-loading { display:flex; align-items:center; gap:8px; color: var(--muted); font-size: 13px; margin-top: 8px; }
  .lookup-row input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    direction: ltr;
    text-align: left;
    outline: none;
    transition: border-color .15s;
  }
  .lookup-row input:focus { border-color: var(--navy); }
  .lookup-row button {
    padding: 9px 16px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: background .15s;
  }
  .lookup-row button:hover { background: var(--navy2); }
  .lookup-row button:disabled { opacity: .55; cursor: default; }
  .lookup-result {
    margin-top: 10px;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: 7px;
    padding: 10px 14px;
  }
  .lookup-result .found-name { font-size: 15px; font-weight: 500; margin: 3px 0; }
  .lookup-result .found-meta { font-size: 12px; color: var(--muted); }
  .lookup-error { color: var(--red); font-size: 13px; margin-top: 8px; }

  /* ── BUTTONS ── */
  .btn-primary {
    width: 100%;
    padding: 11px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
    margin-top: .5rem;
  }
  .btn-primary:hover { background: var(--navy2); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s;
  }
  .btn-ghost:hover { border-color: var(--navy); color: var(--navy); }
  .btn-add {
    padding: 8px 16px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-add:hover { background: var(--navy2); }
  .btn-danger {
    padding: 8px 16px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-danger:hover { background: #a93226; }
  .btn-danger:disabled { opacity: .55; cursor: default; }

  /* ── ADMIN BAR ── */
  .admin-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 8px;
  }
  .admin-bar h2 { font-size: 16px; font-weight: 500; color: var(--muted); }

  /* ── ERROR ── */
  .error-msg { color: var(--red); font-size: 13px; margin: 6px 0; min-height: 20px; }

  /* ── STATUS BAR ── */
  #status-bar {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 99;
  }
  #status-bar.show { opacity: 1; }

  /* ── COUNT BADGE ── */
  .count { font-size: 13px; color: var(--muted); }

  /* ── LOADING SPINNER ── */
  .loading {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-size: 14px;
  }

  /* ════════════════════════════════════════════
     CSV IMPORT STYLES
  ════════════════════════════════════════════ */

  .csv-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    max-width: 860px;
    margin: 1.5rem auto;
  }
  .csv-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.75rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px solid var(--border);
  }
  .csv-panel-header h2 { font-size: 18px; font-weight: 500; }

  /* Drop Zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    background: var(--bg);
    position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--navy);
    background: #f0f4f8;
  }
  .drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-zone .dz-icon { font-size: 2.5rem; margin-bottom: .75rem; }
  .drop-zone .dz-title { font-size: 15px; font-weight: 500; color: var(--navy); margin-bottom: .3rem; }
  .drop-zone .dz-sub { font-size: 13px; color: var(--muted); }
  .drop-zone .dz-btn {
    display: inline-block;
    margin-top: 1rem;
    padding: 8px 20px;
    background: var(--navy);
    color: #fff;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
  }

  /* Column mapping */
  .mapping-section { margin-bottom: 1.5rem; }
  .mapping-section h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: .9rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .mapping-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .mapping-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .mapping-row label { font-size: 12px; color: var(--muted); }
  .mapping-row select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    font-size: 13px;
    color: var(--text);
    direction: rtl;
    outline: none;
    cursor: pointer;
    transition: border-color .15s;
  }
  .mapping-row select:focus { border-color: var(--navy); }
  .mapping-row select.mapped { border-color: var(--green); background: var(--green-bg); }

  /* Preview table */
  .preview-section { margin-bottom: 1.5rem; }
  .preview-section h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: .75rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .preview-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 9px;
    max-height: 260px;
    overflow-y: auto;
  }
  .preview-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .preview-wrap thead th {
    padding: 8px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  .preview-wrap tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .preview-wrap tbody tr:hover { background: #f5f5f3; }
  .preview-wrap td { padding: 8px 12px; }

  /* Confirm box */
  .confirm-import-box {
    background: #fff8e6;
    border: 1px solid #f0d070;
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1.25rem;
    font-size: 14px;
  }
  .confirm-import-box strong { color: var(--red); }
  .confirm-import-box .ci-count { color: var(--green); font-weight: 500; }

  /* Progress */
  .progress-wrap { margin: 1.5rem 0; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar-bg {
    background: var(--border);
    border-radius: 20px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--navy);
    border-radius: 20px;
    transition: width .15s;
  }
  .progress-phase {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }

  /* Done summary */
  .done-box {
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: 10px;
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .done-box .done-icon { font-size: 2.5rem; margin-bottom: .5rem; }
  .done-box h3 { font-size: 17px; font-weight: 500; color: var(--green); margin-bottom: .4rem; }
  .done-box p { font-size: 14px; color: var(--muted); }
  .done-error-box {
    background: var(--danger-bg);
    border: 1px solid #f0b0aa;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-top: .75rem;
    font-size: 13px;
    color: var(--red);
    max-height: 120px;
    overflow-y: auto;
  }

  /* Steps indicator */
  .steps {
    display: flex;
    gap: 0;
    margin-bottom: 1.75rem;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .step {
    flex: 1;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--light);
    background: var(--bg);
    text-align: center;
    border-left: 1px solid var(--border);
    transition: all .2s;
  }
  .step:last-child { border-left: none; }
  .step.active { background: var(--navy); color: #fff; font-weight: 500; }
  .step.done { background: var(--green-bg); color: var(--green); }
  /* Alef — אותו גופן של האתר (SIL OFL), מאורח בריפו */
  @font-face{font-family:'Alef';font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/alef/alef-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Alef';font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/alef/alef-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Alef';font-style:normal;font-weight:700;font-display:swap;

  @font-face{font-family:'Alef';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/alef/alef-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  /* ═══ התאמה לעיצוב האתר (display.html): גופן Alef, צבעי navy/טורקיז, כותרות טבלה בירקרק בהיר ═══ */
  :root {
    --navy:#274d5b; --navy2:#1c3a47;

  .panel, .table-wrap, .csv-panel { border-radius: 4px; }
  thead th { background: var(--accent-bg); color: var(--navy); font-weight: 700; font-size: 13px; }
  tbody tr:nth-child(even) { background: var(--row-alt); }

  .admin-bar h2, .panel h2, .panel-header h2 { color: var(--navy); font-weight: 700; }
  .home-card { border-radius: 4px; border-color: var(--border); }

  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  /* ── שלוש האפשרויות בראש כל מסך ניהול (כמו לשוניות האתר) ── */
  .chp-choice { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .big-card { text-align:center; background:#fff; border:2px dashed var(--border); border-radius:8px; padding:16px 18px; min-height:150px; }

  .big-nochp { width:100%; min-height:150px; font-family:inherit; font-size:21px; font-weight:700; color:var(--navy); background:#fff; border:2px dashed var(--border); border-radius:8px; cursor:pointer; transition:.15s; padding:12px; }
  .big-nochp:hover { border-color:var(--accent); background:var(--accent-bg); color:var(--accent-dark); }
  .big-nochp .ico { display:block; font-size:30px; margin-bottom:6px; }
  .big-nochp small { display:block; font-size:13px; font-weight:400; color:var(--muted); margin-top:4px; }
  .nochp-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 2px; color:var(--navy); }
  @media (max-width:700px) { .chp-choice { grid-template-columns:1fr; } }
  .permit-choice { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pc-btn { font-family:inherit; font-size:16px; font-weight:700; color:var(--navy); background:#fff; border:2px solid var(--border); border-radius:6px; padding:10px 12px; cursor:pointer; text-align:center; transition:.15s; }
  .pc-btn small { display:block; font-size:12px; font-weight:400; color:var(--muted); margin-top:2px; min-height:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .admin-tbl th, .admin-tbl td { padding-left:8px; padding-right:8px; }
  tr.row-dirty td { background:#fff8e6; }
  .row-save, .row-del { font-family:inherit; font-size:12px; padding:4px 10px; border-radius:5px; border:1px solid var(--border); background:#fff; cursor:pointer; }
  .row-save { border-color:var(--accent); color:var(--accent-dark); font-weight:700; }

  .pc-btn.on { border-color:var(--accent); background:var(--accent-bg); color:var(--accent-dark); }
  #form-after-permit.locked { opacity:.35; pointer-events:none; user-select:none; }
  .ns-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; margin-top:4px; background:#fff; border:1px solid var(--border); border-radius:4px; font-size:13px; text-align:right; }

  .ns-row.addable:hover { border-color:var(--accent); background:var(--accent-bg); }

  .admin-tabs button:hover { color:var(--accent-dark); }

</style>
</head>
<body>

<header>
  <div>
    <a href="/" class="logo-link"><img id="site-logo" src="logo.png" alt="מכון היתר עסקה למהדרין" onerror="this.style.display='none';document.getElementById('site-title').style.display='';"><h1 id="site-title" style="display:none;">מכון להיתר עסקה למהדרין</h1></a>
  </div>
  <button id="admin-toggle" onclick="toggleAdmin()">כניסת מנהל</button>
</header>

<main>
  <div id="app"><div class="loading">טוען נתונים...</div></div>
</main>

<!-- Delete confirmation modal -->
<div id="delete-modal" style="display:none;"></div>

<div id="status-bar"></div>

<script src="xlsx-lite.js"></script>
<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let businesses = [];
let isAdmin    = false;
let adminToken = "";
let view       = "login";
let search     = "";
let filterCat  = "";
let filterRegion   = "";
let filterBizType  = "";
let filterVis      = "";
let filterAgch     = "";   // "" | "אין" | "מאושר" | "לא מאושר" | "יש"
let sortCol    = "name";   // name | chp | category | region | biz_type | visibility | agch | notes
let sortDir    = "asc";    // asc | desc
let editBiz    = null;
let deleteId   = null;
let chpResult  = null;
let chpError   = "";
let chpLoading = false;
let saving     = false;

// CSV import state
let csvStep       = "upload";   // upload | preview | importing | done
let csvHeaders    = [];
let csvRows       = [];         // array of arrays (raw)
let csvColMap     = {};         // fieldKey → colIndex (or -1)
let csvProgress   = 0;
let csvTotal      = 0;
let csvPhase      = "";
let csvErrors     = [];
let csvImported   = 0;
let csvDeleted    = 0;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ─────────────────────────────────────────────
//  FIELD DEFINITIONS FOR CSV MAPPING
// ─────────────────────────────────────────────
const CSV_FIELDS = [
  { key: "chp_number",     label: "ח.פ. / מספר רישום",  aliases: ["חפ","ח.פ","ח.פ.","chp","chp_number","מספר רישום","מספר תאגיד","ס.מ.","ס\"מ"] },
  { key: "registrar_name", label: "שם ברשם הרשמי",       aliases: ["שם ברשם","שם רשמי","registrar_name","registrar","שם תאגיד","שם החברה","שם חברה / שותפות רשמי","שם חברה","שם שותפות"] },
  { key: "permit_name",    label: "שם בהיתר עסקה",       aliases: ["שם בהיתר","היתר","permit_name","permit","שם עסק","שם","היתר עסקה על שם","היתר עסקה"] },
  { key: "category",       label: "קטגוריה",              aliases: ["קטגוריה","category","ענף","סוג","עיסוק","תחום עיסוק"] },
  { key: "region",         label: "אזור",                 aliases: ["אזור","region","מחוז"] },
  { key: "visibility",     label: "פרטי / כללי",          aliases: ["פרטי/כללי","פרטי כללי","visibility","היתר עסקה חברה"] },
  { key: "agch_approved",  label: "אישור אג\"ח",          aliases: ["אישור אגח","אישור אג\"ח","agch_approved","אגח מאושר","היתר עסקה אגח","היתר עסקה אג\"ח"] },
  { key: "tase_has_agch",  label: "אג\"ח בורסה",          aliases: ["אגח בורסה","אג\"ח בורסה","tase_has_agch","בורסה"] },
  { key: "biz_type",       label: "סוג עסק",              aliases: ["סוג עסק","entity_type","biz_type","סוג החברה","סוג תאגיד","סוג"] },
  { key: "notes",          label: "הערות",                aliases: ["הערות","notes","remarks","הערה"] },
];

// ─────────────────────────────────────────────
//  API HELPERS
// ─────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (adminToken) headers["Authorization"] = `Bearer ${adminToken}`;
  const res = await fetch("/api" + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

async function loadBusinesses() {
  businesses = await apiFetch("/businesses");
  render();
}

// ─────────────────────────────────────────────
//  DISPLAY NAME
// ─────────────────────────────────────────────
function displayName(b, asHTML = false) {
  const r = (b.registrar_name || "").trim();
  const p = (b.permit_name    || "").trim();
  if (r && p && r !== p) {
    return asHTML
      ? `${escHtml(r)} <span class="permit">(${escHtml(p)})</span>`
      : `${r} (${p})`;
  }
  return asHTML ? escHtml(r || p || "—") : (r || p || "—");   // בלי asHTML = טקסט רגיל (מי שמכניס ל-HTML מצפין בעצמו)
}

// Combined אג"ח status label for public table
function agchLabel(b) {
  const has  = (b.tase_has_agch  || "").trim();
  const appr = (b.agch_approved  || "").trim();
  if (has !== "יש") {
    return `<span style="color:var(--light);">אין אג"ח</span>`;
  }
  if (appr === "כן") {
    return `<span style="color:var(--green);font-weight:500;">יש אג"ח · מאושר</span>`;
  }
  if (appr === "לא") {
    return `<span style="color:#b85c00;font-weight:500;">יש אג"ח · לא מאושר</span>`;
  }
  return `<span style="color:var(--muted);">יש אג"ח</span>`;
}

function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if      (view === "table")      { location.href = "/"; return; }   // התצוגה הציבורית היא דף נפרד (index.html)
  else if (view === "login")      app.innerHTML = renderLogin();
  else if (view === "home")       app.innerHTML = renderHome();
  else if (view === "search")     app.innerHTML = adminTabs() + renderSearch();
  else if (view === "admin")      app.innerHTML = adminTabs() + renderAdminTable();
  else if (view === "form")       app.innerHTML = adminTabs() + renderForm();
  else if (view === "csv-import") app.innerHTML = adminTabs() + renderCsvImport();
  bindEvents();
  document.getElementById("admin-toggle").textContent =
    isAdmin ? "יציאה ממנהל" : "כניסת מנהל";
}

// ── TABLE (public) — combined view ──
// ── LOGIN ──
function renderLogin() {
  return `
    <div class="panel" style="max-width:340px;">
      <h2>כניסת מנהל</h2>
      <div class="field">
        <label>סיסמה</label>
        <input id="pwd" type="password" class="ltr" placeholder="הכנס סיסמה" autocomplete="current-password">
      </div>
      <p class="error-msg" id="login-err"></p>
      <button class="btn-primary" onclick="doLogin()">כניסה</button>
      <button class="btn-ghost" style="width:100%;margin-top:8px;" onclick="location.href='/'">חזרה</button>
    </div>`;
}

// ── ADMIN TABLE ──
function renderAdminTable() {
  const sorted = filteredAndSorted();   // לפי החיפוש / המסננים (ברירת מחדל: כל העסקים, לפי שם)
  return `
    <div class="admin-bar">
      <h2>ניהול עסקים · <span class="count">${businesses.length} רשומות</span></h2>
    </div>
    <div style="margin-bottom:10px;"><button class="btn-primary" id="save-all-btn" onclick="saveAllRows()" ${dirtyIds().length ? "" : "disabled"} style="width:auto;padding:9px 22px;">שמירת כל השינויים${dirtyIds().length ? ` (${dirtyIds().length})` : ""}</button></div>
    <div id="sync-status" style="display:none;margin-bottom:1rem;padding:10px 14px;border-radius:8px;font-size:13px;border:1px solid var(--border);background:var(--bg2);"></div>
    <div class="filter-bar">
      <div class="fb-group" style="flex:1;min-width:200px;">
        <span class="fb-label">חיפוש</span>
        <input type="text" id="adm-srch" class="fb-search${search ? " active" : ""}" autocomplete="off"
          placeholder="🔍 שם, ח.פ., קטגוריה, אזור, הערות…" value="${escHtml(search)}" oninput="onAdminSearch(this.value)">
      </div>
      <div class="fb-group" style="justify-content:flex-end;"><span class="fb-label">&nbsp;</span>
        <span class="count" style="line-height:34px;">${sorted.length} מתוך ${businesses.length}</span></div>
    </div>
    <div class="table-wrap">
      <table class="admin-tbl">
        <colgroup>
          <col class="c-name">
          <col class="c-chp">
          <col class="c-cat">
          <col class="c-biztype">
          <col class="c-region">
          <col class="c-notes">
          <col class="c-nscope">

            <th>אזור</th>

            return `
              <tr class="${dirty ? "row-dirty" : ""}">
                <td class="biz-name">${(b.chp_number || "").toString().trim() ? displayName(b,true) : `<input type="text" value="${escHtml((b.permit_name || b.registrar_name || "").trim())}" title="עסק בלי ח.פ.: אפשר לעדכן את השם" onchange="nameInline('${b.id}', this.value)" style="width:100%;box-sizing:border-box;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg);color:var(--text);">`}</td>

                  <input type="text" value="${escHtml(b.notes ?? "")}" placeholder="הערה"

                </td>
                <td>${(() => {
                  if (!(b.notes || "").trim()) return "";                              // בלי הערה - אין מה לבחור
                  const sc = b.notes_scope || ((b0.notes || "").trim() ? "companies" : "");   // הערה ישנה בלי בחירה = חברות
                  const bt = (v, l) => `<button type="button" class="sc-b ${sc===v?"on":""}" onclick="noteScopeChange('${b.id}','${v}')">${l}</button>`;
                  return `<span class="sc-btns ${sc?"":"need"}" title="באיזו רשימה מוצגת ההערה">${bt("companies","חברות")}${bt("bonds","אג\"ח")}${bt("both","שתיהן")}</span>`; })()}
                </td>
                <td style="font-size:12px;${/^(מחוסל|חיסול|מחוק|נגרע)/.test(b.registry_status||"")?"color:var(--red);font-weight:500;":/^בפרוק/.test(b.registry_status||"")?"color:#b85c00;font-weight:500;":"color:var(--muted);"}">${escHtml(b.registry_status)||"—"}</td>
                <td style="text-align:center;">
                  <select onchange="draftSet('${b.id}','visibility',this.value)"
                    style="padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;background:var(--bg);color:var(--text);cursor:pointer;direction:rtl;">
                    <option value=""   ${!b.visibility?"selected":""}>רק כללי</option>
                    <option value="פרטי" ${b.visibility==="פרטי"?"selected":""}>יש גם פרטי</option>
                    <option value="רק פרטי" ${b.visibility==="רק פרטי"?"selected":""}>רק פרטי</option>
                  </select>
                </td>
                <td style="text-align:center;font-size:13px;">${
                  b.tase_has_agch === "יש" ? `<span style="color:var(--green);font-weight:500;">✓ יש</span>` :
                  b.tase_has_agch === "אין" ? `<span style="color:var(--light);font-size:12px;">אין</span>` : "—"
                }</td>
                <td style="text-align:center;">
                  <select onchange="agchChange('${b.id}', this)"
                    style="padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;background:var(--bg);color:var(--text);cursor:pointer;direction:rtl;">
                    <option value=""   ${!b.agch_approved?"selected":""}>—</option>
                    <option value="כן" ${b.agch_approved==="כן"?"selected":""}>כן</option>
                    <option value="לא" ${b.agch_approved==="לא"?"selected":""}>לא</option>
                    <option value="רק פרטי" ${b.agch_approved==="רק פרטי"?"selected":""}>רק פרטי</option>
                    <option value="רק כללי" ${b.agch_approved==="רק כללי"?"selected":""}>רק כללי</option>
                    <option value="בחירת אג&quot;ח מסוימים" ${b.agch_approved===BOND_PICK?"selected":""}>אג"ח מסוימים</option>
                    <option value="__pick__">⚙ בחירת אג"ח…</option>
                  </select>
                </td>
                <td style="text-align:center;white-space:nowrap;">
                  <button class="row-save" onclick="saveRow('${b.id}')" ${dirty ? "" : "disabled"}>שמור</button>
                  <button class="row-del" onclick="preDelete('${b.id}')">מחיקה</button>
                </td>
              </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
}

// ════════════════════════════════════════════
//  CSV IMPORT VIEW
// ════════════════════════════════════════════
function renderCsvImport() {
  const stepLabels = ["העלאת קובץ", "מיפוי עמודות", "ייבוא", "סיום"];
  const stepIndex  = { upload: 0, preview: 1, importing: 2, done: 3 };
  const curStep    = stepIndex[csvStep] ?? 0;

  const stepsHtml = stepLabels.map((lbl, i) => {
    const cls = i < curStep ? "done" : i === curStep ? "active" : "";
    return `<div class="step ${cls}">${i < curStep ? "✓ " : ""}${lbl}</div>`;
  }).join("");

  let body = "";

  // ── STEP 1: Upload ──
  if (csvStep === "upload") {
    body = `
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-file-input').click()">
        <input type="file" id="csv-file-input" accept=".csv,text/csv" style="display:none">
        <div class="dz-icon">📄</div>
        <div class="dz-title">גרור קובץ CSV לכאן</div>
        <div class="dz-sub">או לחץ לבחירת קובץ</div>
        <div class="dz-btn">בחר קובץ CSV</div>
      </div>
      <div style="margin-top:1rem;padding:12px 16px;background:var(--bg);border-radius:8px;border:1px solid var(--border);">
        <p style="font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px;">📋 עמודות נתמכות (לפי שם הכותרת בקובץ):</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${CSV_FIELDS.map(f=>`
            <span style="font-size:12px;padding:3px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;color:var(--muted);">
              ${f.label}
            </span>`).join("")}
        </div>
        <p style="font-size:12px;color:var(--light);margin-top:8px;">הקובץ יכול להכיל כותרות בעברית או באנגלית — המערכת מזהה אוטומטית.</p>
      </div>`;
  }

  // ── STEP 2: Preview + Mapping ──
  else if (csvStep === "preview") {
    const colOptions  = (selVal) => `
      <option value="-1" ${selVal===-1?"selected":""}>— לא למפות —</option>
      ${csvHeaders.map((h,i) => `<option value="${i}" ${selVal===i?"selected":""}>${escHtml(h)}</option>`).join("")}`;

    body = `
      <div class="mapping-section">
        <h3>מיפוי עמודות — ${csvHeaders.length} עמודות זוהו, ${csvRows.length} שורות נתונים</h3>
        <div class="mapping-grid">
          ${CSV_FIELDS.map(f => {
            const val = csvColMap[f.key] ?? -1;
            return `
              <div class="mapping-row">
                <label>${f.label}</label>
                <select id="map-${f.key}" onchange="updateColMap('${f.key}',this.value)" class="${val>=0?'mapped':''}">
                  ${colOptions(val)}
                </select>
              </div>`;
          }).join("")}
        </div>
      </div>

      <div class="preview-section">
        <h3>תצוגה מקדימה — ${Math.min(20,csvRows.length)} שורות ראשונות מתוך ${csvRows.length}</h3>
        ${(() => {
          const previewRows   = csvRows.slice(0, 20);
          const mappedFields  = CSV_FIELDS.filter(f => (csvColMap[f.key]??-1) >= 0);
          // detect duplicate chp within the file
          const chpIdx = csvColMap["chp_number"] ?? -1;
          const chpCounts = {};
          if (chpIdx >= 0) {
            csvRows.forEach(r => {
              const v = (r[chpIdx]||"").trim();
              if (v) chpCounts[v] = (chpCounts[v]||0) + 1;
            });
          }
          // existing chp numbers
          const existingChp = new Set(businesses.map(b=>(b.chp_number||"").trim()).filter(Boolean));
          const dupInFile   = Object.values(chpCounts).some(c=>c>1);
          const dupWarning  = dupInFile
            ? `<div style="margin-bottom:.75rem;padding:8px 12px;background:#fff3cd;border:1px solid #f0c040;border-radius:7px;font-size:13px;color:#7a5800;">⚠️ זוהו ח.פ. כפולים בקובץ (מודגשים באדום) — רק הרשומה הראשונה תיובא</div>`
            : "";
          // col width map
          const colWidths = {
            chp_number:     "90px",  registrar_name: "200px",
            permit_name:    "180px", category:       "110px",
            region:         "75px",  visibility:     "68px",
            agch_approved:  "90px",  tase_has_agch:  "80px",
            biz_type:       "150px", notes:          "auto",
          };
          const seenChp = new Set();
          return dupWarning + `
          <div class="preview-wrap" style="max-height:360px;">
            <table style="table-layout:fixed;min-width:600px;">
              <colgroup>
                <col style="width:32px;">
                ${mappedFields.map(f=>`<col style="width:${colWidths[f.key]||'120px'};">`).join("")}
              </colgroup>
              <thead>
                <tr>
                  <th style="text-align:center;padding:8px 6px;">#</th>
                  ${mappedFields.map(f=>`<th style="padding:8px 12px;">${f.label}</th>`).join("")}
                </tr>
              </thead>
              <tbody>
                ${previewRows.map((row, i) => {
                  const chpVal = chpIdx >= 0 ? (row[chpIdx]||"").trim() : "";
                  const isDupInFile = chpVal && chpCounts[chpVal] > 1 && seenChp.has(chpVal);
                  const isExisting  = chpVal && existingChp.has(chpVal);
                  if (chpVal) seenChp.add(chpVal);
                  const rowStyle = isDupInFile
                    ? 'background:#fdf0ef;'
                    : isExisting ? 'background:#fff8e6;' : '';
                  const badge = isDupInFile
                    ? `<span style="font-size:10px;color:var(--red);margin-right:4px;">כפול</span>`
                    : isExisting
                    ? `<span style="font-size:10px;color:#9a7010;margin-right:4px;">קיים</span>`
                    : "";
                  return `<tr style="${rowStyle}">
                    <td style="text-align:center;color:var(--light);font-size:11px;padding:7px 4px;">${i+1}</td>
                    ${mappedFields.map((f,fi) => {
                      const val = escHtml(row[csvColMap[f.key]] || "");
                      const isChp = f.key === "chp_number";
                      return `<td style="padding:7px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${isChp?"direction:ltr;text-align:right;font-size:12px;":"font-size:13px;"}">
                        ${isChp ? badge : ""}${val||"—"}
                      </td>`;
                    }).join("")}
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;
        })()}
      </div>

      <div class="confirm-import-box">
        ⚠️ פעולה זו תמחק את כל <strong>${businesses.length} העסקים הקיימים</strong> ותייבא
        <span class="ci-count">${csvRows.length} עסקים חדשים</span> מהקובץ. לא ניתן לבטל פעולה זו.
      </div>

// נרמול לחיפוש: בלי ניקוד/גרשיים/מקפים, אותיות קטנות
const gsNorm = s => String(s ?? "").toLowerCase().replace(/[֑-ׇ]/g, "").replace(/["'״׳`´’]/g, "").replace(/[-–_.,/\\()\[\]:;]/g, " ").replace(/\s+/g, " ").trim();
function gsLev(a, b, max) {            // מרחק עריכה חסום, כולל החלפת אותיות סמוכות (פקוס ~ פוקס)
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const d = [];
  for (let i = 0; i <= a.length; i++) { d[i] = [i]; }
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    let best = Infinity;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      if (d[i][j] < best) best = d[i][j];
    }
    if (best > max) return max + 1;
  }
  return d[a.length][b.length];
}
function gsTokenScore(t, full, words) {  // 0 = אין התאמה
  if (/\d/.test(t)) return full.includes(t) ? 3 : 0;          // מספרים: התאמה מדויקת (חלקית)
  if (full.includes(t)) return words.some(w => w === t) ? 4 : 3;
  const max = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;
  if (!max) return 0;
  for (const w of words) if (gsLev(t, w, max) <= max || (w.length > t.length && gsLev(t, w.slice(0, t.length), 1) <= (t.length >= 5 ? 1 : 0))) return 1.5;
  return 0;
}
const gsCache = new WeakMap();           // טקסט מנורמל לכל רשומה (בלי לשנות את הרשומה עצמה - היא נשלחת לשרת בעדכון)
function gsMatch(rec, tokens) {         // מחזיר ציון או 0 (כל המילים חייבות להתאים)
  let c = gsCache.get(rec);
  if (!c) { const full = gsNorm(Object.values(rec).join(" ")); c = { full, words: [...new Set(full.split(" "))] }; gsCache.set(rec, c); }
  let sc = 0;
  for (const t of tokens) { const x = gsTokenScore(t, c.full, c.words); if (!x) return 0; sc += x; }
  return sc;
}
function gsHighlight(val, tokens) {
  return String(val ?? "").split(/(\s+)/).map(w => {
    if (!w.trim()) return escHtml(w);
    const n = gsNorm(w);
    const hit = n && tokens.some(t => /\d/.test(t) ? n.includes(t) : (n.includes(t) || gsLev(t, n, t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0) <= (t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0)));
    return hit ? `<mark>${escHtml(w)}</mark>` : escHtml(w);
  }).join("");
}
const GS_BIZ_LABELS = { permit_name: "שם בהיתר", registrar_name: "שם ברשם", chp_number: 'ח.פ.', entity_type: "סוג ישות", category: "קטגוריה", region: "אזור", biz_type: "סוג עסק",

// חיפוש חברה לפי שם במאגר הרישום (company-info-db) - בחירה ממלאת את ח.פ. ומפעילה את החיפוש ברשם
let nsSeq = 0;
// חיפוש במאגר הרישום (לפי שם, או לפי תחילת מספר ח.פ.) - התוצאות מוצגות ב-#ns-out, כל חברה עם סימון קיים / חסר
async function registrySearchInto(q) {
  const out = document.getElementById("ns-out"); if (!out) return;
  const seq = ++nsSeq;
  out.innerHTML = `<div class="gs-info" style="margin:6px 0;">מחפש…</div>`;
  let d, errMsg = "";
  const ac = new AbortController(), tmo = setTimeout(() => ac.abort(), 10000);
  try { d = await apiFetch(`/registry-name-search?q=${encodeURIComponent(q)}`, { signal: ac.signal }); }
  catch (e) {
    errMsg = e.name === "AbortError" ? "החיפוש לא הגיב תוך 10 שניות" : /Unauthorized/.test(e.message) ? "הסיסמה שגויה - התחבר מחדש" : /503|לא מחובר/.test(e.message) ? "החיפוש לפי שם לא זמין (המאגר לא מחובר לפרויקט)" : "שגיאה בחיפוש: " + e.message;
  }
  clearTimeout(tmo);
  if (seq !== nsSeq) return;
  if (errMsg) { out.innerHTML = `<div class="gs-info" style="margin:6px 0;color:var(--red);">${escHtml(errMsg)}</div>`; return; }
  const rs = d.results || [];
  out.innerHTML = d.hint ? `<div class="gs-info" style="margin:6px 0;">${escHtml(d.hint)}</div>` : rs.length
    ? rs.map(r => { const ex = existingBiz(r.id);
        return `<div class="ns-row ${r.defunct ? "defunct" : ""} addable" data-id="${escHtml(String(r.id))}"><div><b>${escHtml(r.name)}</b>
          <div class="m">${escHtml(r.type)} · ח.פ. ${escHtml(String(r.id))}${r.status ? " · " + escHtml(r.status) : ""}</div><div>${statusBadge(ex)}</div></div>
          ${ex.length ? circ("edit", `data-edit="${escHtml(ex[0].id)}"`) : circ("add", `data-add="${escHtml(String(r.id))}"`)}</div>`; }).join("") + (d.more ? `<div class="gs-info" style="margin:6px 0;">יש עוד תוצאות - דייק את החיפוש</div>` : "")
    : `<div class="gs-info" style="margin:6px 0;">לא נמצאו חברות${/^\d+$/.test(q) ? " שמספרן מתחיל בספרות האלה" : " בשם הזה"}${(d.errors || []).length ? ` (שגיאה חלקית: ${escHtml(d.errors.join(" | "))})` : ""}</div>`;
  out.querySelectorAll(".ns-row.addable").forEach(row => row.addEventListener("click", () => {      // כל הכרטיסייה לחיצה: קיים = עריכה, חסר = הוספה
    const ex = existingBiz(row.dataset.id);
    if (ex.length) openFormSkip(ex[0].id); else addCompany(row.dataset.id);
  }));
}
function addCompany(id) {              // בחירת חברה חסרה מתוצאות החיפוש: ממלא ח.פ. ומשלים מהרשם

function bindEvents() {
  const on = (id, ev, fn) => { const el=document.getElementById(id); if(el) el.addEventListener(ev, fn); };

  on("srch",     "input",  e => { search        = e.target.value; render(); });
  on("f-cat",    "change", e => { filterCat     = e.target.value; render(); });
  on("f-region", "change", e => { filterRegion  = e.target.value; render(); });
  on("f-biztype","change", e => { filterBizType = e.target.value; render(); });
  on("f-vis",    "change", e => { filterVis     = e.target.value; render(); });

    document.getElementById("f-permit")?.addEventListener("input", updatePermitGate);

  if (view === "search") {

    if (g) { let tm; g.addEventListener("input", e => { gsQuery = e.target.value; clearTimeout(tm); tm = setTimeout(runGlobalSearch, 120); }); g.focus(); }
    runGlobalSearch();
  }

  // שמירת ח.פ. שמוקלד בזמן אמת כדי שלא יאבד בעת render מחדש
  const chpEl = document.getElementById("chp");
  if (chpEl) {
    let lt, pt;
    chpEl.addEventListener("input", e => {
      editBiz = { ...(editBiz || {}), chp_number: e.target.value };
      updateFormGate();
      const n = e.target.value.trim();
      clearTimeout(lt);
      if (/^\d{9}$/.test(n) && !chpCheckDigitOk(n)) {       // מספר לא תקין: מציגים מיד, בלי חיפוש ברשם
        clearTimeout(pt); lookupSeq++; chpResult = null; chpError = ""; lastAutoNumber = "";
        const ns0 = document.getElementById("ns-out"); if (ns0) ns0.innerHTML = "";
        const sp = document.getElementById("chp-spin"); if (sp) sp.style.display = "none";
        const lo0 = document.getElementById("lookup-out"); if (lo0) lo0.innerHTML = lookupOutHtml();
        updateFormGate(); return;
      }
      if (!chpResult) { const lo = document.getElementById("lookup-out"); if (lo && !/^\d{7,10}$/.test(n)) lo.innerHTML = lookupOutHtml(); }
      const ns = document.getElementById("ns-out");
      if (/^\d{3,8}$/.test(n)) { clearTimeout(pt); pt = setTimeout(() => registrySearchInto(n), 300); }            // תחילת מספר: רשימת חברות שהמספר שלהן מתחיל כך
      else if (ns && !/^\d{9,10}$/.test(n)) { clearTimeout(pt); ns.innerHTML = ""; }
      if (/^\d{9,10}$/.test(n)) { clearTimeout(pt); if (ns) ns.innerHTML = ""; }
      if (/^\d{7,10}$/.test(n) && n !== lastAutoNumber) lt = setTimeout(() => { lastAutoNumber = n; doLookup(true); }, n.length >= 9 ? 0 : 450);   // מ-7 ספרות: חיפוש ברשם אוטומטי
    });
  }

  // CSV drag-drop
  const dz = document.getElementById("drop-zone");
  if (dz) {
    dz.addEventListener("dragover",  e => { e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag-over"));
    dz.addEventListener("drop", e => {
      e.preventDefault();
      dz.classList.remove("drag-over");
      const file = e.dataTransfer?.files?.[0];
      if (file) handleCsvFile(file);
    });
  }
  const fi = document.getElementById("csv-file-input");
  if (fi) fi.addEventListener("change", e => {
    const file = e.target.files?.[0];

let noChp = false, permitMode = "";   // permitMode: '' (לא נבחר) / 'reg' (שם מהרשם) / 'other' (שם אחר)   // "אין ח.פ." (עסק בלי מספר רישום): שם הרשם ניתן להקלדה ידנית

const digitsOf = v => String(v ?? "").replace(/\D/g, "");

function permitLabel(list) {            // לפי visibility: ריק = כללי; 'פרטי' = יש גם פרטי; 'רק פרטי'

const ICON_PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v7M5 12h14"/></svg>';
const circ = (kind, attrs) => `<span class="circ-wrap"><button type="button" class="circ" ${attrs} title="${kind === "edit" ? "לעריכה" : "להוספה"}">${kind === "edit" ? ICON_PENCIL : ICON_PLUS}</button><span class="circ-cap">${kind === "edit" ? "לעריכה" : "להוספה"}</span></span>`;
const statusBadge = list => list.length ? `<span class="st-in">✔ קיים במאגר · ${escHtml(permitLabel(list))}</span>` : `<span class="st-out">לא קיים במאגר</span>`;

function chpDuplicates() { return chpResult ? existingBiz(chpResult.id).filter(b => b.id !== editBiz?.id) : []; }

// ספרת ביקורת של מספר תאגיד (9 ספרות): משקלות 1,2,1,2..., סכום ספרות המכפלות מתחלק ב-10
function chpCheckDigitOk(n) {

  return sum % 10 === 0;
}
function lookupOutHtml() {

  return `<p class="lookup-error">${chpError ? "⚠ "+escHtml(chpError) : ""}</p>${bad ? `<p class="lookup-error">⚠ ${bad}</p>` : ""}
    ${chpResult ? `

      </div>` : ""}`;
}

let lookupSeq = 0, lastAutoNumber = "";
// auto = חיפוש אוטומטי תוך כדי הקלדה (כשהמספר שלם): מעדכן רק את אזור התוצאה, בלי רינדור מחדש, כדי לא לאבד שדות שכבר מולאו
async function doLookup(auto) {
  const number = (document.getElementById("chp")?.value || "").trim();
  if (!number) { if (!auto) { chpError = "הכנס מספר רישום"; render(); } return; }
  if (noChp) return;
  editBiz = { ...(editBiz || {}), chp_number: number };
  const seq = ++lookupSeq;
  const out = () => document.getElementById("lookup-out");
  const spin = document.getElementById("chp-spin");
  if (auto) { chpResult = null; chpError = ""; if (spin) spin.style.display = ""; if (out()) out().innerHTML = `<div class="lookup-loading"><span class="spin"></span> מחפש ברשם…</div>`; updateFormGate(); }
  else { chpLoading = true; chpError = ""; chpResult = null; render(); }
  let res = null, err = "";
  try {
    res = await apiFetch(`/lookup?number=${encodeURIComponent(number)}`);
    if (!res.found) { err = number.length < 9 ? "" : "לא נמצא תאגיד עם מספר זה בשום רשם. לעסק בלי ח.פ. - לחץ \"אין ח.פ.\""; res = null; }   // מספר חלקי: בלי הודעת שגיאה (הרשימה למעלה מציגה מועמדים)
  } catch(e) { err = "שגיאת חיבור לרשם הרשמי"; }
  if (seq !== lookupSeq || (document.getElementById("chp")?.value || "").trim() !== number) {   // הוקלד מספר אחר בינתיים
    if (seq === lookupSeq) { if (spin) spin.style.display = "none"; if (auto && out()) out().innerHTML = ""; }
    return;
  }
  if (res) res.id = number;
  chpResult = res; chpError = err; chpLoading = false;
  if (spin) spin.style.display = "none";
  if (auto) { if (out()) out().innerHTML = lookupOutHtml(); updateFormGate(); } else render();
  if (chpResult) {
    const regEl = document.getElementById("f-reg");
    if (regEl) regEl.value = chpResult.name;     // כשיש ח.פ. השם נשלט ע"י הרשם (לא ניתן לעריכה)
    if (chpResult.bizType) {
      const btEl = document.getElementById("f-biztype");
      if (btEl && (!auto || !btEl.value.trim())) btEl.value = chpResult.bizType;
      editBiz = { ...(editBiz || {}), biz_type: chpResult.bizType };
    }
    formDirty = true;
  } else if (!editBiz?.id) {
    const regEl = document.getElementById("f-reg"); if (regEl) regEl.value = "";   // לא נמצא: אין שם מהרשם (אפשר ללחוץ "אין ח.פ.")
  }
}

const BOND_PICK = 'בחירת אג"ח מסוימים';

let bpState = null;   // {biz, rows:[{id,name,symbol,inMaya,scope,saved}], updated}

function openBondPickerFromForm() {      // מתוך טופס הוספת עסק חדש: העסק עוד לא נשמר, הבחירה נשמרת לפי ח.פ.
  const chp = (document.getElementById("chp")?.value || "").trim();

  openBondPicker({ id: "", chp_number: chp, registrar_name: (document.getElementById("f-reg")?.value || "").trim() });
}
async function openBondPicker(bizId) {
  const biz = typeof bizId === "object" ? bizId : businesses.find(b => b.id === bizId);
  if (!biz) return;
  const chp = String(biz.chp_number || "").trim();
  bpState = { biz, rows: [], updated: "", loading: true, error: "" };
  renderBondPicker();
  if (!chp) { bpState.loading = false; bpState.error = "לחברה אין ח.פ."; return renderBondPicker(); }
  try {
    const [snap, saved] = await Promise.all([
      fetch("/data/bonds_list/maya_securities.json").then(r => r.ok ? r.json() : null).catch(() => null),
      apiFetch("/approved-bonds?chp=" + encodeURIComponent(chp)),
    ]);
    const norm = x => String(x || "").replace(/^0+/, "");
    const inMaya = snap ? ((snap.companies || {})[norm(chp)] || (snap.companies || {})[chp] || []) : [];
    const savedBy = new Map((saved.rows || []).map(r => [Number(r.security_id), r]));
    const rows = inMaya.map(m => ({ id: m.security_id, name: m.name, symbol: m.symbol, inMaya: true,
                                    scope: (savedBy.get(m.security_id) || {}).scope || "", saved: savedBy.has(m.security_id) }));
    const seen = new Set(rows.map(r => r.id));
    for (const r of saved.rows || []) {
      if (!seen.has(Number(r.security_id))) rows.push({ id: Number(r.security_id), name: r.bond_name, symbol: r.symbol, inMaya: false, scope: r.scope, saved: true });
    }
    bpState.rows = rows; bpState.updated = snap ? snap.updated : ""; bpState.noSnap = !snap;
  } catch (e) {
    bpState.error = e.message === "Unauthorized" ? "נדרשת התחברות" : "שגיאה בטעינה: " + e.message;
  }
  bpState.loading = false;
  renderBondPicker();
}

const BP_ON  = "background:var(--navy,#274d5b);color:#fff;border-color:var(--navy,#274d5b);";

  const has = { private: r.scope === "private" || r.scope === "both", general: r.scope === "general" || r.scope === "both" };
  has[which] = !has[which];

async function inlineUpdateMany(id, fields) {

// טבלת העדכון: שינויים בשורות נשמרים כטיוטה (drafts) עד "שמור" בשורה או "שמירת כל השינויים"; הטיוטות לא הולכות לאיבוד בחיפוש / סינון / מיון
const drafts = {};
const draftFields = ["notes", "notes_scope", "visibility", "agch_approved", "permit_name", "registrar_name"];
const effBiz = b => ({ ...b, ...(drafts[b.id] || {}) });
const isDirty = id => { const d = drafts[id], b = businesses.find(x => x.id === id); return !!d && !!b && draftFields.some(f => f in d && (d[f] ?? "") !== (b[f] ?? "")); };
const dirtyIds = () => Object.keys(drafts).filter(isDirty);
function draftSet(id, field, value) {
  (drafts[id] = drafts[id] || {})[field] = value;
  render();
}
function noteInline(id, raw) {
  const v = (raw || "").trim();
  const biz = businesses.find(b => b.id === id); if (!biz) return;
  const d = drafts[id] = drafts[id] || {};
  d.notes = v;
  if (!v) d.notes_scope = "";
  else if (!(d.notes_scope ?? biz.notes_scope)) d.notes_scope = (biz.notes || "").trim() ? "companies" : "";   // הערה ישנה בלי בחירה = חברות; חדשה = חובה לבחור
  render();
}
function nameInline(id, raw) {          // עסק בלי ח.פ.: שם אחד, נשמר גם כשם בהיתר וגם כשם הרשם
  const v = (raw || "").trim();
  const d = drafts[id] = drafts[id] || {};
  d.permit_name = v; d.registrar_name = v;
  render();
}
function noteScopeChange(id, scope) { draftSet(id, "notes_scope", scope); }
async function saveRow(id, quiet) {
  const biz = businesses.find(b => b.id === id), d = drafts[id];
  if (!biz || !d) return true;
  const eff = effBiz(biz);
  if ("permit_name" in d && !(d.permit_name || "").trim()) { if (!quiet) showStatus("שם העסק לא יכול להיות ריק"); return false; }
  if ((eff.notes || "").trim() && !eff.notes_scope && !(biz.notes || "").trim()) { if (!quiet) showStatus("בחר היכן להציג את ההערה"); return false; }
  if ((eff.notes || "").trim() && !eff.notes_scope) d.notes_scope = "companies";
  const ok = await inlineUpdateMany(id, Object.fromEntries(draftFields.filter(f => f in d).map(f => [f, d[f]])));
  if (ok) { delete drafts[id]; if (!quiet) { showStatus("נשמר ✓"); render(); } }
  return !!ok;
}
async function saveAllRows() {
  const ids = dirtyIds(); if (!ids.length) return;
  let ok = 0, fail = 0;
  for (const id of ids) { if (await saveRow(id, true)) ok++; else fail++; }
  render();
  showStatus(fail ? `נשמרו ${ok}, ${fail} לא נשמרו (חסרה בחירה היכן להציג הערה)` : `נשמרו ${ok} שורות ✓`);
}

async function runRegistrySync() {
  const btn    = document.getElementById("sync-btn");
  const status = document.getElementById("sync-status");
  if (!btn || !status) return;

  btn.disabled = true;
  btn.textContent = "⏳ מסנכרן...";
  status.style.display  = "block";
  status.style.background = "var(--bg2)";
  status.innerHTML = "מתחיל סנכרון...";

  const withChp   = businesses.filter(b => b.chp_number);
  const total     = withChp.length;
  let processed   = 0;
  let updated     = 0;
  let errors      = 0;
  const CONCURRENCY = 5;   // 5 בקשות במקביל

  for (let i = 0; i < withChp.length; i += CONCURRENCY) {
    const batch = withChp.slice(i, i + CONCURRENCY);

    await Promise.all(batch.map(async (biz) => {
      try {
        const res = await apiFetch(`/lookup?number=${encodeURIComponent(biz.chp_number)}`);

        if (res.found) {
          const newName = (res.name    || "").trim();
          const newType = (res.bizType || "").trim();

          const nameChanged = newName && newName !== (biz.registrar_name || "").trim();
          const typeChanged = newType && newType !== (biz.biz_type       || "").trim();

          if (nameChanged || typeChanged) {
            const updatedBiz = {
              ...biz,
              registrar_name: nameChanged ? newName : biz.registrar_name,
              biz_type:       typeChanged ? newType : biz.biz_type,
            };
            await apiFetch(`/businesses/${biz.id}`, {
              method: "PUT",
              body:   JSON.stringify(updatedBiz),
            });
            businesses = businesses.map(b => b.id === biz.id ? updatedBiz : b);
            updated++;
          }
        }
      } catch(e) {
        errors++;
        console.warn(`Lookup failed (${biz.chp_number}):`, e.message);
      }

      processed++;
      const pct = Math.round((processed / total) * 100);
      status.innerHTML = `⏳ ${pct}% — עברו ${processed}/${total} · עודכנו: <strong>${updated}</strong>`;
    }));
  }

  status.style.background = "#edf7f1";
  status.innerHTML = `✅ סנכרון הושלם — עודכנו <strong>${updated}</strong> מתוך <strong>${total}</strong> עסקים${errors ? ` · שגיאות: ${errors}` : ""}`;
  btn.disabled    = false;
  btn.textContent = "🔄 עדכן שמות מרשם";
  render();
}

function openCsvImport() {
  csvStep = "upload"; csvHeaders = []; csvRows = [];
  csvColMap = {}; csvErrors = []; csvImported = 0; csvDeleted = 0;
  view = "csv-import";
  render();
}

// Parse CSV (handles quoted fields, commas inside quotes, \r\n and \n)
function parseCsv(text) {
  // Normalize line endings
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  const result = [];

  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let cur = "";
    let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuote) {
        if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
        else if (ch === '"') { inQuote = false; }
        else { cur += ch; }
      } else {
        if (ch === '"') { inQuote = true; }
        else if (ch === ',') { row.push(cur.trim()); cur = ""; }
        else { cur += ch; }
      }
    }
    row.push(cur.trim());
    result.push(row);
  }
  return result;
}

// Auto-detect which column maps to which field
function autoDetectMapping(headers) {
  const map = {};
  for (const field of CSV_FIELDS) {
    map[field.key] = -1;
    for (let i = 0; i < headers.length; i++) {
      const h = headers[i].trim().toLowerCase().replace(/['"]/g,"");
      for (const alias of field.aliases) {
        if (h === alias.toLowerCase().replace(/['"]/g,"") || h.includes(alias.toLowerCase())) {
          map[field.key] = i;
          break;
        }
      }
      if (map[field.key] >= 0) break;
    }
  }
  return map;
}

function handleCsvFile(file) {
  if (!file.name.endsWith(".csv") && file.type !== "text/csv") {
    alert("אנא בחר קובץ CSV בלבד");
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    let text = e.target.result;
    // Strip BOM if present
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    const parsed = parseCsv(text);
    if (parsed.length < 2) {
      alert("הקובץ ריק או מכיל שורה אחת בלבד");
      return;
    }
    csvHeaders = parsed[0];
    csvRows    = parsed.slice(1).filter(r => r.some(c => c.trim()));
    csvColMap  = autoDetectMapping(csvHeaders);
    csvStep    = "preview";
    render();
  };
  reader.readAsText(file, "UTF-8");
}

function updateColMap(fieldKey, value) {
  csvColMap[fieldKey] = parseInt(value, 10);
  // Update the select's 'mapped' class visually
  const sel = document.getElementById(`map-${fieldKey}`);
  if (sel) sel.className = parseInt(value) >= 0 ? "mapped" : "";
  // Re-render preview table only (lightweight update)
  const previewSection = document.querySelector(".preview-section");
  if (previewSection) {
    const previewRows = csvRows.slice(0, 8);
    const mappedFields = CSV_FIELDS.filter(f => (csvColMap[f.key]??-1) >= 0);
    previewSection.querySelector("table").innerHTML = `
      <thead><tr>${mappedFields.map(f=>`<th>${f.label}</th>`).join("")}</tr></thead>
      <tbody>
        ${previewRows.map(row=>`
          <tr>${mappedFields.map(f=>`<td>${escHtml(row[csvColMap[f.key]]||"")}</td>`).join("")}</tr>
        `).join("")}
      </tbody>`;
  }
}

// Normalize agch_approved values from CSV → system values
function normalizeAgch(val) {
  const v = (val || "").trim();
  if (v === "מאושר"  || v === "כן" || v === "yes" || v === "true" || v === "1") return "כן";
  if (v === "לא מאושר" || v === "לא" || v === "no"  || v === "false"|| v === "0") return "לא";
  if (v === "רק פרטי" || v === "פרטי בלבד" || v === "רק-פרטי") return "רק פרטי";
  if (v === "רק כללי" || v === "כללי בלבד" || v === "רק-כללי") return "רק כללי";
  return "";
}
async function startImport() {
  // Validate at least a name field is mapped
  const hasName = (csvColMap["registrar_name"]??-1) >= 0 || (csvColMap["permit_name"]??-1) >= 0;
  if (!hasName) {
    alert("חובה למפות לפחות את עמודת 'שם ברשם הרשמי' או 'שם בהיתר עסקה'");
    return;
  }

  csvStep    = "importing";
  csvErrors  = [];
  csvImported = 0;
  csvDeleted  = 0;

  const existingIds = businesses.map(b => b.id);
  csvTotal    = existingIds.length + csvRows.length;
  csvProgress = 0;
  csvPhase    = "מוחק עסקים קיימים...";
  render();

  // ── PHASE 1: Delete all existing ──
  for (const id of existingIds) {
    try {
      await apiFetch(`/businesses/${id}`, { method: "DELETE" });
      csvDeleted++;
    } catch(e) {
      csvErrors.push(`שגיאה במחיקת ${id}: ${e.message}`);
    }
    csvProgress++;
    updateProgressUI();
  }

  // Clear local cache
  businesses = [];

  // ── PHASE 2: Import new rows ──
  csvPhase = "מייבא שורות חדשות...";
  updateProgressUI();

  for (let i = 0; i < csvRows.length; i++) {
    const row = csvRows[i];
    const get = (key) => {
      const idx = csvColMap[key] ?? -1;
      return idx >= 0 ? (row[idx] || "").trim() : "";
    };

    const regName    = get("registrar_name");
    const permitName = get("permit_name");

    if (!regName && !permitName) {
      csvErrors.push(`שורה ${i+2}: חסר שם — דולגה`);
      csvProgress++;
      updateProgressUI();
      continue;
    }

    // ── Duplicate ח.פ. check within import ──
    const chpVal = get("chp_number");
    if (chpVal && businesses.some(b => (b.chp_number||"").trim() === chpVal)) {
      csvErrors.push(`שורה ${i+2} (${regName||permitName}): ח.פ. ${chpVal} כבר קיים — דולגה`);
      csvProgress++;
      updateProgressUI();
      continue;
    }

    const payload = {
      id:             uid(),
      chp_number:     get("chp_number"),
      registrar_name: regName,
      permit_name:    permitName,
      category:       get("category"),
      region:         get("region"),
      visibility:     get("visibility"),
      agch_approved:  normalizeAgch(get("agch_approved")),
      tase_has_agch:  get("tase_has_agch"),
      biz_type:       get("biz_type"),
      notes:          get("notes"),
      notes_scope:    get("notes") ? "companies" : "",
      has_details:    0,
    };

    try {
      await apiFetch("/businesses", { method: "POST", body: JSON.stringify(payload) });
      businesses = [...businesses, payload];
      csvImported++;
    } catch(e) {
      csvErrors.push(`שורה ${i+2} (${regName||permitName}): ${e.message}`);
    }

    csvProgress++;
    updateProgressUI();
  }

  csvStep = "done";
  render();
}

function updateProgressUI() {
  const fill  = document.querySelector(".progress-bar-fill");
  const label = document.querySelector(".progress-label span:last-child");
  const phase = document.querySelector(".progress-phase");
  const pct   = csvTotal > 0 ? Math.round((csvProgress / csvTotal) * 100) : 0;
  if (fill)  fill.style.width = pct + "%";
  if (label) label.textContent = `${csvProgress} / ${csvTotal}`;
  if (phase) phase.textContent = pct + "% הושלם";
  const phaseEl = document.querySelector(".progress-label span:first-child");
  if (phaseEl) phaseEl.textContent = csvPhase;
}

function finishImport() {
  showStatus(`✅ יובאו ${csvImported} עסקים בהצלחה`);
  setView("admin");
}

  const HEADERS = [
    "מספר תאגיד",
    "שם חברה / שותפות רשמי",
    "היתר עסקה על שם",
    "עיסוק",
    "סוג עסק",
    "היתר עסקה חברה",
    "היתר עסקה אגח",
    "אג\"ח בורסה",
    "הערות",
  ];

  const csvCell = (v) => {
    const s = (v || "").toString().replace(/"/g, '""');
    return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s}"` : s;
  };

  const lines = [
    HEADERS.map(csvCell).join(","),
    ...rows.map(b => [
      b.chp_number     || "",
      b.registrar_name || "",
      b.permit_name    || "",
      b.category       || "",
      b.biz_type       || "",
      b.visibility     || "",
      b.agch_approved === "כן" ? "מאושר" : b.agch_approved === "לא" ? "לא מאושר" : b.agch_approved === BOND_PICK ? "אג\"ח מסוימים" : "",
      b.tase_has_agch  || "",
      b.notes          || "",
    ].map(csvCell).join(",")),
  ];

  // UTF-8 BOM for Hebrew Excel compatibility
  const bom     = "\uFEFF";
  const content = bom + lines.join("\r\n");
  const blob    = new Blob([content], { type: "text/csv;charset=utf-8;" });
  const url     = URL.createObjectURL(blob);
  const a       = document.createElement("a");
  const date    = new Date().toISOString().slice(0,10);
  a.href        = url;
  a.download    = `עסקים-מורשים-${date}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showStatus(`✅ יוצאו ${rows.length} שורות`);
}

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function uniqueCats() {
  return [...new Set(businesses.map(b=>b.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"he"));
}

function setSort(col) {
  if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
  else { sortCol = col; sortDir = "asc"; }
  render();
}

function clearFilters() {
  search = ""; filterCat = ""; filterRegion = "";
  filterBizType = ""; filterVis = ""; filterAgch = "";
  render();
}

function agchSortKey(b) {
  if ((b.tase_has_agch||"") !== "יש") return 0;
  if ((b.agch_approved||"") === "כן")  return 2;
  if ((b.agch_approved||"") === "לא")  return 1;
  return 1;
}

function filteredAndSorted() {
  const q = search.trim().toLowerCase();

  // Filter
  let rows = businesses.filter(b => {
    if (q) {
      const name = displayName(b).toLowerCase();
      const hits = name.includes(q)
        || (b.category   ||"").toLowerCase().includes(q)
        || (b.region     ||"").toLowerCase().includes(q)
        || (b.chp_number ||"").toLowerCase().includes(q)
        || (b.notes      ||"").toLowerCase().includes(q)
        || (b.biz_type   ||"").toLowerCase().includes(q);
      if (!hits) return false;
    }
    if (filterCat     && b.category    !== filterCat)     return false;
    if (filterRegion  && b.region      !== filterRegion)  return false;
    if (filterBizType && b.biz_type    !== filterBizType) return false;
    if (filterVis     && b.visibility  !== filterVis)     return false;
    if (filterAgch) {
      const has  = (b.tase_has_agch||"").trim();
      const appr = (b.agch_approved||"").trim();
      if (filterAgch === "אין"      && has === "יש")                 return false;
      if (filterAgch === "אין"      && has !== "יש")                 {} // keep
      else if (filterAgch === "מאושר"   && !(has === "יש" && appr === "כן")) return false;
      else if (filterAgch === "לא מאושר" && !(has === "יש" && appr === "לא")) return false;
      else if (filterAgch === "יש"      && has !== "יש")             return false;
    }
    return true;
  });

  // Sort
  const he = (a, b) => (a||"").localeCompare(b||"", "he");
  rows.sort((a, b) => {
    let cmp = 0;
    switch (sortCol) {
      case "num":        cmp = 0; break;
      case "chp":        cmp = (a.chp_number||"").localeCompare(b.chp_number||""); break;
      case "name":       cmp = he(displayName(a), displayName(b)); break;
      case "category":   cmp = he(a.category,   b.category);   break;
      case "region":     cmp = he(a.region,      b.region);     break;
      case "biz_type":   cmp = he(a.biz_type,    b.biz_type);   break;
      case "visibility": cmp = he(a.visibility,  b.visibility); break;
      case "agch":       cmp = agchSortKey(a) - agchSortKey(b); break;
      case "notes":      cmp = he(a.notes,       b.notes);      break;
    }
    return sortDir === "asc" ? cmp : -cmp;
  });

  return rows;
}

// keep old filtered() for CSV export
function filtered() { return filteredAndSorted(); }

function showStatus(msg) {
  const el = document.getElementById("status-bar");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}
