name = "business-registry"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "business-registry-db"
database_id = "61e1a52e-1083-478d-914c-5375d8ed59bb"

# מאגר הרישום (חברות, שותפויות, עמותות) - אותו בסיס נתונים ש-revach משתמש בו. קריאה בלבד מהקוד.
[[d1_databases]]
binding = "DB1"
database_name = "company-info-db"
database_id = "c1d082fc-c125-4f62-8b33-9b62d5bda2da"

# משתנים רגילים (לא סודות - הקובץ ציבורי). סודות מוגדרים בנפרד:
#   wrangler pages secret put <שם> --project-name harav-levin
# שלוחת ימות 6 (functions/api/ivr-company.js):
[vars]
IVR_REC_MIN_SEC = "1"   # הקלטה: מינימום שניות
IVR_REC_MAX_SEC = "8"   # הקלטה: מקסימום שניות ("0" = בלי הגבלה)
# אופציונלי (ברירות המחדל בקוד): IVR_REC_FOLDER = "/6", IVR_BACK_FOLDER = "/5"

# After setup, run:
# npx wrangler d1 create business-registry-db
# and paste the database_id above
