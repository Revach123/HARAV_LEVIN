<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>מכון להיתר עסקה למהדרין</title>
<style>
  /* Alef — אותו גופן של האתר (SIL OFL), מאורח בריפו */
  @font-face{font-family:'Alef';font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/alef/alef-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Alef';font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/alef/alef-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Alef';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/alef/alef-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Alef';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/alef/alef-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Alef','Heebo','Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;background:#fff;color:#3b3d3d;font-size:16px;line-height:1.5}
  header{background:#fff;border-bottom:3px solid #2aada1;color:#274d5b;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:10}
  header a.admin-link{background:#274d5b;border:1px solid #274d5b;color:#fff;font-size:13px;padding:6px 14px;border-radius:4px;text-decoration:none;font-family:inherit}
  header a.admin-link:hover{background:#1e8f85;border-color:#1e8f85}
  .logo-link{display:flex;align-items:center;text-decoration:none}
  #site-logo{height:46px;width:auto;display:block}
  #site-title{font-size:20px;font-weight:700;color:#274d5b}
  main{max-width:1400px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
</style>
</head>
<body>

<header>
  <div>
    <a href="/" class="logo-link"><img id="site-logo" src="logo.png" alt="מכון היתר עסקה למהדרין" onerror="this.style.display='none';document.getElementById('site-title').style.display='';"><h1 id="site-title" style="display:none;">מכון להיתר עסקה למהדרין</h1></a>
  </div>
  <a class="admin-link" href="/admin">כניסת מנהל</a>
</header>

<main>
  <div id="pub-host"></div>
</main>

<!-- התצוגה הציבורית = display.html בדיוק (אותו חלון שמוטמע בוורדפרס), דרך embed.js: כותרת צמודה, סרגל גלילה, תאריך עדכון.
     data-offset = גובה הכותרת הקבועה של דף זה (56). הניהול נמצא בדף נפרד: /admin (admin.html). -->
<script>
(function () {
  var sc = document.createElement("script");
  sc.src = "embed.js";
  sc.setAttribute("data-offset", "56");
  document.getElementById("pub-host").appendChild(sc);
})();
</script>
</body>
</html>
