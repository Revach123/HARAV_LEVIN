<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מכון להיתר עסקה למהדרין</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f7f7f5;color:#1a1a1a;font-size:14px;line-height:1.5}
  header{background:#1a3a5c;color:#fff;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  header a{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;padding:6px 14px;border-radius:6px;text-decoration:none}
  header a:hover{background:rgba(255,255,255,.2)}
  main{max-width:1400px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
</style>
</head>
<body>

<header>
  <div></div>
  <a href="/admin">כניסת מנהל</a>
</header>

<main>
  <div id="pub-host"></div>
</main>

<!-- התצוגה הציבורית = display.html בדיוק (אותו חלון שמוטמע בוורדפרס), דרך embed.js: כותרת צמודה, סרגל גלילה, תאריך עדכון.
     data-offset = גובה הכותרת הקבועה של דף זה (56). הניהול נמצא בדף נפרד: /admin (admin.html). -->
<script>
(function () {
  var sc = document.createElement("script");
  sc.src = "embed.js";
  sc.setAttribute("data-offset", "56");
  document.getElementById("pub-host").appendChild(sc);
})();
</script>
</body>
</html>
