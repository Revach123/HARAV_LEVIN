<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רשימת עסקים מורשים</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:   #1a3a5c;
    --navy2:  #1e4570;
    --gold:   #c9a227;
    --bg:     #f7f7f5;
    --bg2:    #ffffff;
    --border: #e0ddd8;
    --text:   #1a1a1a;
    --muted:  #6b6b6b;
    --light:  #a0a0a0;
    --red:    #c0392b;
    --green:  #1e7e4a;
    --green-bg: #edf7f1;
    --green-border: #a8d9bc;
    --danger-bg: #fdf0ef;
  }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    color: #fff;
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  header h1 { font-size: 17px; font-weight: 500; letter-spacing: .01em; }
  header small { font-size: 12px; opacity: .65; margin-right: 10px; }
  #admin-toggle {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    color: #fff;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s;
  }
  #admin-toggle:hover { background: rgba(255,255,255,.2); }

  /* ── MAIN ── */
  main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .controls input, .controls select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg2);
    font-size: 14px;
    color: var(--text);
    direction: rtl;
    outline: none;
    transition: border-color .15s;
  }
  .controls input { flex: 1; min-width: 200px; }
  .controls input:focus, .controls select:focus { border-color: var(--navy); }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
  thead th {
    text-align: right;
    padding: 11px 14px;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    background: var(--bg);
  }
  thead th:first-child { border-radius: 10px 0 0 0; }
  thead th:last-child  { border-radius: 0 10px 0 0; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: #f0f0ee; }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  td { padding: 11px 14px; vertical-align: middle; }
  td.num { color: var(--light); font-size: 12px; width: 36px; }
  td.biz-name { font-weight: 500; }
  td.biz-name .permit { color: var(--muted); font-weight: 400; font-size: 13px; }
  td.cat-cell span {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    background: #eef0f5;
    color: var(--muted);
  }
  td.notes-cell { color: var(--light); font-size: 12px; }
  .empty-row td { text-align: center; padding: 2.5rem; color: var(--light); }

  /* ── ACTION BUTTONS (admin table) ── */
  .act-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 13px;
    transition: background .15s;
    color: var(--muted);
  }
  .act-btn:hover { background: var(--bg); }
  .act-btn.del { color: var(--red); }
  .confirm-row td { background: var(--danger-bg) !important; }
  .confirm-btns { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .confirm-btns .yes {
    background: var(--red); color: #fff;
    border: none; padding: 4px 10px;
    border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  .confirm-btns .no {
    background: none; border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 13px;
    color: var(--muted);
  }

  /* ── PANEL (login / form) ── */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    max-width: 520px;
    margin: 2rem auto;
  }
  .panel h2 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .panel-header h2 { margin: 0; }

  /* ── FORM ── */
  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    font-size: 14px;
    color: var(--text);
    direction: rtl;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--navy); background: #fff; }
  .field input.ltr { direction: ltr; text-align: left; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── LOOKUP BOX ── */
  .lookup-box {
    background: #f0f4f8;
    border: 1px solid #c8d8ea;
    border-radius: 9px;
    padding: 1.1rem;
    margin-bottom: 1.25rem;
  }
  .lookup-box p.lbl { font-size: 12px; font-weight: 500; color: var(--navy); margin-bottom: 10px; }
  .lookup-row { display: flex; gap: 8px; }
  .lookup-row input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    direction: ltr;
    text-align: left;
    outline: none;
    transition: border-color .15s;
  }
  .lookup-row input:focus { border-color: var(--navy); }
  .lookup-row button {
    padding: 9px 16px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: background .15s;
  }
  .lookup-row button:hover { background: var(--navy2); }
  .lookup-row button:disabled { opacity: .55; cursor: default; }
  .lookup-result {
    margin-top: 10px;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: 7px;
    padding: 10px 14px;
  }
  .lookup-result .found-name { font-size: 15px; font-weight: 500; margin: 3px 0; }
  .lookup-result .found-meta { font-size: 12px; color: var(--muted); }
  .lookup-error { color: var(--red); font-size: 13px; margin-top: 8px; }

  /* ── BUTTONS ── */
  .btn-primary {
    width: 100%;
    padding: 11px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
    margin-top: .5rem;
  }
  .btn-primary:hover { background: var(--navy2); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s;
  }
  .btn-ghost:hover { border-color: var(--navy); color: var(--navy); }
  .btn-add {
    padding: 8px 16px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-add:hover { background: var(--navy2); }
  .btn-danger {
    padding: 8px 16px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-danger:hover { background: #a93226; }
  .btn-danger:disabled { opacity: .55; cursor: default; }

  /* ── ADMIN BAR ── */
  .admin-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 8px;
  }
  .admin-bar h2 { font-size: 16px; font-weight: 500; color: var(--muted); }

  /* ── ERROR ── */
  .error-msg { color: var(--red); font-size: 13px; margin: 6px 0; min-height: 20px; }

  /* ── STATUS BAR ── */
  #status-bar {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 99;
  }
  #status-bar.show { opacity: 1; }

  /* ── COUNT BADGE ── */
  .count { font-size: 13px; color: var(--muted); }

  /* ── LOADING SPINNER ── */
  .loading {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-size: 14px;
  }

  /* ════════════════════════════════════════════
     CSV IMPORT STYLES
  ════════════════════════════════════════════ */

  .csv-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    max-width: 860px;
    margin: 1.5rem auto;
  }
  .csv-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.75rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px solid var(--border);
  }
  .csv-panel-header h2 { font-size: 18px; font-weight: 500; }

  /* Drop Zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    background: var(--bg);
    position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--navy);
    background: #f0f4f8;
  }
  .drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-zone .dz-icon { font-size: 2.5rem; margin-bottom: .75rem; }
  .drop-zone .dz-title { font-size: 15px; font-weight: 500; color: var(--navy); margin-bottom: .3rem; }
  .drop-zone .dz-sub { font-size: 13px; color: var(--muted); }
  .drop-zone .dz-btn {
    display: inline-block;
    margin-top: 1rem;
    padding: 8px 20px;
    background: var(--navy);
    color: #fff;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
  }

  /* Column mapping */
  .mapping-section { margin-bottom: 1.5rem; }
  .mapping-section h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: .9rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .mapping-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .mapping-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .mapping-row label { font-size: 12px; color: var(--muted); }
  .mapping-row select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    font-size: 13px;
    color: var(--text);
    direction: rtl;
    outline: none;
    cursor: pointer;
    transition: border-color .15s;
  }
  .mapping-row select:focus { border-color: var(--navy); }
  .mapping-row select.mapped { border-color: var(--green); background: var(--green-bg); }

  /* Preview table */
  .preview-section { margin-bottom: 1.5rem; }
  .preview-section h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: .75rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .preview-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 9px;
    max-height: 260px;
    overflow-y: auto;
  }
  .preview-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .preview-wrap thead th {
    padding: 8px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  .preview-wrap tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .preview-wrap tbody tr:hover { background: #f5f5f3; }
  .preview-wrap td { padding: 8px 12px; }

  /* Confirm box */
  .confirm-import-box {
    background: #fff8e6;
    border: 1px solid #f0d070;
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1.25rem;
    font-size: 14px;
  }
  .confirm-import-box strong { color: var(--red); }
  .confirm-import-box .ci-count { color: var(--green); font-weight: 500; }

  /* Progress */
  .progress-wrap { margin: 1.5rem 0; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar-bg {
    background: var(--border);
    border-radius: 20px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--navy);
    border-radius: 20px;
    transition: width .15s;
  }
  .progress-phase {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }

  /* Done summary */
  .done-box {
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: 10px;
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .done-box .done-icon { font-size: 2.5rem; margin-bottom: .5rem; }
  .done-box h3 { font-size: 17px; font-weight: 500; color: var(--green); margin-bottom: .4rem; }
  .done-box p { font-size: 14px; color: var(--muted); }
  .done-error-box {
    background: var(--danger-bg);
    border: 1px solid #f0b0aa;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-top: .75rem;
    font-size: 13px;
    color: var(--red);
    max-height: 120px;
    overflow-y: auto;
  }

  /* Steps indicator */
  .steps {
    display: flex;
    gap: 0;
    margin-bottom: 1.75rem;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .step {
    flex: 1;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--light);
    background: var(--bg);
    text-align: center;
    border-left: 1px solid var(--border);
    transition: all .2s;
  }
  .step:last-child { border-left: none; }
  .step.active { background: var(--navy); color: #fff; font-weight: 500; }
  .step.done { background: var(--green-bg); color: var(--green); }
</style>
</head>
<body>

<header>
  <div>
    <h1>רשימת עסקים מורשים</h1>
  </div>
  <button id="admin-toggle" onclick="toggleAdmin()">כניסת מנהל</button>
</header>

<main>
  <div id="app"><div class="loading">טוען נתונים...</div></div>
</main>

<div id="status-bar"></div>

<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let businesses = [];
let isAdmin    = false;
let adminToken = "";
let view       = "table";   // table | login | admin | form | csv-import
let search     = "";
let filterCat  = "";
let editBiz    = null;
let deleteId   = null;
let chpResult  = null;
let chpError   = "";
let chpLoading = false;
let saving     = false;

// CSV import state
let csvStep       = "upload";   // upload | preview | importing | done
let csvHeaders    = [];
let csvRows       = [];         // array of arrays (raw)
let csvColMap     = {};         // fieldKey → colIndex (or -1)
let csvProgress   = 0;
let csvTotal      = 0;
let csvPhase      = "";
let csvErrors     = [];
let csvImported   = 0;
let csvDeleted    = 0;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ─────────────────────────────────────────────
//  FIELD DEFINITIONS FOR CSV MAPPING
// ─────────────────────────────────────────────
const CSV_FIELDS = [
  { key: "chp_number",     label: "ח.פ. / מספר רישום",  aliases: ["חפ","ח.פ","ח.פ.","chp","chp_number","מספר רישום","מספר תאגיד","ס.מ.","ס\"מ"] },
  { key: "registrar_name", label: "שם ברשם הרשמי",       aliases: ["שם ברשם","שם רשמי","registrar_name","registrar","שם תאגיד","שם החברה"] },
  { key: "permit_name",    label: "שם בהיתר עסקה",       aliases: ["שם בהיתר","היתר","permit_name","permit","שם עסק","שם"] },
  { key: "category",       label: "קטגוריה",              aliases: ["קטגוריה","category","ענף","סוג"] },
  { key: "region",         label: "אזור",                 aliases: ["אזור","region","מחוז"] },
  { key: "visibility",     label: "פרטי / כללי",          aliases: ["פרטי/כללי","פרטי כללי","visibility","סוג עסק"] },
  { key: "agch_approved",  label: "אישור אג\"ח",          aliases: ["אישור אגח","אישור אג\"ח","agch_approved","אגח מאושר"] },
  { key: "tase_has_agch",  label: "אג\"ח בורסה",          aliases: ["אגח בורסה","אג\"ח בורסה","tase_has_agch","בורסה"] },
  { key: "notes",          label: "הערות",                aliases: ["הערות","notes","remarks","הערה"] },
];

// ─────────────────────────────────────────────
//  API HELPERS
// ─────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (adminToken) headers["Authorization"] = `Bearer ${adminToken}`;
  const res = await fetch("/api" + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

async function loadBusinesses() {
  businesses = await apiFetch("/businesses");
  render();
}

// ─────────────────────────────────────────────
//  DISPLAY NAME
// ─────────────────────────────────────────────
function displayName(b, asHTML = false) {
  const r = (b.registrar_name || "").trim();
  const p = (b.permit_name    || "").trim();
  if (r && p && r !== p) {
    return asHTML
      ? `${escHtml(r)} <span class="permit">(${escHtml(p)})</span>`
      : `${r} (${p})`;
  }
  return escHtml(r || p || "—");
}

function escHtml(s) {
  return (s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if      (view === "table")      app.innerHTML = renderTable();
  else if (view === "login")      app.innerHTML = renderLogin();
  else if (view === "admin")      app.innerHTML = renderAdminTable();
  else if (view === "form")       app.innerHTML = renderForm();
  else if (view === "csv-import") app.innerHTML = renderCsvImport();
  bindEvents();
  document.getElementById("admin-toggle").textContent =
    isAdmin ? "יציאה ממנהל" : "כניסת מנהל";
}

// ── TABLE (public) ──
function renderTable() {
  const cats = uniqueCats();
  const rows = filtered();
  return `
    <div class="controls">
      <input type="text" id="srch" placeholder="🔍  חיפוש שם / קטגוריה / אזור..." value="${escHtml(search)}">
      <select id="catf">
        <option value="">כל הקטגוריות</option>
        ${cats.map(c=>`<option value="${escHtml(c)}" ${filterCat===c?"selected":""}>${escHtml(c)}</option>`).join("")}
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>שם עסק</th>
            <th>קטגוריה</th>
            <th>אזור</th>
            <th>פרטי/כללי</th>
            <th>אג"ח בורסה</th>
            <th>אישור אג"ח</th>
            <th>הערות</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length === 0
            ? `<tr class="empty-row"><td colspan="8">לא נמצאו תוצאות</td></tr>`
            : rows.map((b,i) => `
              <tr>
                <td class="num">${i+1}</td>

// ════════════════════════════════════════════
//  CSV IMPORT VIEW
// ════════════════════════════════════════════
function renderCsvImport() {
  const stepLabels = ["העלאת קובץ", "מיפוי עמודות", "ייבוא", "סיום"];
  const stepIndex  = { upload: 0, preview: 1, importing: 2, done: 3 };
  const curStep    = stepIndex[csvStep] ?? 0;

  const stepsHtml = stepLabels.map((lbl, i) => {
    const cls = i < curStep ? "done" : i === curStep ? "active" : "";
    return `<div class="step ${cls}">${i < curStep ? "✓ " : ""}${lbl}</div>`;
  }).join("");

  let body = "";

  // ── STEP 1: Upload ──
  if (csvStep === "upload") {
    body = `
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-file-input').click()">
        <input type="file" id="csv-file-input" accept=".csv,text/csv" style="display:none">
        <div class="dz-icon">📄</div>
        <div class="dz-title">גרור קובץ CSV לכאן</div>
        <div class="dz-sub">או לחץ לבחירת קובץ</div>
        <div class="dz-btn">בחר קובץ CSV</div>
      </div>
      <div style="margin-top:1rem;padding:12px 16px;background:var(--bg);border-radius:8px;border:1px solid var(--border);">
        <p style="font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px;">📋 עמודות נתמכות (לפי שם הכותרת בקובץ):</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${CSV_FIELDS.map(f=>`
            <span style="font-size:12px;padding:3px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;color:var(--muted);">
              ${f.label}
            </span>`).join("")}
        </div>
        <p style="font-size:12px;color:var(--light);margin-top:8px;">הקובץ יכול להכיל כותרות בעברית או באנגלית — המערכת מזהה אוטומטית.</p>
      </div>`;
  }

  // ── STEP 2: Preview + Mapping ──
  else if (csvStep === "preview") {
    const previewRows = csvRows.slice(0, 8);
    const colOptions  = (selVal) => `
      <option value="-1" ${selVal===-1?"selected":""}>— לא למפות —</option>
      ${csvHeaders.map((h,i) => `<option value="${i}" ${selVal===i?"selected":""}>${escHtml(h)}</option>`).join("")}`;

    body = `
      <div class="mapping-section">
        <h3>מיפוי עמודות — ${csvHeaders.length} עמודות זוהו, ${csvRows.length} שורות נתונים</h3>
        <div class="mapping-grid">
          ${CSV_FIELDS.map(f => {
            const val = csvColMap[f.key] ?? -1;
            return `
              <div class="mapping-row">
                <label>${f.label}</label>
                <select id="map-${f.key}" onchange="updateColMap('${f.key}',this.value)" class="${val>=0?'mapped':''}">
                  ${colOptions(val)}
                </select>
              </div>`;
          }).join("")}
        </div>
      </div>

      <div class="preview-section">
        <h3>תצוגה מקדימה — ${Math.min(8,csvRows.length)} שורות ראשונות מתוך ${csvRows.length}</h3>
        <div class="preview-wrap">
          <table>
            <thead>
              <tr>
                ${CSV_FIELDS
                    .filter(f => (csvColMap[f.key]??-1) >= 0)
                    .map(f=>`<th>${f.label}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${previewRows.map(row => `
                <tr>
                  ${CSV_FIELDS
                      .filter(f => (csvColMap[f.key]??-1) >= 0)
                      .map(f => `<td>${escHtml(row[csvColMap[f.key]] || "")}</td>`).join("")}
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>

      <div class="confirm-import-box">
        ⚠️ פעולה זו תמחק את כל <strong>${businesses.length} העסקים הקיימים</strong> ותייבא
        <span class="ci-count">${csvRows.length} עסקים חדשים</span> מהקובץ. לא ניתן לבטל פעולה זו.
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn-ghost" onclick="csvStep='upload';render()">← חזור</button>
        <button class="btn-danger" onclick="startImport()">
          🗑 מחק ${businesses.length} קיימים וייבא ${csvRows.length} חדשים
        </button>
      </div>`;
  }

  // ── STEP 3: Importing ──
  else if (csvStep === "importing") {
    const pct = csvTotal > 0 ? Math.round((csvProgress / csvTotal) * 100) : 0;
    body = `
      <div style="text-align:center;padding:1rem 0 0.5rem;">
        <div style="font-size:1.8rem;margin-bottom:.5rem;">⏳</div>
        <p style="font-size:15px;font-weight:500;margin-bottom:.3rem;">מייבא נתונים...</p>
        <p style="font-size:13px;color:var(--muted);">אנא המתן, אל תסגור את הדף</p>
      </div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>${csvPhase}</span>
          <span>${csvProgress} / ${csvTotal}</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${pct}%"></div>
        </div>
        <div class="progress-phase">${pct}% הושלם</div>
      </div>`;
  }

  // ── STEP 4: Done ──
  else if (csvStep === "done") {
    body = `
      <div class="done-box">
        <div class="done-icon">✅</div>
        <h3>הייבוא הושלם בהצלחה</h3>
        <p>נמחקו <strong>${csvDeleted}</strong> עסקים קיימים · יובאו <strong>${csvImported}</strong> עסקים חדשים</p>
      </div>
      ${csvErrors.length > 0 ? `
        <div class="done-error-box">
          <strong>שגיאות (${csvErrors.length}):</strong><br>
          ${csvErrors.map(e=>escHtml(e)).join("<br>")}
        </div>` : ""}
      <div style="display:flex;gap:10px;justify-content:center;margin-top:1rem;">
        <button class="btn-primary" style="width:auto;padding:10px 28px;" onclick="finishImport()">חזור לניהול</button>
      </div>`;
  }

  return `
    <div class="csv-panel">
      <div class="csv-panel-header">
        <h2>📥 ייבוא עסקים מ-CSV</h2>
        ${csvStep !== "importing" ? `<button class="btn-ghost" onclick="setView('admin')">✕ ביטול</button>` : ""}
      </div>
      <div class="steps">${stepsHtml}</div>
      ${body}
    </div>`;
}

// ─────────────────────────────────────────────
//  BIND EVENTS
// ─────────────────────────────────────────────
function bindEvents() {
  const on = (id, ev, fn) => { const el=document.getElementById(id); if(el) el.addEventListener(ev, fn); };

  on("srch","input", e => { search = e.target.value; render(); });
  on("catf","change", e => { filterCat = e.target.value; render(); });
  on("pwd","keydown", e => { if(e.key==="Enter") doLogin(); });

  // CSV drag-drop
  const dz = document.getElementById("drop-zone");
  if (dz) {
    dz.addEventListener("dragover",  e => { e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag-over"));
    dz.addEventListener("drop", e => {
      e.preventDefault();
      dz.classList.remove("drag-over");
      const file = e.dataTransfer?.files?.[0];
      if (file) handleCsvFile(file);
    });
  }
  const fi = document.getElementById("csv-file-input");
  if (fi) fi.addEventListener("change", e => {
    const file = e.target.files?.[0];
    if (file) handleCsvFile(file);
  });

  // Auto-focus
  const pwd = document.getElementById("pwd");
  if (pwd) setTimeout(() => pwd.focus(), 40);
}

// ─────────────────────────────────────────────
//  ACTIONS
// ─────────────────────────────────────────────
function setView(v) {
  view = v;
  if (v !== "csv-import") {
    csvStep = "upload"; csvHeaders = []; csvRows = []; csvColMap = {};
    csvErrors = []; csvImported = 0; csvDeleted = 0;
  }
  chpResult = null; chpError = "";
  render();
}

function toggleAdmin() {
  if (isAdmin) { isAdmin = false; adminToken = ""; setView("table"); }
  else setView("login");
}

async function doLogin() {
  const pwd = document.getElementById("pwd")?.value || "";
  adminToken = pwd;
  try {
    await apiFetch("/businesses");
    isAdmin = true; setView("admin");
  } catch {
    isAdmin = true; setView("admin");
  }
}

function openForm(id) {
  editBiz = id ? businesses.find(b => b.id === id) || {} : {};
  chpResult = null; chpError = "";
  setView("form");
}

function preDelete(id)  { deleteId = id;   render(); }
function cancelDelete() { deleteId = null; render(); }

async function confirmDelete(id) {
  try {
    await apiFetch(`/businesses/${id}`, { method: "DELETE" });
    businesses = businesses.filter(b => b.id !== id);
    deleteId = null;
    showStatus("נמחק בהצלחה");
    render();
  } catch(e) {
    if (e.message === "Unauthorized") { handleUnauth(); return; }
    alert("שגיאה במחיקה: " + e.message);
  }
}

async function doLookup() {
  const number = (document.getElementById("chp")?.value || "").trim();
  if (!number) { chpError = "הכנס מספר רישום"; render(); return; }
  chpLoading = true; chpError = ""; chpResult = null; render();
  try {
    const res = await apiFetch(`/lookup?number=${encodeURIComponent(number)}`);
    if (res.found) chpResult = res;
    else chpError = "לא נמצא תאגיד עם מספר זה בשום רשם";
  } catch(e) {
    chpError = "שגיאת חיבור לרשם הרשמי";
  }
  chpLoading = false; render();
  if (chpResult) {
    const el = document.getElementById("f-reg");
    if (el) el.value = chpResult.name;
  }
}

async function inlineUpdate(id, field, value) {
  const biz = businesses.find(b => b.id === id);
  if (!biz) return;
  const updated = { ...biz, [field]: value };
  try {
    await apiFetch(`/businesses/${id}`, { method: "PUT", body: JSON.stringify(updated) });
    businesses = businesses.map(b => b.id === id ? updated : b);
    showStatus("עודכן ✓");
  } catch(e) {
    if (e.message === "Unauthorized") { handleUnauth(); return; }
    showStatus("שגיאה בשמירה"); render();
  }
}

async function runRegistrySync() {
  const btn    = document.getElementById("sync-btn");

async function doSave() {
  const regName    = (document.getElementById("f-reg")?.value    || "").trim();
  const permitName = (document.getElementById("f-permit")?.value || "").trim();
  const errEl = document.getElementById("form-err");
  if (!regName && !permitName) {

    return;
  }
  const payload = {
    id:             editBiz?.id || uid(),
    chp_number:     (document.getElementById("chp")?.value         || "").trim(),
    entity_type:    (document.getElementById("entity-type")?.value || "company").trim(),
    registrar_name: regName,
    permit_name:    permitName,
    category:       (document.getElementById("f-cat")?.value       || "").trim(),
    region:         (document.getElementById("f-region")?.value    || "").trim(),
    notes:          (document.getElementById("f-notes")?.value     || "").trim(),
    visibility:     (document.getElementById("f-visibility")?.value|| "").trim(),
    agch_approved:  (document.getElementById("f-agch")?.value      || "").trim(),
    has_details:    0,
  };
  saving = true; render();
  try {
    const isEdit = !!editBiz?.id;
    if (isEdit) {
      await apiFetch(`/businesses/${payload.id}`, { method: "PUT",  body: JSON.stringify(payload) });
      businesses = businesses.map(b => b.id === payload.id ? { ...b, ...payload } : b);
    } else {
      await apiFetch("/businesses", { method: "POST", body: JSON.stringify(payload) });
      businesses = [...businesses, payload];
    }
    showStatus(isEdit ? "עודכן בהצלחה" : "נוסף בהצלחה");
    saving = false; setView("admin");
  } catch(e) {
    saving = false;
    if (e.message === "Unauthorized") { handleUnauth(); return; }
    const errEl2 = document.getElementById("form-err");
    if (errEl2) errEl2.textContent = "שגיאה: " + e.message;
    render();
  }
}

// ════════════════════════════════════════════

function openCsvImport() {
  csvStep = "upload"; csvHeaders = []; csvRows = [];
  csvColMap = {}; csvErrors = []; csvImported = 0; csvDeleted = 0;
  view = "csv-import";
  render();
}

// Parse CSV (handles quoted fields, commas inside quotes, \r\n and \n)
function parseCsv(text) {
  // Normalize line endings
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  const result = [];

  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let cur = "";
    let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuote) {
        if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
        else if (ch === '"') { inQuote = false; }
        else { cur += ch; }
      } else {
        if (ch === '"') { inQuote = true; }
        else if (ch === ',') { row.push(cur.trim()); cur = ""; }
        else { cur += ch; }
      }
    }
    row.push(cur.trim());
    result.push(row);
  }
  return result;
}

// Auto-detect which column maps to which field
function autoDetectMapping(headers) {
  const map = {};
  for (const field of CSV_FIELDS) {
    map[field.key] = -1;
    for (let i = 0; i < headers.length; i++) {
      const h = headers[i].trim().toLowerCase().replace(/['"]/g,"");
      for (const alias of field.aliases) {
        if (h === alias.toLowerCase().replace(/['"]/g,"") || h.includes(alias.toLowerCase())) {
          map[field.key] = i;
          break;
        }
      }
      if (map[field.key] >= 0) break;
    }
  }
  return map;
}

function handleCsvFile(file) {
  if (!file.name.endsWith(".csv") && file.type !== "text/csv") {
    alert("אנא בחר קובץ CSV בלבד");
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    let text = e.target.result;
    // Strip BOM if present
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    const parsed = parseCsv(text);
    if (parsed.length < 2) {
      alert("הקובץ ריק או מכיל שורה אחת בלבד");
      return;
    }
    csvHeaders = parsed[0];
    csvRows    = parsed.slice(1).filter(r => r.some(c => c.trim()));
    csvColMap  = autoDetectMapping(csvHeaders);
    csvStep    = "preview";
    render();
  };
  reader.readAsText(file, "UTF-8");
}

function updateColMap(fieldKey, value) {
  csvColMap[fieldKey] = parseInt(value, 10);
  // Update the select's 'mapped' class visually
  const sel = document.getElementById(`map-${fieldKey}`);
  if (sel) sel.className = parseInt(value) >= 0 ? "mapped" : "";
  // Re-render preview table only (lightweight update)
  const previewSection = document.querySelector(".preview-section");
  if (previewSection) {
    const previewRows = csvRows.slice(0, 8);
    const mappedFields = CSV_FIELDS.filter(f => (csvColMap[f.key]??-1) >= 0);
    previewSection.querySelector("table").innerHTML = `
      <thead><tr>${mappedFields.map(f=>`<th>${f.label}</th>`).join("")}</tr></thead>
      <tbody>
        ${previewRows.map(row=>`
          <tr>${mappedFields.map(f=>`<td>${escHtml(row[csvColMap[f.key]]||"")}</td>`).join("")}</tr>
        `).join("")}
      </tbody>`;
  }
}

async function startImport() {
  // Validate at least a name field is mapped
  const hasName = (csvColMap["registrar_name"]??-1) >= 0 || (csvColMap["permit_name"]??-1) >= 0;
  if (!hasName) {
    alert("חובה למפות לפחות את עמודת 'שם ברשם הרשמי' או 'שם בהיתר עסקה'");
    return;
  }

  csvStep    = "importing";
  csvErrors  = [];
  csvImported = 0;
  csvDeleted  = 0;

  const existingIds = businesses.map(b => b.id);
  csvTotal    = existingIds.length + csvRows.length;
  csvProgress = 0;
  csvPhase    = "מוחק עסקים קיימים...";
  render();

  // ── PHASE 1: Delete all existing ──
  for (const id of existingIds) {
    try {
      await apiFetch(`/businesses/${id}`, { method: "DELETE" });
      csvDeleted++;
    } catch(e) {
      csvErrors.push(`שגיאה במחיקת ${id}: ${e.message}`);
    }
    csvProgress++;
    updateProgressUI();
  }

  // Clear local cache
  businesses = [];

  // ── PHASE 2: Import new rows ──
  csvPhase = "מייבא שורות חדשות...";
  updateProgressUI();

  for (let i = 0; i < csvRows.length; i++) {
    const row = csvRows[i];
    const get = (key) => {
      const idx = csvColMap[key] ?? -1;
      return idx >= 0 ? (row[idx] || "").trim() : "";
    };

    const regName    = get("registrar_name");
    const permitName = get("permit_name");

    if (!regName && !permitName) {
      csvErrors.push(`שורה ${i+2}: חסר שם — דולגה`);
      csvProgress++;
      updateProgressUI();
      continue;
    }

    const payload = {
      id:             uid(),
      chp_number:     get("chp_number"),
      registrar_name: regName,
      permit_name:    permitName,
      category:       get("category"),
      region:         get("region"),
      visibility:     get("visibility"),
      agch_approved:  get("agch_approved"),
      tase_has_agch:  get("tase_has_agch"),
      notes:          get("notes"),
      has_details:    0,
    };

    try {
      await apiFetch("/businesses", { method: "POST", body: JSON.stringify(payload) });
      businesses = [...businesses, payload];
      csvImported++;
    } catch(e) {
      csvErrors.push(`שורה ${i+2} (${regName||permitName}): ${e.message}`);
    }

    csvProgress++;
    updateProgressUI();
  }

  csvStep = "done";
  render();
}

function updateProgressUI() {
  const fill  = document.querySelector(".progress-bar-fill");
  const label = document.querySelector(".progress-label span:last-child");
  const phase = document.querySelector(".progress-phase");
  const pct   = csvTotal > 0 ? Math.round((csvProgress / csvTotal) * 100) : 0;
  if (fill)  fill.style.width = pct + "%";
  if (label) label.textContent = `${csvProgress} / ${csvTotal}`;
  if (phase) phase.textContent = pct + "% הושלם";
  const phaseEl = document.querySelector(".progress-label span:first-child");
  if (phaseEl) phaseEl.textContent = csvPhase;
}

function finishImport() {
  showStatus(`✅ יובאו ${csvImported} עסקים בהצלחה`);
  setView("admin");
}

function uniqueCats() {
  return [...new Set(businesses.map(b=>b.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"he"));
}

function filtered() {
  return businesses.filter(b => {
    const q  = search.trim().toLowerCase();
    const ms = !q ||
      displayName(b).toLowerCase().includes(q) ||
      (b.category || "").toLowerCase().includes(q) ||
      (b.region   || "").toLowerCase().includes(q);
    const mc = !filterCat || b.category === filterCat;
    return ms && mc;
  });
}

function showStatus(msg) {
  const el = document.getElementById("status-bar");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}
